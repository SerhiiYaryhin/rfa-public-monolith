plugins {
	id 'java'
	id 'war'
//	id 'org.springframework.boot' version '3.2.1'
//	id 'io.spring.dependency-management' version '1.1.4'

	id 'org.springframework.boot' version '3.5.4'
	id 'io.spring.dependency-management' version '1.1.7'
}

ext {
	set('springAiVersion', "1.0.0")
	set('springBootVersion', '3.5.4')
	thymeleafExtrasSpringsecurityVersion = '3.1.2.RELEASE'
	commonsIoVersion = '2.15.1'
	telegrambotsVersion = '7.10.0'
	stallaVersion = '1.1.0'
	romeVersion = '2.1.0'
}

group = 'media.toloka'
version = '1.0.0'

tasks.withType(JavaCompile) {
	options.compilerArgs << "-Xlint:deprecation" << "-Xlint:unchecked"
}

java {
	toolchain {
		languageVersion = JavaLanguageVersion.of(21)
//		languageVersion = JavaLanguageVersion.of(17)
	}
}

repositories {
	mavenCentral()
//	maven { url 'https://repo.spring.io/milestone' }
//	maven { url 'https://repo.spring.io/snapshot' }
}

dependencies {
	implementation "org.telegram:telegrambots-springboot-longpolling-starter:${telegrambotsVersion}"
	implementation "org.telegram:telegrambots-client:${telegrambotsVersion}"
	implementation "org.telegram:telegrambots-abilities:${telegrambotsVersion}"

	implementation 'javax.mail:javax.mail-api:1.6.2'
	implementation 'org.springframework.boot:spring-boot-starter'
	implementation 'org.springframework.boot:spring-boot-starter-amqp'
	implementation 'org.springframework.boot:spring-boot-starter-mail:3.2.1'
	implementation 'org.springframework:spring-context-support:6.1.3'
	implementation 'org.springframework.boot:spring-boot-starter-data-jpa'
	implementation 'org.springframework.boot:spring-boot-starter-security'
	implementation 'org.springframework.boot:spring-boot-starter-web'
	implementation 'org.springframework.boot:spring-boot-starter-thymeleaf'
	implementation 'org.springframework.boot:spring-boot-starter-actuator'
	implementation 'org.springframework.boot:spring-boot-starter-cache'
	implementation 'com.github.ben-manes.caffeine:caffeine'

	implementation "org.thymeleaf.extras:thymeleaf-extras-springsecurity6:${thymeleafExtrasSpringsecurityVersion}"
	implementation "commons-io:commons-io:${commonsIoVersion}"

	implementation 'org.thymeleaf.extras:thymeleaf-extras-java8time:3.0.4.RELEASE'
	implementation group: 'org.imgscalr', name: 'imgscalr-lib', version: '4.2'
	implementation group: 'org.json', name: 'json', version: '20240303'
	implementation group: 'net.jthink', name: 'jaudiotagger', version: '3.0.1'
	implementation group: 'org.apache.commons', name: 'commons-lang3', version: '3.16.0'

	implementation 'com.googlecode.owasp-java-html-sanitizer:owasp-java-html-sanitizer:20240325.1'

	implementation group: 'org.springframework.ai', name: 'spring-ai-starter-model-ollama', version: '1.0.0'

	implementation("org.springframework.boot:spring-boot-starter-websocket")
	implementation("org.springframework:spring-messaging")

	implementation("dev.stalla:stalla:${stallaVersion}")
	implementation("com.rometools:rome:${romeVersion}")

	implementation 'org.springframework:spring-context-support:6.1.3'

	developmentOnly 'org.springframework.boot:spring-boot-devtools'

	implementation 'com.google.code.gson:gson'
	compileOnly 'org.projectlombok:lombok'
	annotationProcessor 'org.projectlombok:lombok'
	runtimeOnly 'org.postgresql:postgresql'

	// Testing
	testImplementation 'org.springframework.boot:spring-boot-starter-test'
	testImplementation 'org.springframework.security:spring-security-test'
	testRuntimeOnly 'org.junit.platform:junit-platform-launcher'
	testImplementation 'com.h2database:h2'
}

dependencyManagement {
	imports {
		mavenBom "org.springframework.ai:spring-ai-bom:${springAiVersion}"
	}
}

tasks.named('test') {
	useJUnitPlatform()
}
