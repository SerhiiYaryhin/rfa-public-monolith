---
- name: Deploy Janus Gateway via Docker using Ansible
  hosts: janus.rfa
  become: yes

  vars:
    coturn_realm: "rfa.toloka.media"
    coturn_static_secret: "YOUR_GENERATED_LONG_SECRET_KEY"
    janus_admin_secret: "RFA_Super_Secret_Admin_Key"
    janus_base_dir: "/opt/janus"

  tasks:
    - name: Ensure Docker SDK for Python is installed
      apt:
        name: python3-docker
        state: present
        update_cache: yes

    - name: Create configuration directories for Janus
      file:
        path: "{{ item }}"
        state: directory
        mode: '0755'
      loop:
        - "{{ janus_base_dir }}"
        - "{{ janus_base_dir }}/conf"

    - name: Deploy Janus main config from template
      template:
        src: templates/janus.jcfg.j2
        dest: "{{ janus_base_dir }}/conf/janus.jcfg"
        mode: '0644'

    - name: Deploy Janus AudioBridge config from template
      template:
        src: templates/janus.plugin.audiobridge.jcfg.j2
        dest: "{{ janus_base_dir }}/conf/janus.plugin.audiobridge.jcfg"
        mode: '0644'

    - name: Deploy Janus WebSockets config from template
      template:
        src: templates/janus.transport.websockets.jcfg.j2
        dest: "{{ janus_base_dir }}/conf/janus.transport.websockets.jcfg"
        mode: '0644'

    - name: Deploy Janus HTTP config from template
      template:
        src: templates/janus.transport.http.jcfg.j2
        dest: "{{ janus_base_dir }}/conf/janus.transport.http.jcfg"
        mode: '0644'

    - name: Run Janus Gateway Container
      community.docker.docker_container:
        name: rfa-janus
        image: sucwangsr/janus-webrtc-gateway-docker:latest
        state: started
        restart_policy: unless-stopped
        network_mode: host
        recreate: yes # <--- Важливо: змусить Ansible перестворити контейнер із новими файлами
        volumes:
          - "{{ janus_base_dir }}/conf:/usr/local/etc/janus"