---
- name: Full Reset and Deploy Clean Janus via Custom Docker
  hosts: janus.rfa
  become: yes
  remote_user: rfa-worker

  vars:
    external_domain: "rfa.toloka.media"
    internal_gateway: "gate.rfa"
    coturn_static_secret: "YOUR_GENERATED_LONG_SECRET_KEY"
    janus_admin_secret: "RFA_Super_Secret_Admin_Key"
    janus_docker_dir: "/opt/janus-clean"
    janus_container_name: "rfa-janus-custom"
    janus_http_api_port: 8088

  tasks:
    # --- ЕТАП 1: ГЛИБОКЕ ОЧИЩЕННЯ СИСТЕМИ ---
    - name: Section 1 - Deep Cleanup
      block:
        - name: 1.1. Stop and remove Janus container
          community.docker.docker_container:
            name: "{{ janus_container_name }}"
            state: absent

        - name: 1.2. Stop native Janus service if exists
          systemd:
            name: janus
            state: stopped
            enabled: no
          ignore_errors: yes

        - name: 1.3. Kill any zombie janus or docker-proxy processes
          shell: |
            pkill -9 janus || true
            pkill -9 docker-proxy || true
            sleep 2

        - name: 1.4. Remove all Janus related configurations
          file:
            path: "{{ item }}"
            state: absent
          loop:
            - "/etc/janus"
            - "{{ janus_docker_dir }}"

        - name: 1.5. Purge native Janus package
          apt:
            name: janus
            state: absent
            purge: yes
      tags: cleanup

    # --- ЕТАП 2: ПІДГОТОВКА ТА ЗБІРКА ---
    - name: Section 2 - Build
      block:
        - name: 2.1. Create clean build directory
          file:
            path: "{{ item }}"
            state: directory
            mode: '0755'
          loop:
            - "{{ janus_docker_dir }}"
            - "{{ janus_docker_dir }}/conf"

        - name: 2.2. Generate Dockerfile
          template:
            src: templates/Dockerfile.j2
            dest: "{{ janus_docker_dir }}/Dockerfile"

        - name: 2.3. Deploy Janus configs to build dir
          template:
            src: "templates/{{ item.src }}"
            dest: "{{ janus_docker_dir }}/conf/{{ item.dest }}"
          loop:
            - { src: 'janus.jcfg.j2', dest: 'janus.jcfg' }
            - { src: 'janus.plugin.audiobridge.jcfg.j2', dest: 'janus.plugin.audiobridge.jcfg' }
            - { src: 'janus.transport.http.jcfg.j2', dest: 'janus.transport.http.jcfg' }
            - { src: 'janus.transport.websockets.jcfg.j2', dest: 'janus.transport.websockets.jcfg' }

        - name: 2.4. Build Docker Image
          community.docker.docker_image:
            name: rfa-janus-custom
            build:
              path: "{{ janus_docker_dir }}"
            source: build
            state: present
            force_source: yes
      tags: build

    # --- ЕТАП 3: ЗАПУСК (BRIDGE MODE) ---
    - name: Section 3 - Deploy
      block:
        - name: 3.1. Start Janus Container with explicit IPv4 mapping
          community.docker.docker_container:
            name: "{{ janus_container_name }}"
            image: rfa-janus-custom
            state: started
            restart_policy: unless-stopped
            # Явно вказуємо біндінг на IPv4 адресу 0.0.0.0 хоста
            ports:
              - "0.0.0.0:8088:8088"
              - "0.0.0.0:8188:8188"
              - "0.0.0.0:7088:7088"
              - "0.0.0.0:7188:7188"
              - "0.0.0.0:10000-10200:10000-10200/udp"
            volumes:
              - "{{ janus_docker_dir }}/conf:/etc/janus"
      tags: deploy

    # --- ЕТАП 4: ПЕРЕВІРКА ---
    - name: Section 4 - Health Check
      block:
        - name: 4.1. Wait for Janus API
          wait_for:
            port: "{{ janus_http_api_port }}"
            timeout: 30

        - name: 4.2. Verify API response
          uri:
            url: "http://localhost:{{ janus_http_api_port }}/janus/info"
            method: GET
          register: janus_info

        - name: 4.3. Print Status
          debug:
            msg: "Janus is FINALLY running! Version: {{ janus_info.json.version_string }}"
      tags: check
