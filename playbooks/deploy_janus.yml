---
- name: Deploy Native Janus Gateway on Ubuntu 24.04
  hosts: janus.rfa
  become: yes

  vars:
    coturn_realm: "rfa.toloka.media"
    coturn_static_secret: "YOUR_GENERATED_LONG_SECRET_KEY"
    janus_admin_secret: "RFA_Super_Secret_Admin_Key"

  tasks:
    - name: Install Janus Gateway and transport dependencies from Ubuntu Repos
      apt:
        name:
          - janus
          - libmicrohttpd-dev
          - libjansson-dev
          - libssl-dev
          - libglib2.0-dev
        state: present
        update_cache: yes

    - name: Ensure Janus system configuration directory exists
      file:
        path: /etc/janus
        state: directory
        owner: root
        group: root
        mode: '0755'

    - name: Deploy janus.jcfg configuration
      template:
        src: templates/janus.jcfg.j2
        dest: /etc/janus/janus.jcfg
        owner: root
        group: root
        mode: '0644'
      notify: restart janus

    - name: Deploy Janus AudioBridge config
      template:
        src: templates/janus.plugin.audiobridge.jcfg.j2
        dest: /etc/janus/janus.plugin.audiobridge.jcfg
        owner: root
        group: root
        mode: '0644'
      notify: restart janus

    - name: Deploy Janus HTTP transport config
      template:
        src: templates/janus.transport.http.jcfg.j2
        dest: /etc/janus/janus.transport.http.jcfg
        owner: root
        group: root
        mode: '0644'
      notify: restart janus

    - name: Deploy Janus WebSockets transport config
      template:
        src: templates/janus.transport.websockets.jcfg.j2
        dest: /etc/janus/janus.transport.websockets.jcfg
        owner: root
        group: root
        mode: '0644'
      notify: restart janus

    - name: Ensure Janus systemd service is enabled and running
      systemd:
        name: janus
        state: started
        enabled: true

  handlers:
    - name: restart janus
      systemd:
        name: janus
        state: restarted