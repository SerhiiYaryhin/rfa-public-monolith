---
- name: Full Reset and Deploy Janus Gateway via APT
  hosts: janus.rfa
  become: yes
  remote_user: rfa-worker

  vars:
    # Мережева топологія
    external_domain: "rfa.toloka.media"
    internal_gateway: "gate.rfa"
    
    # Coturn налаштування (Janus звертається до нього всередині мережі)
    coturn_static_secret: "YOUR_GENERATED_LONG_SECRET_KEY"
    
    # Janus налаштування
    janus_admin_secret: "RFA_Super_Secret_Admin_Key"
    janus_config_dir: "/etc/janus"
    janus_old_docker_dir: "/opt/janus"
    janus_container_name: "rfa-janus"
    janus_old_image: "canopsis/janus-gateway:latest"
    janus_http_api_port: 8088

  tasks:
    # --- ЕТАП 1: ПОВНЕ ВИДАЛЕННЯ ДОКЕР-ВЕРСІЇ ---
    - name: Section 1 - Cleanup Docker Version
      block:
        - name: 1.1. Stop and remove Janus container
          community.docker.docker_container:
            name: "{{ janus_container_name }}"
            state: absent

        - name: 1.2. Remove Janus Docker image
          community.docker.docker_image:
            name: "{{ janus_old_image }}"
            state: absent
          ignore_errors: yes # Може бути відсутній

        - name: 1.3. Remove old Docker configuration directory
          file:
            path: "{{ janus_old_docker_dir }}"
            state: absent
      tags: cleanup

    # --- ЕТАП 2: ВСТАНОВЛЕННЯ ЧЕРЕЗ APT ---
    - name: Section 2 - Native Installation
      block:
        - name: 2.1. Update apt cache
          apt:
            update_cache: yes

        - name: 2.2. Install Janus Gateway and dependencies
          apt:
            name: 
              - janus
              - libmicrohttpd-dev
              - libjansson-dev
              - libssl-dev
              - libsrtp2-dev
              - libsofia-sip-ua-dev
              - libglib2.0-dev
              - libopus-dev
              - libogg-dev
              - libcurl4-openssl-dev
              - pkg-config
              - gengetopt
              - libtool
              - automake
            state: present

        - name: 2.3. Ensure Janus configuration directory exists
          file:
            path: "{{ janus_config_dir }}"
            state: directory
            mode: '0755'

        - name: 2.4. Deploy Janus main config from template
          template:
            src: templates/janus.jcfg.j2
            dest: "{{ janus_config_dir }}/janus.jcfg"
            mode: '0644'

        - name: 2.5. Deploy Janus AudioBridge config from template
          template:
            src: templates/janus.plugin.audiobridge.jcfg.j2
            dest: "{{ janus_config_dir }}/janus.plugin.audiobridge.jcfg"
            mode: '0644'

        - name: 2.6. Deploy Janus HTTP transport config from template
          template:
            src: templates/janus.transport.http.jcfg.j2
            dest: "{{ janus_config_dir }}/janus.transport.http.jcfg"
            mode: '0644'

        - name: 2.7. Deploy Janus WebSocket transport config from template
          template:
            src: templates/janus.transport.websockets.jcfg.j2
            dest: "{{ janus_config_dir }}/janus.transport.websockets.jcfg"
            mode: '0644'

        - name: 2.8. Enable and restart Janus service
          systemd:
            name: janus
            state: restarted
            enabled: yes
            daemon_reload: yes
      tags: deploy

    # --- ЕТАП 3: КОНТРОЛЬ ПРАЦЕЗДАТНОСТІ ---
    - name: Section 3 - Health Check
      block:
        - name: 3.1. Wait for Janus HTTP API to be available
          wait_for:
            port: "{{ janus_http_api_port }}"
            timeout: 30
            msg: "Janus API did not start on port {{ janus_http_api_port }} within 30 seconds"

        - name: 3.2. Verify Janus status via HTTP API
          uri:
            url: "http://localhost:{{ janus_http_api_port }}/janus/info"
            method: GET
            status_code: 200
          register: janus_info
          ignore_errors: yes

        - name: 3.3. Check if Janus is running correctly
          debug:
            msg: "Janus version: {{ janus_info.json.version_string | default('Unknown') }}. Server is UP via APT!"
          when: janus_info.status == 200
      tags: check
