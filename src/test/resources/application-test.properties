# ===================== TEST CONFIGURATION =====================
# Use H2 for testing instead of PostgreSQL
spring.datasource.url=jdbc:h2:mem:testdb;DB_CLOSE_DELAY=-1;MODE=PostgreSQL
spring.datasource.driver-class-name=org.h2.Driver
spring.datasource.username=sa
spring.datasource.password=

# JPA / Hibernate settings for tests
spring.jpa.database-platform=org.hibernate.dialect.H2Dialect
spring.jpa.hibernate.ddl-auto=create-drop
spring.jpa.show-sql=false

# Disable features not needed for tests
spring.mail.host=localhost
spring.mail.port=25
rabbitmq.host=localhost

# RFA Server properties (dummy values for tests)
media.toloka.rfa.server.client_dir=/tmp/test_clients
