# ===================================================================
# НАЛАШТУВАННЯ RABBITMQ ДЛЯ JANUS
# ===================================================================
# Назва черги RabbitMQ для загальних команд (API)
rabbitmq.queueJanus=janus-commands
# Назва черги RabbitMQ для адміністративних команд (Admin API)
rabbitmq.queueJanusAdmin=janus-admin-commands
rabbitmq.reply.timeout=5000
# Vhost для Janus (має співпадати з vhost у janus.transport.rabbitmq.jcfg)
janus.rabbitmq.vhost=/rfa-dev

# Налаштування для FFmpeg агента
ffmpeg.agent.url=http://localhost:8000
janus.host.internal=localhost

# ===================================================================
# ГЛОБАЛЬНА БЕЗПЕКА JANUS
# ===================================================================
# Секретний ключ для виконання адміністративних дій у Janus
janus.admin_secret=janusoverlord
# Загальний секретний ключ Janus (якщо використовується)
janus.secret=janusrockstolk

