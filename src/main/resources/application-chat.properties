# ===================================================================
# НАЛАШТУВАННЯ RABBITMQ ДЛЯ JANUS
# ===================================================================
# Назва черги RabbitMQ, яку ми виправляли минулого разу
rabbitmq.queueJanus=janus-commands
rabbitmq.reply.timeout=2000

# Налаштування для FFmpeg агента
ffmpeg.agent.url=http://localhost:8000
janus.host.internal=localhost

# ===================================================================
# ГЛОБАЛЬНА БЕЗПЕКА JANUS
# ===================================================================
#janus.admin_secret=RFA_Super_Secret_Admin_Key_2026

# Секретний ключ для виконання адміністративних дій у Janus (створення кімнат)
janus.admin_secret=janusoverlord

# Якщо ваш клієнт також використовує загальний secret для плагінів, краще додати й його
janus.secret=janusrockstolk

