<!DOCTYPE HTML>
<html lang="uk" xmlns:th="http://www.thymeleaf.org">
<head>
    <meta charset="UTF-8"/>
    <title>Толока - Створення треку</title>
    <meta name="viewport" content="width=device-width, initial-scale=1">
    <link th:rel="stylesheet" th:href="@{/css/bootstrap.min.css} "/>
    <link th:rel="stylesheet" th:href="@{/css/dropzone.min.css}"/>
    <link th:rel="stylesheet" th:href="@{/css/toastr.min.css}"/>
    <script src="https://use.fontawesome.com/releases/v6.3.0/js/all.js" crossorigin="anonymous"></script>
    <script src="https://cdn.tiny.cloud/1/jfs2v9uma7vkxn632w42djz02jxqivtjdlovkkqzafgboa10/tinymce/6/tinymce.min.js" referrerpolicy="origin"></script>
    <style>
        .step-container { margin-top: 50px; }
        .mandatory-star { color: red; }
        .form-group { margin-bottom: 15px; }
        .file-card { cursor: pointer; transition: transform 0.2s, box-shadow 0.2s; border-radius: 10px; }
        .file-card:hover { transform: translateY(-3px); box-shadow: 0 4px 15px rgba(0,0,0,0.1); }
        .file-card.selected { border: 2px solid #198754; background-color: #f8fff9; }
        .storage-list { max-height: 400px; overflow-y: auto; }
        .nav-tabs .nav-link { font-weight: bold; padding: 12px 20px; }
        .nav-tabs .nav-link.active { color: #0d6efd; border-bottom: 3px solid #0d6efd; }
    </style>
</head>
<body>

<header>
    <div th:insert="~{/fragments/navbar :: navbarUniverse}"/>
</header>

<div class="container step-container">
    <div class="row justify-content-center">
        <div class="col-lg-10">
            
            <h2 class="mb-4 text-center fw-bold">Створення нового треку</h2>

            <!-- Крок 1: Вибір файлу (Вкладки) -->
            <div class="card shadow-sm border-0 mb-4">
                <div class="card-header bg-white p-0">
                    <ul class="nav nav-tabs border-0" id="uploadTabs" role="tablist">
                        <li class="nav-item" role="presentation">
                            <button class="nav-link active border-0 bg-transparent" id="upload-tab" data-bs-toggle="tab" data-bs-target="#upload-pane" type="button" role="tab">
                                <i class="fas fa-upload me-2"></i>Завантажити новий
                            </button>
                        </li>
                        <li class="nav-item" role="presentation">
                            <button class="nav-link border-0 bg-transparent" id="storage-tab" data-bs-toggle="tab" data-bs-target="#storage-pane" type="button" role="tab">
                                <i class="fas fa-folder-open me-2"></i>Вибрати зі сховища
                            </button>
                        </li>
                    </ul>
                </div>
                <div class="card-body p-4">
                    <div class="tab-content" id="uploadTabsContent">
                        <!-- Панель завантаження -->
                        <div class="tab-pane fade show active" id="upload-pane" role="tabpanel">
                            <div id="dropzone">
                                <form action="/api/store/upload?type=STORE_TRACK" class="dropzone needsclick border-dashed" id="demo-upload" method="post">
                                    <input type="hidden" th:name="${_csrf.parameterName}" th:value="${_csrf.token}" />
                                    <div class="dz-message needsclick">
                                        <button type="button" class="dz-button">
                                            <i class="fas fa-cloud-upload-alt fa-4x mb-3 text-primary"></i><br>
                                            <span class="fs-5">Перетягніть аудіофайл сюди або натисніть для вибору</span>
                                        </button>
                                    </div>
                                </form>
                            </div>
                        </div>
                        
                        <!-- Панель сховища -->
                        <div class="tab-pane fade" id="storage-pane" role="tabpanel">
                            <div class="input-group mb-3">
                                <span class="input-group-text bg-white"><i class="fas fa-search text-muted"></i></span>
                                <input type="text" id="file-search" class="form-control" placeholder="Пошук у сховищі за назвою...">
                            </div>
                            
                            <div class="storage-list border rounded p-2 bg-light">
                                <div th:if="${#lists.isEmpty(audioFiles)}" class="text-center py-5">
                                    <i class="fas fa-music fa-3x mb-3 text-muted"></i>
                                    <p class="text-muted">Аудіофайлів у сховищі не знайдено</p>
                                </div>
                                <div class="row g-2" id="storage-items">
                                    <div th:each="file : ${audioFiles}" class="col-12 col-md-6 file-item">
                                        <div class="file-card card p-3 border h-100" th:data-uuid="${file.uuid}" th:data-filename="${file.filename}">
                                            <div class="d-flex align-items-center">
                                                <div class="flex-shrink-0">
                                                    <i class="fas fa-file-audio fa-2x text-primary"></i>
                                                </div>
                                                <div class="flex-grow-1 ms-3 overflow-hidden">
                                                    <div class="fw-bold text-truncate" th:text="${file.filename}">Назва файлу</div>
                                                    <small class="text-muted" th:text="${#dates.format(file.createdate, 'dd.MM.yyyy HH:mm')}"></small>
                                                </div>
                                                <div class="ms-2">
                                                    <button type="button" class="btn btn-sm btn-outline-success select-file-btn">Вибрати</button>
                                                </div>
                                            </div>
                                        </div>
                                    </div>
                                </div>
                            </div>
                        </div>
                    </div>
                    
                    <div id="selected-file-info" class="alert alert-success mt-3 d-none border-0 shadow-sm">
                        <div class="d-flex align-items-center">
                            <i class="fas fa-check-circle me-3 fs-4"></i>
                            <div>
                                <div class="fw-bold">Файл готовий: <span id="current-filename">не обрано</span></div>
                                <small class="text-muted">Тепер заповніть інформацію про трек нижче</small>
                            </div>
                        </div>
                    </div>
                </div>
            </div>

            <!-- Крок 2: Опис -->
            <div id="form-container" class="card shadow-sm border-0">
                <div class="card-header bg-success text-white py-3">
                    <h4 class="mb-0"><i class="fas fa-info-circle me-2"></i>Інформація про трек</h4>
                </div>
                <div class="card-body p-4">
                    <form id="track-details-form" th:action="@{/creater/edittrack}" method="post" th:object="${track}">
                        <input type="hidden" id="track-uuid" name="uuid" th:value="*{uuid}"/>
                        
                        <div class="row">
                            <div class="col-md-6 form-group">
                                <label class="form-label fw-bold" for="autor">Виконавець <span class="mandatory-star">*</span></label>
                                <input type="text" th:field="*{autor}" class="form-control" placeholder="Ім'я автора або гурту" required>
                            </div>
                            <div class="col-md-6 form-group">
                                <label class="form-label fw-bold" for="name">Назва треку <span class="mandatory-star">*</span></label>
                                <input type="text" th:field="*{name}" class="form-control" placeholder="Назва пісні" required>
                            </div>
                        </div>

                        <div class="form-group">
                            <label class="form-label fw-bold" for="style">Стиль / Жанр</label>
                            <input type="text" th:field="*{style}" class="form-control" placeholder="Наприклад: Рок, Поп, Джаз">
                        </div>

                        <div class="form-group">
                            <label class="form-label fw-bold" for="description">Опис</label>
                            <textarea th:field="*{description}" id="description" class="form-control"></textarea>
                        </div>

                        <div class="row mt-3">
                            <div class="col-md-6 form-group">
                                <label class="form-label fw-bold" for="album">Альбом</label>
                                <select th:field="*{album}" class="form-select">
                                    <option value="0" selected>Поза альбомом (Single)</option>
                                    <option th:each="al : ${albumList}" th:value="${al.id}" th:text="${al.name}"></option>
                                </select>
                            </div>
                            <div class="col-md-6 d-flex align-items-center">
                                <div class="form-check mt-3">
                                    <input class="form-check-input" type="checkbox" th:field="*{notnormalvocabulary}" id="notnormalvocabulary">
                                    <label class="form-check-label fw-bold" for="notnormalvocabulary">
                                        Присутня ненормативна лексика
                                    </label>
                                </div>
                            </div>
                        </div>

                        <div class="form-check mt-2">
                            <input class="form-check-input" type="checkbox" th:field="*{tochat}" id="tochat">
                            <label class="form-check-label fw-bold" for="tochat">
                                Опублікувати повідомлення в чаті Толоки
                            </label>
                        </div>

                        <div class="mt-4 pt-3 border-top d-flex justify-content-between">
                            <a href="/creater/tracks/0" class="btn btn-outline-secondary">
                                <i class="fas fa-times me-2"></i>Скасувати
                            </a>
                            <button type="submit" id="submit-btn" class="btn btn-success btn-lg px-5 shadow-sm" disabled>
                                <i class="fas fa-check-circle me-2"></i>Зберегти та опублікувати
                            </button>
                        </div>
                    </form>
                </div>
            </div>
        </div>
    </div>
</div>

<script th:src="@{/js/jquery.min.js}"></script>
<script src="/js/bootstrap.bundle.min.js"></script>
<script th:src="@{/js/dropzone.min.js}"></script>
<script th:src="@{/js/toastr.min.js}"></script>

<script>
    tinymce.init({
        selector: '#description',
        height: 250,
        plugins: ['advlist', 'autolink', 'lists', 'link', 'charmap', 'preview', 'anchor', 'searchreplace', 'visualblocks', 'code', 'fullscreen', 'insertdatetime', 'media', 'table', 'help', 'wordcount'],
        toolbar: 'undo redo | blocks | bold italic | alignleft aligncenter alignright alignjustify | bullist numlist outdent indent | help',
        setup: function (editor) {
            editor.on('change', function () {
                tinymce.triggerSave();
            });
        }
    });

    Dropzone.autoDiscover = false;

    $(document).ready(function() {
        const dropzone = new Dropzone("#demo-upload", {
            maxFiles: 1,
            acceptedFiles: "audio/*",
            dictMaxFilesExceeded: "Можна завантажити лише один файл за раз",
            success: function(file, response) {
                // Універсальний завантажувач повертає JSON об'єкт
                if (response && response.success) {
                    toastr.success('Файл завантажено успішно.');
                    selectFile(response.uuid, response.filename);
                } else {
                    const errMsg = response && response.error ? response.error : "Невідома помилка";
                    toastr.error('Помилка завантаження: ' + errMsg);
                    this.removeFile(file);
                }
            },
            error: function(file, message) {
                toastr.error('Помилка: ' + message);
                this.removeFile(file);
            }
        });

        // Вибір файлу зі сховища
        $(".file-card").on("click", function() {
            const uuid = $(this).data("uuid");
            const filename = $(this).data("filename");
            
            $(".file-card").removeClass("selected");
            $(this).addClass("selected");
            
            selectFile(uuid, filename);
            toastr.info('Файл обрано зі сховища.');
        });

        function selectFile(uuid, filename) {
            $("#track-uuid").val(uuid);
            $("#current-filename").text(filename);
            $("#selected-file-info").removeClass("d-none");
            validateForm();
            
            // Плавний скрол до форми
            $('html, body').animate({
                scrollTop: $("#form-container").offset().top - 20
            }, 500);
        }

        // Пошук у сховищі
        $("#file-search").on("keyup", function() {
            const value = $(this).val().toLowerCase();
            $("#storage-items .file-item").filter(function() {
                $(this).toggle($(this).text().toLowerCase().indexOf(value) > -1)
            });
        });

        // Валідація полів
        function validateForm() {
            const autor = $("#autor").val().trim();
            const name = $("#name").val().trim();
            const uuid = $("#track-uuid").val().trim();
            
            const isValid = autor.length > 0 && name.length > 0 && uuid.length > 0;
            $("#submit-btn").prop("disabled", !isValid);
        }

        $("#autor, #name").on("input", validateForm);
        
        // Ініціальна валідація
        validateForm();
    });
</script>

</body>
</html>
