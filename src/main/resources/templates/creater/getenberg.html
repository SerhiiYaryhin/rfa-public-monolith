<!DOCTYPE html>
<html xmlns:th="http://www.thymeleaf.org">
<head>
    <title>Gutenberg у Thymeleaf</title>

    <!-- TinyMCE 7 (self-hosted) -->
    <script src="/js/tinymce/tinymce.min.js"></script>
    <script src="/js/wysiwyg-init.js"></script>

    <style>
        #editor-container { max-width: 800px; margin: auto; padding: 20px; }
    </style>
</head>
<body>
<form action="/creater/gsave" method="post">
    <!-- Текстове поле для редактора -->
    <textarea name="content" id="editor"></textarea>
    <button type="submit">Зберегти</button>
</form>

<script>
    // Ініціалізація TinyMCE
    document.addEventListener('DOMContentLoaded', function() {
        initTinyMCESimple('#editor', {
            height: 300,
            plugins: 'lists link image table visualblocks',
            toolbar: 'undo redo | bold italic | alignleft aligncenter alignright | bullist numlist | link image | visualblocks'
        });
    });
</script>
</body>
</html>
