<!DOCTYPE html>
<html lang="uk" xmlns:th="http://www.thymeleaf.org"
      xmlns:sec="http://www.thymeleaf.org/thymeleaf-extras-springsecurity6">
<head>
    <meta charset="utf-8"/>
    <meta name="viewport" content="width=device-width, initial-scale=1, shrink-to-fit=no"/>
    <title>Толока - Мої подкасти</title>
    <link rel="icon" type="image/x-icon" href="/assets/favicon.ico"/>
    <script src="https://use.fontawesome.com/releases/v6.3.0/js/all.js" crossorigin="anonymous"></script>
    <link href="/css/bootstrap.min.css" rel="stylesheet"/>
    <style>
        .admin-container { margin-top: 100px; }
        .card { border-radius: 12px; }
    </style>
</head>
<body class="bg-light">
<header>
    <div th:insert="~{/fragments/navbar :: navbarUniverse}"></div>
</header>

<div class="container admin-container py-4">
    <div class="row mb-4 align-items-center">
        <div class="col-md-6">
            <h1 class="h3 fw-bold mb-0"><i class="fas fa-podcast text-primary me-2"></i>Ваші подкасти</h1>
            <p class="text-muted">Керування вашими каналами та епізодами</p>
        </div>
        <div class="col-md-6 text-md-end">
             <a href="/podcast/import" class="btn btn-outline-primary me-2">
                 <i class="fas fa-file-import me-1"></i> Імпортувати RSS
             </a>
             <a href="/podcast/create" class="btn btn-primary">
                 <i class="fas fa-plus me-1"></i> Створити новий
             </a>
        </div>
    </div>

    <div th:insert="~{/fragments/messagebox :: mymessagebox}"></div>

    <div class="card shadow-sm border-0">
        <div class="card-header bg-white py-3">
            <div th:insert="~{/fragments/common :: pagingline}"/>
        </div>
        <div class="card-body p-0">
            <div class="table-responsive">
                <table class="table table-hover align-middle mb-0">
                    <thead class="table-light">
                    <tr>
                        <th class="ps-3">Обкладинка</th>
                        <th>Назва подкасту</th>
                        <th class="text-center">Статус</th>
                        <th class="text-center">Епізодів</th>
                        <th>Останнє оновлення</th>
                        <th class="text-end pe-3">Дії</th>
                    </tr>
                    </thead>
                    <tbody>
                    <tr th:each="podcast : ${podcastList}">
                        <td class="ps-3">
                            <img th:if="${podcast.imagechanelstore != null}" th:src="'/store/content/' + ${podcast.imagechanelstore.uuid}" 
                                 style="width: 50px; height: 50px; object-fit: cover; border-radius: 4px;" class="border">
                            <i th:if="${podcast.imagechanelstore == null}" class="fas fa-podcast fa-2x text-muted"></i>
                        </td>
                        <td>
                            <strong th:text="${podcast.title}">Назва</strong><br>
                            <small class="text-muted" th:text="${#strings.abbreviate(podcast.description, 60)}"></small>
                        </td>
                        <td class="text-center">
                            <span th:if="${podcast.apruve}" class="badge bg-success">Схвалено</span>
                            <span th:if="${!podcast.apruve}" class="badge bg-warning text-dark">На модерації</span>
                            <br>
                            <small th:if="${podcast.publishing}" class="text-success small">Опубліковано</small>
                            <small th:if="${!podcast.publishing}" class="text-muted small">Чернетка</small>
                        </td>
                        <td class="text-center">
                            <span class="badge bg-secondary rounded-pill" th:text="${podcast.item.size()}">0</span>
                        </td>
                        <td class="small" th:text="${#dates.format(podcast.lastbuilddate, 'dd.MM.yy HH:mm')}">Дата</td>
                        <td class="text-end pe-3">
                            <div class="btn-group shadow-sm">
                                <a class="btn btn-sm btn-outline-info" th:href="@{'/podcast/view/' + ${podcast.uuid}}" target="_blank" title="Дивитися на сайті">
                                    <i class="fas fa-eye"></i>
                                </a>
                                <a class="btn btn-sm btn-outline-primary" th:href="@{'/podcast/pedit/' + ${podcast.uuid}}" title="Редагувати канал">
                                    <i class="fas fa-edit"></i>
                                </a>
                                <a class="btn btn-sm btn-outline-danger" th:href="@{'/podcast/localpodcastdel/' + ${podcast.uuid}}" 
                                   onclick="return confirm('Видалити цей подкаст разом з усіма епізодами?')" title="Видалити">
                                    <i class="fas fa-trash"></i>
                                </a>
                            </div>
                        </td>
                    </tr>
                    <tr th:if="${podcastList.isEmpty()}">
                        <td colspan="6" class="text-center py-5">
                            <div class="text-muted mb-3">Ви ще не створили жодного подкасту.</div>
                            <a href="/podcast/create" class="btn btn-primary">Створити перший подкаст</a>
                        </td>
                    </tr>
                    </tbody>
                </table>
            </div>
        </div>
        <div class="card-footer bg-white py-3">
            <div th:insert="~{/fragments/common :: pagingline}"/>
        </div>
    </div>
</div>

<div th:insert="~{/fragments/common :: footer}"></div>
<script src="/js/bootstrap.bundle.min.js"></script>
</body>
</html>
