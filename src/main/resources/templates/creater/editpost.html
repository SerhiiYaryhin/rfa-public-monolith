<!DOCTYPE html>
<html xmlns="http://www.w3.org/1999/xhtml"
      xmlns:th="https://www.thymeleaf.org"
      xmlns:sec="http://www.thymeleaf.org/thymeleaf-extras-springsecurity6"
>
<head>
    <meta charset="utf-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1">
    <title>Толока - радіо для всіх!</title>
    <!-- Favicon-->
    <link rel="icon" type="image/x-icon" href="/assets/favicon.ico" />
    <!-- Font Awesome icons (free version)-->
    <script src="https://use.fontawesome.com/releases/v6.3.0/js/all.js" crossorigin="anonymous"></script>
    <!-- Google fonts-->
    <link href="https://fonts.googleapis.com/css?family=Montserrat:400,700" rel="stylesheet" type="text/css" />
    <link href="https://fonts.googleapis.com/css?family=Roboto+Slab:400,100,300,700" rel="stylesheet" type="text/css" />
    <!-- Core theme CSS (includes Bootstrap)-->
    <link href="/css/bootstrap.min.css"  rel="stylesheet" />
    <!-- Custom RFA styles -->
    <link href="/css/styles.css" rel="stylesheet" />
    <!--    <link href="/css/infoblock.css"  rel="stylesheet" />-->

</head>
<body>
<header>
    <!--    <div th:insert="~{/fragments/user :: user_navbar}">  </div>-->
    <div th:insert="~{/fragments/navbar :: navbarUniverse}">  </div>
</header>
<div class="main-content">
    <div class="container-fluid">
<!--        <div class="row">-->
<!--            <div class="col-lg-12 col-sm-12">-->
<!--                <div th:insert="~{/fragments/user :: user_service}"> </div>-->
<!--            </div>-->
<!--        </div>-->
        <div class="row text-center pt-subsection">
            <div class="col align-center">
                <div th:insert="~{/fragments/messagebox :: mymessagebox}">  </div>
            </div>
        </div>
        <div class="row pt-subsection">
            <!-- Колонка редагування посту -->
            <div class="col-lg-9 col-sm-12">
                <form th:action="@{'/creater/editpost/'+${post.id}}"  method="post" th:object="${post}">
                    <input type="hidden" th:field="*{id}"/>

                    <!-- Заголовок -->
                    <div class="mb-3">
                        <label class="form-label" for="posttitle">Заголовок посту</label>
                        <input th:field="*{posttitle}" type="text" class="form-control" />
                    </div>

                    <!-- Тіло посту (TinyMCE редактор) -->
                    <div class="mb-3">
                        <label class="form-label" for="postbody">Тіло посту</label>
                        <textarea th:field="*{postbody}" id="postbody" class="form-control"></textarea>
                    </div>

                    <!-- Розділ та категорія -->
                    <div class="mb-3">
                        <label class="form-label" for="category">Розділ:</label>
                        <select th:field="*{category}" class="form-select" id="category">
                            <option th:each="item: ${categorys}"
                                    th:value="${item.name}"
                                    th:text="${item.label}" />
                        </select>
                    </div>
                    <div class="mb-3">
                        <label class="form-label" for="postcategory">Категорія:</label>
                        <select th:field="*{postcategory}" class="form-select" id="postcategory">
                            <option th:each="item: ${firstpostcategoryslist}"
                                    th:value="${item.id}"
                                    th:text="${item.label}" />
                        </select>
                    </div>

                    <hr>
                    <button type="submit" class="btn btn-primary btn-lg" >
                        Зберегти
                    </button>
                </form>
            </div>
            <div class="col-lg-3 col-sm-12">
                <!--                    вставляем Медіа Хаб-->
<!--                <div th:insert="~{/fragments/mediahub :: usermediahub}">  </div>-->
                <a class="btn btn-primary" th:href="@{'/creater/setpostmainpicture/'+${post.uuid}+'/0' }">Встановити Головну ілюстрацію</a>
                <div th:if="${post.coverstoreuuid} != null">
                    <img loading="lazy" class="card-img-top img-fluid"  th:src="'/store/content/'+${post.coverstoreuuid}" alt="Головна ілюстрація для посту">
<!--                    <img loading="lazy" class="card-img-top img-fluid"  th:src="'https://rfa.toloka.mediahttps://rfa.toloka.media/store/content/'+${post.coverstoreuuid}" alt="Головна ілюстрація для посту">-->
                </div>

            </div>
        </div>
    </div>
</div>




    <script src="/js/bootstrap.bundle.min.js"></script>

<!-- TinyMCE 7 (self-hosted) -->
<script src="/js/tinymce/tinymce.min.js"></script>
<script src="/js/wysiwyg-init.js"></script>
<script>
    document.addEventListener('DOMContentLoaded', function() {
        initTinyMCEFull('#postbody', {
            min_height: 400,
            max_height: 700
        });
    });
</script>
</body>
</html>
