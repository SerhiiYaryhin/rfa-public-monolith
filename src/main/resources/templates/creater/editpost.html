<!DOCTYPE html>
<html xmlns="http://www.w3.org/1999/xhtml"
      xmlns:th="https://www.thymeleaf.org"
      xmlns:sec="http://www.thymeleaf.org/thymeleaf-extras-springsecurity6"
>
<head>
    <meta charset="utf-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1">
    <title>Толока - Редагування посту</title>
    <link rel="icon" type="image/x-icon" href="/assets/favicon.ico" />
    <script src="https://use.fontawesome.com/releases/v6.3.0/js/all.js" crossorigin="anonymous"></script>
    <link href="/css/bootstrap.min.css"  rel="stylesheet" />
    <link th:rel="stylesheet" th:href="@{/css/toastr.min.css}"/>
    <script src="https://cdn.tiny.cloud/1/jfs2v9uma7vkxn632w42djz02jxqivtjdlovkkqzafgboa10/tinymce/6/tinymce.min.js" referrerpolicy="origin"></script>
</head>
<body>
<header>
    <div th:insert="~{/fragments/navbar :: navbarUniverse}">  </div>
</header>
<div style="padding-top: 100px">
    <div class="container-fluid">
        
        <div th:if="${error}" class="row justify-content-center">
            <div class="col-md-8">
                <div class="alert alert-danger alert-dismissible fade show" role="alert">
                    <i class="fas fa-exclamation-triangle me-2"></i>
                    <strong th:text="${error}">Помилка!</strong>
                    <button type="button" class="btn-close" data-bs-dismiss="alert" aria-label="Close"></button>
                </div>
            </div>
        </div>

        <div class="row" style="padding-top: 20px">
            <!-- Колонка редагування посту -->
            <div class="col-lg-9 col-sm-12">
                <div class="card shadow-sm">
                    <div class="card-header bg-dark text-white">
                        <h5 class="mb-0">Вміст посту</h5>
                    </div>
                    <div class="card-body">
                        <form th:action="@{'/creater/editpost/'+${post.uuid}}" method="post" th:object="${post}" id="post-form">
                            <input type="hidden" th:field="*{id}"/>
                            <input type="hidden" th:field="*{uuid}" id="post-uuid"/>
                            
                            <div class="mb-3">
                                <label class="form-label fw-bold" for="posttitle">Заголовок посту</label>
                                <input th:field="*{posttitle}" type="text" class="form-control form-control-lg" placeholder="Введіть заголовок..." required />
                            </div>

                            <div class="row mb-3">
                                <div class="col-md-4">
                                    <label class="form-label fw-bold">Тип контенту</label>
                                    <select th:field="*{category}" class="form-select">
                                        <option th:each="item: ${categorys}" th:value="${item.name}" th:text="${item.label}" />
                                    </select>
                                </div>
                                <div class="col-md-4">
                                    <label class="form-label fw-bold">Категорія</label>
                                    <select th:field="*{postcategory}" class="form-select">
                                        <option th:each="item: ${firstpostcategoryslist}" th:value="${item.id}" th:text="${item.label}" />
                                    </select>
                                </div>
                                <div class="col-md-4">
                                    <label class="form-label fw-bold">Статус публікації</label>
                                    <select th:field="*{postStatus}" class="form-select" id="post-status">
                                        <option th:each="status : ${postStatuses}" th:value="${status}" th:text="${status.label}"></option>
                                    </select>
                                </div>
                            </div>

                            <div class="mb-3">
                                <label class="form-label fw-bold">Текст посту</label>
                                <textarea th:field="*{postbody}" id="post-body"></textarea>
                            </div>
                            
                            <div class="text-end mt-4">
                                <a href="/creater/home" class="btn btn-secondary me-2">Скасувати</a>
                                <button type="submit" class="btn btn-primary px-5">
                                    <i class="fas fa-save me-2"></i>Зберегти зміни
                                </button>
                            </div>
                        </form>
                    </div>
                </div>
            </div>

            <!-- Права колонка: Ілюстрація -->
            <div class="col-lg-3 col-sm-12">
                <div class="card shadow-sm border-primary">
                    <div class="card-header bg-primary text-white">
                        <h5 class="mb-0"><i class="fas fa-image me-2"></i>Ілюстрація</h5>
                    </div>
                    <div class="card-body text-center">
                        <div th:if="${post.coverstoreuuid} != null" class="mb-3">
                            <img class="img-fluid rounded shadow-sm" th:src="'/store/content/'+${post.coverstoreuuid}" alt="Main Illustration">
                        </div>
                        <div th:if="${post.coverstoreuuid} == null" class="mb-3 p-4 bg-light border rounded">
                            <i class="fas fa-photo-video fa-3x text-muted mb-2"></i>
                            <p class="text-muted small">Ілюстрацію не встановлено</p>
                        </div>
                        
                        <a class="btn btn-outline-primary w-100" th:href="@{'/creater/setpostmainpicture/'+${post.uuid}+'/0' }">
                            <i class="fas fa-edit me-1"></i> Змінити ілюстрацію
                        </a>
                        <p class="mt-2 text-muted small">Обов'язково для публікації</p>
                    </div>
                </div>
            </div>
        </div>
    </div>
</div>

<div th:insert="~{/fragments/common :: footer}"></div>

<script th:src="@{/js/jquery.min.js}"></script>
<script src="/js/bootstrap.bundle.min.js"></script>
<script th:src="@{/js/toastr.min.js}"></script>

<script>
    tinymce.init({
        selector: '#post-body',
        height: 500,
        plugins: 'preview importcss searchreplace autolink autosave save directionality code visualblocks visualchars fullscreen image link media template codesample table charmap pagebreak nonbreaking anchor insertdatetime advlist lists wordcount help charmap quickbars emoticons accordion',
        toolbar: 'undo redo | blocks | bold italic underline | alignleft aligncenter alignright | bullist numlist outdent indent | link image media | code preview help',
        setup: function (editor) {
            editor.on('change', function () {
                tinymce.triggerSave();
            });
        }
    });

    $(document).ready(function() {
        const hasImage = [[${post.coverstoreuuid != null && !post.coverstoreuuid.isEmpty()}]];
        
        $("#post-form").on("submit", function(e) {
            const status = $("#post-status").val();
            // POSTSTATUS_REQUEST - це статус для подачі на модерацію
            if (status === 'POSTSTATUS_REQUEST' && !hasImage) {
                e.preventDefault();
                toastr.error('Ви не можете подати пост на публікацію без головної ілюстрації!');
                return false;
            }
        });
    });
</script>

</body>
</html>
