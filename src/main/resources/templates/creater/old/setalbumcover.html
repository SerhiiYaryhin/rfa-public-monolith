<!DOCTYPE html>
<html xmlns="http://www.w3.org/1999/xhtml"
      xmlns:th="https://www.thymeleaf.org"
      xmlns:sec="http://www.thymeleaf.org/thymeleaf-extras-springsecurity6">
<head>
    <meta charset="utf-8"/>
    <meta name="viewport" content="width=device-width, initial-scale=1">
    <title>Вибір обкладинки альбому - Толока</title>
    <link rel="icon" type="image/x-icon" href="/assets/favicon.ico"/>
    <link href="/css/bootstrap.min.css" rel="stylesheet"/>
    <script src="https://use.fontawesome.com/releases/v6.3.0/js/all.js" crossorigin="anonymous"></script>
    <link href="https://fonts.googleapis.com/css2?family=Inter:wght@400;600;700&display=swap" rel="stylesheet">
    <link th:rel="stylesheet" th:href="@{/css/toastr.min.css}"/>

    <style>
        body { font-family: 'Inter', sans-serif; background-color: #f4f7f6; color: #2d3436; }
        .cover-card { background: #fff; border-radius: 24px; border: none; box-shadow: 0 15px 40px rgba(0,0,0,0.06); margin-top: 30px; margin-bottom: 50px; overflow: hidden; }
        .card-header-gradient { background: linear-gradient(135deg, #6c5ce7 0%, #a29bfe 100%); color: #fff; padding: 30px; border: none; }
        .track-badge { background: rgba(255,255,255,0.2); backdrop-filter: blur(10px); padding: 5px 15px; border-radius: 50px; font-size: 0.8rem; font-weight: 600; }

        .cover-item { cursor: pointer; border: 4px solid transparent; border-radius: 18px; padding: 8px; transition: 0.2s; background: #f8fafc; }
        .cover-item:hover { transform: translateY(-3px); box-shadow: 0 8px 20px rgba(0,0,0,0.08); }
        .cover-item.selected { border-color: #6c5ce7; background: #f0f0ff; }
        .cover-item img { width: 100%; height: 150px; object-fit: cover; border-radius: 12px; pointer-events: none; }
        .cover-filename { font-size: 0.75rem; color: #636e72; margin-top: 6px; }

        .btn-apply { background: #6c5ce7; color: #fff; border-radius: 12px; padding: 12px 30px; font-weight: 700; border: none; transition: 0.3s; }
        .btn-apply:hover:not(:disabled) { background: #5b4cc4; color: #fff; transform: translateY(-2px); }
        .btn-apply:disabled { opacity: 0.5; cursor: not-allowed; }
    </style>
</head>
<body>
<header>
    <div th:insert="~{/fragments/navbar :: navbarUniverse}"></div>
</header>

<div class="container" style="padding-top: 80px;">
    <div class="row justify-content-center">
        <div class="col-lg-10 col-xl-9">

            <div class="cover-card">
                <div class="card-header-gradient d-flex justify-content-between align-items-center">
                    <div>
                        <span class="track-badge mb-2 d-inline-block">ОБКЛАДИНКА АЛЬБОМУ</span>
                        <h2 class="mb-1 fw-bold" th:text="${album.name}">Назва альбому</h2>
                        <p class="mb-0 opacity-75">Оберіть обкладинку зі вашої колекції та натисніть "Застосувати"</p>
                    </div>
                    <i class="fas fa-image fa-4x opacity-25 d-none d-md-block"></i>
                </div>

                <div class="card-body p-4 p-md-5">
                    <!-- Панель дій -->
                    <form id="setalbumcover" method="post" action="#">
                        <input type="hidden"
                               th:name="${_csrf.parameterName}"
                               th:value="${_csrf.token}"/>
                        <div class="d-flex flex-wrap gap-2 mb-4">
                            <button id="applyCoverBtn" type="submit" class="btn btn-apply" disabled>
                                <i class="fas fa-check me-2"></i>Застосувати обрану обкладинку
                            </button>
                            <a th:href="@{'/creater/editalbum/' + ${album.uuid}}" class="btn btn-light rounded-pill px-4">
                                Скасувати
                            </a>
                        </div>
                    </form>

                    <hr>

                    <!-- Галерея обкладинок -->
                    <div th:if="${coverlist == null || coverlist.isEmpty()}" class="text-center py-5">
                        <i class="fas fa-images fa-3x text-muted mb-3"></i>
                        <h5 class="text-muted">У вашому сховищі поки немає обкладинок</h5>
                        <p class="text-muted small">Завантажте зображення через сторінку "Альбоми" (Dropzone) і повертайтеся сюди.</p>
                    </div>

                    <div class="row g-3">
                        <div class="col-6 col-md-4 col-lg-3" th:each="coverl : ${coverlist}">
                            <!-- ВАЖЛИВО: data-album тепер містить UUID альбому -->
                            <div class="cover-item text-center"
                                 th:data-store="${coverl.uuid}"
                                 th:data-album="${album.uuid}"
                                 th:data-cd="${cd.id}"
                                 onclick="selectCover(this)">
                                <img th:src="'/store/thrumbal/w/150/' + ${coverl.uuid} + '/' + ${coverl.filename}"
                                     th:alt="${coverl.filename}">
                                <div class="cover-filename text-truncate" th:text="${coverl.filename}">filename.jpg</div>
                            </div>
                        </div>
                    </div>
                </div>
            </div>

        </div>
    </div>
</div>

<footer class="mt-auto py-4">
    <div th:insert="~{/fragments/common :: footer}"></div>
</footer>

<script th:src="@{/js/jquery.min.js}"></script>
<script src="/js/bootstrap.bundle.min.js"></script>
<script th:src="@{/js/toastr.min.js}"></script>
<script th:src="@{/js/setalbumcover.js}"></script>
</body>
</html>
