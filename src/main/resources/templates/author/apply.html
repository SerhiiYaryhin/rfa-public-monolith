<!DOCTYPE html>
<html xmlns="http://www.w3.org/1999/xhtml"
      xmlns:th="https://www.thymeleaf.org"
>
<head>
    <meta charset="utf-8"/>
    <meta name="viewport" content="width=device-width, initial-scale=1">
    <title>Стати автором - Толока</title>
    <link href="/css/bootstrap.min.css" rel="stylesheet"/>
    <script src="https://use.fontawesome.com/releases/v6.3.0/js/all.js" crossorigin="anonymous"></script>
</head>
<body class="bg-light">
    <div th:insert="~{/fragments/navbar :: navbarUniverse}"></div>

    <div class="container py-5" style="margin-top: 100px;">
        <div class="row justify-content-center">
            <div class="col-lg-6">
                <div class="card shadow-sm border-0" style="border-radius: 15px;">
                    <div class="card-body p-5">
                        <h2 class="fw-bold mb-4 text-center">Запит на авторську колонку</h2>
                        <p class="text-muted text-center mb-5">Поділіться своєю експертизою та історіями з нашою аудиторією.</p>
                        
                        <form th:action="@{/author/apply}" th:object="${authorRequest}" method="post">
                            <div class="mb-4">
                                <label class="form-label fw-bold">Тематика вашої колонки</label>
                                <input type="text" th:field="*{topic}" class="form-control form-control-lg" placeholder="Наприклад: Музична аналітика, Подорожі тощо" required>
                            </div>
                            
                            <div class="mb-4">
                                <label class="form-label fw-bold">Коротке резюме / Про себе</label>
                                <textarea th:field="*{resume}" class="form-control" rows="4" placeholder="Розкажіть про свій досвід..." required></textarea>
                            </div>
                            
                            <div class="mb-5">
                                <label class="form-label fw-bold">Посилання на приклади робіт</label>
                                <textarea th:field="*{links}" class="form-control" rows="2" placeholder="Посилання на ваші статті, блоги або портфоліо"></textarea>
                            </div>
                            
                            <div class="d-grid">
                                <button type="submit" class="btn btn-primary btn-lg rounded-pill fw-bold py-3 shadow-sm">
                                    Надіслати запит на модерацію
                                </button>
                            </div>
                        </form>
                    </div>
                </div>
                <div class="text-center mt-4">
                    <a href="/user/profile" class="text-decoration-none text-muted small"><i class="fas fa-arrow-left me-2"></i>Повернутися до профілю</a>
                </div>
            </div>
        </div>
    </div>

    <script src="/js/bootstrap.bundle.min.js"></script>
</body>
</html>
