<!DOCTYPE html>
<html xmlns="http://www.w3.org/1999/xhtml" xmlns:th="https://www.thymeleaf.org">
<head>
    <meta charset="utf-8"/>
    <meta name="viewport" content="width=device-width, initial-scale=1">
    <title>Редактор статті - Толока</title>
    
    <link href="/css/bootstrap.min.css" rel="stylesheet"/>
    <link href="https://fonts.googleapis.com/css2?family=Inter:wght@400;600;800&family=Lora:ital,wght@0,400;0,700;1,400&display=swap" rel="stylesheet">
    <script src="https://use.fontawesome.com/releases/v6.3.0/js/all.js" crossorigin="anonymous"></script>

    <!-- Переносимо бібліотеки в Head для стабільної ініціалізації -->
    <script src="/js/bootstrap.bundle.min.js"></script>
    <script src="https://cdn.jsdelivr.net/npm/@editorjs/editorjs@latest"></script>
    <script src="https://cdn.jsdelivr.net/npm/@editorjs/header@latest"></script>
    <script src="https://cdn.jsdelivr.net/npm/@editorjs/paragraph@latest"></script>
    <script src="https://cdn.jsdelivr.net/npm/@editorjs/nested-list@latest"></script>
    <script src="https://cdn.jsdelivr.net/npm/@editorjs/image@latest"></script>
    <script src="https://cdn.jsdelivr.net/npm/@editorjs/embed@latest"></script>
    <script src="https://cdn.jsdelivr.net/npm/@editorjs/quote@latest"></script>
    <script src="https://cdn.jsdelivr.net/npm/@editorjs/table@latest"></script>
    <script src="https://cdn.jsdelivr.net/npm/@editorjs/delimiter@latest"></script>
    <script src="https://cdn.jsdelivr.net/npm/@editorjs/marker@latest"></script>
    <script src="https://cdn.jsdelivr.net/npm/editorjs-text-alignment-blocktune@latest"></script>
    <script src="https://cdn.jsdelivr.net/npm/@editorjs/text-variant-tune@latest"></script>

    <style>
        body { font-family: 'Inter', sans-serif; background-color: #f8fafc; }
        .editor-wrapper { background: #fff; border-radius: 24px; min-height: 800px; padding: 60px; box-shadow: 0 10px 40px rgba(0,0,0,0.04); margin-bottom: 100px; }
        .ce-block__content, .ce-toolbar__content { max-width: 800px; }
        .article-title-input { border: none; font-size: 3.5rem; font-weight: 800; width: 100%; margin-bottom: 2rem; outline: none; color: #0f172a; line-height: 1.1; }
        .article-title-input::placeholder { color: #e2e8f0; }
        
        #editorjs { font-family: 'Lora', serif; font-size: 1.25rem; line-height: 1.6; }
        
        .sticky-toolbar { position: sticky; top: 20px; z-index: 1000; transition: all 0.3s; }
        .toolbar-card { background: rgba(255, 255, 255, 0.9); backdrop-filter: blur(10px); border-radius: 50px; border: 1px solid #e2e8f0; padding: 10px 20px; }
        
        /* Змінено на object-fit: contain для повного відображення */
        .cover-preview-box { width: 100%; height: 350px; background: #f1f5f9; border-radius: 20px; border: 2px dashed #cbd5e1; display: flex; align-items: center; justify-content: center; overflow: hidden; margin-bottom: 2rem; position: relative; cursor: pointer; transition: 0.2s; }
        .cover-preview-box:hover { border-color: #007db5; background: #eef2ff; }
        .cover-preview-img { width: 100%; height: 100%; object-fit: contain; background-color: #000; }
        
        .cover-actions { position: absolute; bottom: 15px; right: 15px; display: none; z-index: 10; }
        .cover-preview-box:hover .cover-actions { display: flex; }
        
        .storage-img-item { height: 120px; object-fit: contain; background: #eee; border-radius: 10px; cursor: pointer; transition: 0.2s; border: 3px solid transparent; }
        .storage-img-item:hover { transform: scale(1.05); }
        .storage-img-item.selected { border-color: #007db5; }

        /* Стилі для прев'ю */
        #previewEditor { font-family: 'Lora', serif; font-size: 1.25rem; line-height: 1.6; }
        #previewModal .ce-block__content, #previewModal .ce-toolbar__content { max-width: 800px; }
        #previewModal .cdx-quote { border-left: 6px solid #FF8000; padding: 1rem 0 1rem 2rem; font-style: italic; background: #fff9f0; border-radius: 0 8px 8px 0; }
        #previewModal .image-tool__caption { text-align: center; color: #64748b; font-style: italic; font-size: 0.9rem; margin-top: 1rem; }
    </style>
</head>
<body class="bg-light">
    <div th:insert="~{/fragments/navbar :: navbarUniverse}"></div>

    <div class="container py-5" style="margin-top: 80px;">
        <!-- Toolbar -->
        <div class="row mb-5 sticky-toolbar">
            <div class="col-lg-10 mx-auto">
                <div class="toolbar-card shadow-sm d-flex justify-content-between align-items-center">
                    <div>
                        <a href="/creater/author/dashboard" class="btn btn-link text-decoration-none text-muted fw-bold small">
                            <i class="fas fa-arrow-left me-1"></i> Вихід
                        </a>
                        <span id="wordCounter" class="ms-3 badge bg-light text-dark fw-normal border">Слів: 0</span>
                    </div>
                    <div class="d-flex gap-2">
                        <button id="previewBtn" class="btn btn-outline-secondary rounded-pill px-4 fw-bold shadow-sm border-0">Прев'ю</button>
                        <button id="saveDraftBtn" class="btn btn-light rounded-pill px-4 fw-bold shadow-sm border">Чернетка</button>
                        <button id="publishBtn" class="btn btn-primary rounded-pill px-4 fw-bold shadow-sm">Опублікувати</button>
                    </div>
                </div>
            </div>
        </div>

        <div class="row">
            <div class="col-lg-9 mx-auto">
                <div class="editor-wrapper">
                    <!-- Обкладинка -->
                    <div class="text-muted small fw-bold text-uppercase mb-2 ms-2">Головна ілюстрація (Поміщається повністю)</div>
                    <div id="coverBox" class="cover-preview-box shadow-sm" onclick="openStorageModal()">
                        <img id="coverImg" class="cover-preview-img d-none">
                        <div id="coverPlaceholder" class="text-center">
                            <i class="fas fa-image fa-3x text-slate-300 mb-2"></i>
                            <p class="mb-0 text-muted small">Натисніть, щоб додати обкладинку</p>
                        </div>
                        <div class="cover-actions gap-2">
                            <button type="button" class="btn btn-sm btn-light rounded-pill shadow-sm" onclick="event.stopPropagation(); openStorageModal()">Змінити</button>
                            <button type="button" class="btn btn-sm btn-danger rounded-pill shadow-sm" onclick="event.stopPropagation(); removeCover()">Видалити</button>
                        </div>
                    </div>

                    <input type="text" id="articleTitle" class="article-title-input" placeholder="Заголовок історії..." th:value="${article.title}">
                    
                    <div class="mb-4">
                        <textarea id="articleLead" class="form-control border-0 bg-light p-3" 
                                  placeholder="Короткий лід (вступ) для анонсу на головній сторінці..." 
                                  style="border-radius: 12px; resize: none; font-size: 1.1rem;" 
                                  rows="3" th:text="${article.lead}"></textarea>
                    </div>

                    <div id="editorjs"></div>
                </div>
            </div>
        </div>
    </div>

    <!-- Модальне вікно сховища -->
    <div class="modal fade" id="storageModal" tabindex="-1" aria-hidden="true">
... (rest of storage modal) ...
    </div>

    <!-- Модальне вікно попереднього перегляду -->
    <div class="modal fade" id="previewModal" tabindex="-1" aria-hidden="true">
        <div class="modal-dialog modal-fullscreen">
            <div class="modal-content">
                <div class="modal-header border-0 bg-light px-4">
                    <h5 class="fw-bold mb-0">Попередній перегляд статті</h5>
                    <button type="button" class="btn-close" data-bs-dismiss="modal" aria-label="Close"></button>
                </div>
                <div class="modal-body p-0 overflow-auto bg-white">
                    <header class="article-header text-center py-5 bg-light border-bottom">
                        <div class="container px-4">
                            <h1 id="previewTitle" class="display-4 fw-bold mb-3 mx-auto" style="max-width: 900px;"></h1>
                            <div class="text-muted">
                                <span class="fw-bold text-dark">[[${#dates.format(#dates.createNow(), 'dd MMMM yyyy')}]]</span>
                            </div>
                        </div>
                    </header>
                    <main class="article-main py-5 mx-auto" style="max-width: 850px;">
                        <img id="previewCover" class="img-fluid rounded-4 shadow-sm mb-5 d-none" style="width: 100%; max-height: 500px; object-fit: contain; background: #000;">
                        <div id="previewLead" class="lead fw-normal mb-5 text-muted" style="font-size: 1.4rem; line-height: 1.6; border-left: 4px solid #FF8000; padding-left: 20px;"></div>
                        <div id="previewEditor"></div>
                    </main>
                </div>
                <div class="modal-footer border-0 bg-light">
                    <button type="button" class="btn btn-secondary rounded-pill px-4" data-bs-dismiss="modal">Закрити прев'ю</button>
                </div>
            </div>
        </div>
    </div>

    <input type="hidden" id="articleUuid" th:value="${article.uuid}">
    <input type="hidden" id="initialData" th:value="${article.postbody}">
    <input type="hidden" id="initialCover" th:value="${article.coverUuid}">

    <script th:inline="javascript">
        // Використовуємо глобальну перевірку для безпеки
        window.addEventListener('load', function() {
            console.log("Bootstrap status:", typeof bootstrap !== 'undefined' ? 'Defined' : 'Undefined');
        });

        const articleUuid = document.getElementById('articleUuid').value;
        const initialData = document.getElementById('initialData').value;
        let selectedCoverUuid = document.getElementById('initialCover').value;

        if (selectedCoverUuid) {
            setCoverPreview(selectedCoverUuid);
        }

        const AlignmentTune = window.AlignmentBlockTune || window.AlignmentTune;
        const tunesList = [];
        if (AlignmentTune) tunesList.push('alignTune');
        if (typeof TextVariantTune !== 'undefined') tunesList.push('textVariant');

        const editorTools = {
            header: { class: Header, tunes: tunesList, config: { levels: [2, 3, 4], defaultLevel: 2 } },
            paragraph: { class: Paragraph, tunes: tunesList, config: { preserveBlank: true } },
            list: { class: NestedList, inlineToolbar: true },
            image: {
                class: ImageTool,
                config: {
                    endpoints: { byFile: '/api/author/image/upload' },
                    additionalRequestHeaders: { 'X-CSRF-TOKEN': '[[${_csrf.token}]]' }
                }
            },
            embed: { class: Embed, inlineToolbar: true },
            quote: { class: Quote, inlineToolbar: true },
            table: { class: Table, inlineToolbar: true },
            delimiter: Delimiter,
            marker: Marker
        };

        if (AlignmentTune) editorTools.alignTune = { class: AlignmentTune, config: { default: 'left' } };
        if (typeof TextVariantTune !== 'undefined') editorTools.textVariant = TextVariantTune;

        const editor = new EditorJS({
            holder: 'editorjs',
            placeholder: 'Розкажіть вашу історію...',
            tools: editorTools,
            data: initialData ? JSON.parse(initialData) : {},
            onChange: () => updateWordCount()
        });

        function updateWordCount() {
            editor.save().then(data => {
                let text = "";
                if (data.blocks) {
                    data.blocks.forEach(b => { if(b.data && b.data.text) text += b.data.text + " "; });
                }
                const count = text.trim() ? text.trim().split(/\s+/).length : 0;
                document.getElementById('wordCounter').innerText = `Слів: ${count}`;
            }).catch(e => {});
        }

        function openStorageModal() {
            if (typeof bootstrap === 'undefined') {
                alert("Помилка завантаження системних скриптів. Будь ласка, оновіть сторінку.");
                return;
            }
            const modalEl = document.getElementById('storageModal');
            const modal = bootstrap.Modal.getOrCreateInstance(modalEl);
            modal.show();
            loadUserStorage();
        }

        async function loadUserStorage() {
            const grid = document.getElementById('storageGrid');
            try {
                const res = await fetch('/api/author/images/my');
                const images = await res.json();
                grid.innerHTML = images.map(img => `
                    <div class="col">
                        <img src="${img.url}" class="storage-img-item w-100 ${img.uuid === selectedCoverUuid ? 'selected' : ''}" 
                             onclick="selectStorageImage('${img.uuid}', '${img.url}')">
                    </div>
                `).join('');
                if (images.length === 0) grid.innerHTML = '<p class="text-center py-5 w-100">Сховище порожнє</p>';
            } catch (e) { grid.innerHTML = '<p class="text-center py-5 text-danger w-100">Помилка завантаження</p>'; }
        }

        function selectStorageImage(uuid, url) {
            selectedCoverUuid = uuid;
            setCoverPreview(uuid);
            const modalEl = document.getElementById('storageModal');
            bootstrap.Modal.getInstance(modalEl).hide();
        }

        async function uploadNewCover(file) {
            if (!file) return;
            const formData = new FormData();
            formData.append('image', file);
            try {
                const res = await fetch('/api/author/image/upload', {
                    method: 'POST',
                    headers: { 'X-CSRF-TOKEN': '[[${_csrf.token}]]' },
                    body: formData
                });
                const result = await res.json();
                if (result.success) {
                    selectStorageImage(result.file.uuid, result.file.url);
                }
            } catch (e) { alert('Помилка завантаження'); }
        }

        function setCoverPreview(uuid) {
            const img = document.getElementById('coverImg');
            const placeholder = document.getElementById('coverPlaceholder');
            img.src = '/store/content/' + uuid;
            img.classList.remove('d-none');
            placeholder.classList.add('d-none');
            selectedCoverUuid = uuid;
        }

        function removeCover() {
            selectedCoverUuid = null;
            document.getElementById('coverImg').classList.add('d-none');
            document.getElementById('coverPlaceholder').classList.remove('d-none');
        }

        async function saveArticle(isPublish) {
            const saveBtn = isPublish ? document.getElementById('publishBtn') : document.getElementById('saveDraftBtn');
            const originalText = saveBtn.innerText;
            
            try {
                saveBtn.disabled = true;
                saveBtn.innerText = 'Збереження...';
                const data = await editor.save();
                const title = document.getElementById('articleTitle').value.trim();
                if (!title) {
                    alert('Будь ласка, введіть заголовок');
                    saveBtn.disabled = false; saveBtn.innerText = originalText;
                    return;
                }
                let finalCover = selectedCoverUuid;
                if (!finalCover) {
                    const imgBlock = data.blocks.find(b => b.type === 'image' && b.data.file && b.data.file.uuid);
                    if (imgBlock) finalCover = imgBlock.data.file.uuid;
                }
                const res = await fetch('/api/author/article/save', {
                    method: 'POST',
                    headers: { 'Content-Type': 'application/json', 'X-CSRF-TOKEN': '[[${_csrf.token}]]' },
                    body: JSON.stringify({
                        uuid: articleUuid, title: title, postbody: JSON.stringify(data),
                        lead: document.getElementById('articleLead').value.trim(),
                        coverUuid: finalCover, status: isPublish ? 'PENDING' : 'DRAFT'
                    })
                });
                if (res.ok) window.location.href = '/creater/author/dashboard?success=saved';
                else throw new Error('Server error');
            } catch (error) {
                alert('Помилка при збереженні');
                saveBtn.disabled = false; saveBtn.innerText = originalText;
            }
        }

        async function showPreview() {
            try {
                const data = await editor.save();
                const title = document.getElementById('articleTitle').value.trim() || 'Без заголовка';
                const lead = document.getElementById('articleLead').value.trim();
                
                document.getElementById('previewTitle').innerText = title;
                
                const previewLeadEl = document.getElementById('previewLead');
                if (lead) {
                    previewLeadEl.innerText = lead;
                    previewLeadEl.classList.remove('d-none');
                } else {
                    previewLeadEl.classList.add('d-none');
                }
                
                const previewCover = document.getElementById('previewCover');
                if (selectedCoverUuid) {
                    previewCover.src = '/store/content/' + selectedCoverUuid;
                    previewCover.classList.remove('d-none');
                } else {
                    previewCover.classList.add('d-none');
                }
                
                // Очищаємо попередній контейнер прев'ю
                document.getElementById('previewEditor').innerHTML = '';
                
                // Створюємо новий інстанс редактора для прев'ю (read-only)
                const pEditor = new EditorJS({
                    holder: 'previewEditor',
                    readOnly: true,
                    tools: editorTools,
                    data: data
                });
                
                const modal = new bootstrap.Modal(document.getElementById('previewModal'));
                modal.show();
            } catch (e) {
                console.error("Preview error:", e);
                alert("Помилка при формуванні попереднього перегляду");
            }
        }

        document.getElementById('previewBtn').onclick = showPreview;
        document.getElementById('saveDraftBtn').onclick = () => saveArticle(false);
        document.getElementById('publishBtn').onclick = () => saveArticle(true);
    </script>
</body>
</html>
