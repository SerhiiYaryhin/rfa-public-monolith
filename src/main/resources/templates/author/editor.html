<!DOCTYPE html>
<html xmlns="http://www.w3.org/1999/xhtml" xmlns:th="https://www.thymeleaf.org">
<head>
    <meta charset="utf-8"/>
    <meta name="viewport" content="width=device-width, initial-scale=1">
    <title>Редактор статті - Толока</title>

    <link href="/css/bootstrap.min.css" rel="stylesheet"/>
    <link href="https://fonts.googleapis.com/css2?family=Inter:wght@400;600;800&family=Lora:ital,wght@0,400;0,700;1,400&display=swap" rel="stylesheet">

    <script src="https://use.fontawesome.com/releases/v6.3.0/js/all.js" crossorigin="anonymous"></script>
    <script src="https://cdn.jsdelivr.net/npm/bootstrap@5.3.0/dist/js/bootstrap.bundle.min.js"></script>

    <script src="https://cdn.jsdelivr.net/npm/@editorjs/editorjs@latest"></script>
    <script src="https://cdn.jsdelivr.net/npm/@editorjs/header@latest"></script>
    <script src="https://cdn.jsdelivr.net/npm/@editorjs/paragraph@latest"></script>
    <script src="https://cdn.jsdelivr.net/npm/@editorjs/nested-list@latest"></script>
    <script src="https://cdn.jsdelivr.net/npm/@editorjs/image@latest"></script>
    <script src="https://cdn.jsdelivr.net/npm/@editorjs/embed@latest"></script>
    <script src="https://cdn.jsdelivr.net/npm/@editorjs/quote@latest"></script>
    <script src="https://cdn.jsdelivr.net/npm/@editorjs/table@latest"></script>
    <script src="https://cdn.jsdelivr.net/npm/@editorjs/delimiter@latest"></script>
    <script src="https://cdn.jsdelivr.net/npm/@editorjs/marker@latest"></script>
    <script src="https://cdn.jsdelivr.net/npm/editorjs-text-alignment-blocktune@latest"></script>
    <script src="https://cdn.jsdelivr.net/npm/@editorjs/text-variant-tune@latest"></script>

    <script src="/js/editor/PortalArticle.js"></script>

    <style>
        :root {
            --toloka-bg: #f8fafc;
            --preview-paper: #fffcf5;
        }

        body { font-family: 'Inter', sans-serif; background-color: var(--toloka-bg); }
        .editor-container { background: #fff; border-radius: 15px; min-height: 700px; padding: 60px; box-shadow: 0 10px 30px rgba(0,0,0,0.05); }

        /* Заголовок */
        .article-title-input { border: none; font-size: 2.8rem; font-weight: 800; width: 100%; margin-bottom: 30px; outline: none; }

        .sticky-toolbar {
            position: sticky; top: 85px; z-index: 1000;
            background: rgba(255, 255, 255, 0.9) !important;
            backdrop-filter: blur(10px);
        }

        /* Обмеження фото 20% тільки в режимі редагування */
        #editorjs .ce-block--type-image .ce-block__content,
        #editorjs .pa-preview img {
            max-width: 20% !important; margin: 0 auto;
        }
        #editorjs .ce-block--type-image .ce-block__content--stretched {
            max-width: 100% !important;
        }

        /* Стилі для Text Variant Tune */
        .cdx-text-variant--italic { font-style: italic; }
        .cdx-text-variant--gray { color: #64748b; }

        /* Стилі для прев'ю (читалки) */
        #editor-preview { font-family: 'Lora', serif; font-size: 1.3rem; }
        .preview-modal-content { background-color: var(--preview-paper); border-radius: 20px; border: none; }
    </style>
</head>
<body>
<div th:insert="~{/fragments/navbar :: navbarUniverse}"></div>

<div class="container py-5" style="margin-top: 80px;">
    <div class="row">
        <div class="col-lg-10 mx-auto">

            <div class="d-flex justify-content-between align-items-center mb-4 sticky-toolbar bg-white shadow-sm p-3 border rounded-pill">
                <a href="/creater/author/dashboard" class="btn btn-light rounded-pill px-3"><i class="fas fa-arrow-left me-2"></i>До списку</a>
                <div id="wordCounter" class="text-muted small fw-bold">Слів: 0</div>
                <div class="d-flex gap-2">
                    <button id="previewBtn" class="btn btn-light rounded-pill px-4 border"><i class="fas fa-eye me-2"></i>Перегляд</button>
                    <button id="saveDraftBtn" class="btn btn-outline-primary rounded-pill px-4">Зберегти чернетку</button>
                    <button id="publishBtn" class="btn btn-primary rounded-pill px-4">Опублікувати</button>
                </div>
            </div>

            <div class="editor-container">
                <input type="text" id="articleTitle" class="article-title-input" placeholder="Заголовок історії..." th:value="${article.title}">
                <div id="editorjs"></div>
            </div>
        </div>
    </div>
</div>

<div class="modal fade" id="previewModal" tabindex="-1" aria-hidden="true">
    <div class="modal-dialog modal-xl modal-dialog-scrollable">
        <div class="modal-content preview-modal-content">
            <div class="modal-header border-0 px-5 pt-4">
                <button type="button" class="btn-close" data-bs-dismiss="modal" aria-label="Close"></button>
            </div>
            <div class="modal-body px-5 pb-5">
                <div id="editor-preview"></div>
            </div>
        </div>
    </div>
</div>

<input type="hidden" id="articleUuid" th:value="${article.uuid}">
<input type="hidden" id="initialData" th:value="${article.postbody}">

<script th:inline="javascript">
    const initialRaw = document.getElementById('initialData').value;
    const AlignmentClass = window.AlignmentBlockTune || window.AlignmentTune;

    // 1. Конфігурація інструментів (однакова для обох редакторів)
    const editorTools = {
        alignTune: { class: AlignmentClass, config: { default: 'left' } },
        textVariant: TextVariantTune,
        header: {
            class: Header,
            inlineToolbar: true,
            tunes: ['alignTune', 'textVariant'],
            config: { levels: [2, 3], defaultLevel: 2 }
        },
        paragraph: { class: Paragraph, inlineToolbar: true, tunes: ['alignTune', 'textVariant'] },
        list: { class: NestedList, inlineToolbar: true },
        quote: { class: Quote, inlineToolbar: true, tunes: ['alignTune'] },
        image: {
            class: ImageTool,
            config: { endpoints: { byFile: '/api/author/image/upload' } }
        },
        embed: { class: Embed, config: { services: { youtube: true, twitter: true, instagram: true } } },
        table: { class: Table, inlineToolbar: true },
        delimiter: Delimiter,
        marker: Marker,
        portalArticle: PortalArticle
    };

    // 2. Основний редактор
    const editor = new EditorJS({
        holder: 'editorjs',
        tools: editorTools,
        data: initialRaw ? JSON.parse(initialRaw) : {},
        onChange: () => editor.save().then(updateWordCount)
    });

    // 3. Логіка Native Preview (ReadOnly)
    let previewInstance = null;

    async function showNativePreview() {
        const outputData = await editor.save();
        const currentTitle = document.getElementById('articleTitle').value;

        // Відкриваємо модалку
        const modalEl = document.getElementById('previewModal');
        const bsModal = new bootstrap.Modal(modalEl);
        bsModal.show();

        // Очищуємо попередній екземпляр
        if (previewInstance) {
            await previewInstance.isReady;
            previewInstance.destroy();
        }

        // Створюємо читалку
        previewInstance = new EditorJS({
            holder: 'editor-preview',
            readOnly: true,
            tools: editorTools,
            data: {
                blocks: [
                    { type: "header", data: { text: currentTitle || "Без заголовка", level: 1 } },
                    ...outputData.blocks
                ]
            }
        });
    }

    // --- Допоміжні функції ---
    function updateWordCount(data) {
        let text = document.getElementById('articleTitle').value + " ";
        data.blocks.forEach(b => { if(b.data.text) text += b.data.text + " "; });
        const count = text.trim() ? text.trim().split(/\s+/).length : 0;
        document.getElementById('wordCounter').innerText = `Слів: ${count}`;
    }

    async function saveArticle(isPublish) {
        const data = await editor.save();
        const res = await fetch('/api/author/article/save', {
            method: 'POST',
            headers: {'Content-Type': 'application/json'},
            body: JSON.stringify({
                uuid: document.getElementById('articleUuid').value,
                title: document.getElementById('articleTitle').value,
                postbody: JSON.stringify(data),
                status: isPublish ? 'PENDING' : 'DRAFT'
            })
        });
        if(res.ok) window.location.href = '/creater/author/dashboard?success=saved';
    }

    document.getElementById('previewBtn').onclick = showNativePreview;
    document.getElementById('saveDraftBtn').onclick = () => saveArticle(false);
    document.getElementById('publishBtn').onclick = () => saveArticle(true);
</script>
</body>
</html>
