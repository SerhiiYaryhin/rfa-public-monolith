<!DOCTYPE html>
<html lang="uk">
<head>
    <meta charset="UTF-8">
    <title>RFA WebRTC - Тест Прямого Ефіру з Токеном</title>
    <style>
        :root {
            --primary: #1877f2;
            --primary-hover: #166fe5;
            --success: #42b72a;
            --success-hover: #36a420;
            --danger: #e41e3f;
            --background: #0f172a;
            --panel-bg: #1e293b;
            --card-bg: #334155;
            --text-main: #f8fafc;
            --text-muted: #94a3b8;
            --border: #475569;
        }

        body {
            font-family: 'Segoe UI', Tahoma, Geneva, Verdana, sans-serif;
            margin: 0;
            padding: 40px 20px;
            background-color: var(--background);
            color: var(--text-main);
            min-height: 100vh;
        }

        .app-layout {
            display: flex;
            flex-direction: row;
            gap: 30px;
            max-width: 1250px;
            margin: 0 auto;
            flex-wrap: wrap;
        }

        .panel {
            flex: 1;
            min-width: 320px;
            background: var(--panel-bg);
            padding: 30px;
            border-radius: 16px;
            box-shadow: 0 10px 30px rgba(0, 0, 0, 0.25);
            border: 1px solid var(--border);
            display: flex;
            flex-direction: column;
            box-sizing: border-box;
        }

        .panel-left {
            flex: 1;
            max-width: 550px;
        }

        .panel-right {
            flex: 1.2;
            min-width: 400px;
        }

        @media (max-width: 950px) { /* Виправив селектор для @media */
            .app-layout {
                flex-direction: column;
            }
            .panel {
                max-width: 100%;
                min-width: 100%;
            }
        }

        h2 {
            margin-top: 0;
            font-size: 24px;
            color: #38bdf8;
            text-align: center;
            margin-bottom: 25px;
            display: flex;
            align-items: center;
            justify-content: center;
            gap: 10px;
        }

        .info-box {
            background-color: rgba(24, 119, 242, 0.15);
            border-left: 4px solid var(--primary);
            padding: 15px;
            margin-bottom: 25px;
            font-size: 14px;
            color: #93c5fd;
            border-radius: 0 8px 8px 0;
            line-height: 1.5;
        }

        .form-group {
            margin-bottom: 20px;
        }

        label {
            display: block;
            font-weight: 600;
            margin-bottom: 8px;
            color: var(--text-muted);
            font-size: 14px;
        }

        input[type="text"] {
            width: 100%;
            padding: 12px 16px;
            border: 1px solid var(--border);
            background-color: rgba(15, 23, 42, 0.6);
            color: var(--text-main);
            border-radius: 8px;
            box-sizing: border-box;
            font-size: 16px;
            transition: all 0.3s;
        }

        input[type="text"]:focus {
            outline: none;
            border-color: var(--primary);
            box-shadow: 0 0 0 3px rgba(24, 119, 242, 0.25);
        }

        input[type="text"]:disabled {
            background-color: rgba(15, 23, 42, 0.3);
            color: var(--text-muted);
            cursor: not-allowed;
        }

        .btn {
            background-color: var(--success);
            color: white;
            border: none;
            padding: 14px;
            font-size: 16px;
            border-radius: 8px;
            cursor: pointer;
            width: 100%;
            font-weight: bold;
            transition: all 0.3s;
            display: flex;
            align-items: center;
            justify-content: center;
            gap: 8px;
        }

        .btn:hover {
            background-color: var(--success-hover);
            transform: translateY(-1px);
        }

        .btn:disabled {
            background-color: var(--border);
            cursor: not-allowed;
            transform: none;
            opacity: 0.6;
        }

        .status {
            margin-top: 25px;
            padding: 15px;
            border-radius: 8px;
            background-color: #020617;
            color: #10b981;
            font-family: 'Courier New', Courier, monospace;
            font-size: 13px;
            height: 220px;
            overflow-y: auto;
            border: 1px solid var(--border);
            box-shadow: inset 0 2px 8px rgba(0,0,0,0.5);
        }

        .status div {
            margin-bottom: 6px;
            line-height: 1.4;
        }

        audio {
            width: 100%;
            margin-top: 25px;
            border-radius: 30px;
            outline: none;
        }

        .badge {
            display: inline-block;
            padding: 3px 8px;
            border-radius: 4px;
            font-size: 11px;
            font-weight: bold;
            text-transform: uppercase;
        }

        .badge-info { background: rgba(56, 189, 248, 0.2); color: #38bdf8; border: 1px solid rgba(56, 189, 248, 0.3); }
        .badge-success { background: rgba(16, 185, 129, 0.2); color: #10b981; border: 1px solid rgba(16, 185, 129, 0.3); }
        .badge-error { background: rgba(228, 30, 63, 0.2); color: #f43f5e; border: 1px solid rgba(228, 30, 63, 0.3); }
        .badge-debug { background: rgba(148, 163, 184, 0.1); color: #94a3b8; border: 1px solid rgba(148, 163, 184, 0.15); } /* Додано для DEBUG логів */


        /* Rooms section styling */
        .rooms-header {
            display: flex;
            justify-content: space-between;
            align-items: center;
            margin-bottom: 20px;
            padding-bottom: 10px;
            border-bottom: 1px solid var(--border);
        }

        .rooms-title {
            font-size: 18px;
            font-weight: bold;
            color: #38bdf8;
            margin: 0;
            display: flex;
            align-items: center;
            gap: 8px;
        }

        .btn-refresh {
            background: transparent;
            border: 1px solid var(--border);
            color: var(--text-main);
            padding: 6px 12px;
            border-radius: 6px;
            cursor: pointer;
            font-size: 12px;
            transition: all 0.2s;
            display: flex;
            align-items: center;
            gap: 5px;
        }

        .btn-refresh:hover {
            background: var(--border);
        }

        .rooms-list {
            display: flex;
            flex-direction: column;
            gap: 15px;
            overflow-y: auto;
            max-height: 580px;
            padding-right: 5px;
        }

        .room-card {
            background: var(--card-bg);
            border-radius: 10px;
            padding: 18px;
            border: 1px solid var(--border);
            transition: all 0.3s;
            position: relative;
            overflow: hidden;
        }

        .room-card:hover {
            transform: translateY(-2px);
            box-shadow: 0 6px 20px rgba(0,0,0,0.2);
            border-color: #64748b;
        }

        .room-card-live {
            border-left: 4px solid var(--danger);
            background: linear-gradient(to right, rgba(228, 30, 63, 0.05), var(--card-bg));
        }

        .room-header {
            display: flex;
            justify-content: space-between;
            align-items: flex-start;
            margin-bottom: 12px;
        }

        .room-title-container {
            display: flex;
            flex-direction: column;
            gap: 4px;
        }

        .room-name {
            font-size: 16px;
            font-weight: bold;
            color: var(--text-main);
        }

        .room-id {
            font-size: 12px;
            color: var(--text-muted);
        }

        .station-tag {
            background: rgba(24, 119, 242, 0.2);
            color: #60a5fa;
            font-size: 11px;
            padding: 2px 6px;
            border-radius: 4px;
            align-self: flex-start;
            font-weight: bold;
            border: 1px solid rgba(24, 119, 242, 0.3);
            margin-top: 2px;
        }

        .badge-live-pulse {
            background: rgba(228, 30, 63, 0.25);
            color: #f43f5e;
            border: 1px solid rgba(228, 30, 63, 0.4);
            animation: pulse 2s infinite;
        }

        @keyframes pulse {
            0% { opacity: 1; }
            50% { opacity: 0.5; }
            100% { opacity: 1; }
        }

        .room-body {
            margin-bottom: 15px;
            background: rgba(15, 23, 42, 0.3);
            padding: 10px;
            border-radius: 6px;
        }

        .participants-title {
            font-size: 12px;
            font-weight: 600;
            color: var(--text-muted);
            margin-bottom: 8px;
            text-transform: uppercase;
            letter-spacing: 0.5px;
        }

        .no-users {
            font-size: 13px;
            color: var(--text-muted);
            font-style: italic;
        }

        .user-list {
            list-style: none;
            padding: 0;
            margin: 0;
            display: flex;
            flex-direction: column;
            gap: 8px;
        }

        .user-item {
            display: flex;
            align-items: center;
            gap: 8px;
            font-size: 13px;
            padding: 4px 0;
            border-bottom: 1px solid rgba(255, 255, 255, 0.05);
        }

        .user-item:last-child {
            border-bottom: none;
        }

        .user-avatar {
            font-size: 14px;
        }

        .user-name {
            color: var(--text-main);
            font-weight: 500;
        }

        .user-id {
            font-size: 11px;
            color: var(--text-muted);
        }

        .state-badge {
            font-size: 10px;
            padding: 1px 6px;
            border-radius: 3px;
            font-weight: bold;
            margin-left: auto;
        }

        .state-badge.talking {
            background: rgba(234, 179, 8, 0.2);
            color: #fde047;
            border: 1px solid rgba(234, 179, 8, 0.3);
        }

        .state-badge.muted {
            background: rgba(148, 163, 184, 0.2);
            color: #cbd5e1;
            border: 1px solid rgba(148, 163, 184, 0.3);
        }

        .state-badge.active {
            background: rgba(16, 185, 129, 0.2);
            color: #34d399;
            border: 1px solid rgba(16, 185, 129, 0.3);
        }

        .room-actions {
            display: flex;
            justify-content: flex-end;
            margin-top: 10px;
        }

        .btn-join-room {
            background: var(--primary);
            color: white;
            border: none;
            padding: 8px 14px;
            border-radius: 6px;
            font-size: 13px;
            font-weight: bold;
            cursor: pointer;
            transition: background 0.2s;
        }

        .btn-join-room:hover {
            background: var(--primary-hover);
        }

        .no-rooms {
            text-align: center;
            padding: 40px 20px;
            color: var(--text-muted);
        }

        .no-rooms-icon {
            font-size: 48px;
            margin-bottom: 10px;
        }

        .error-box {
            background: rgba(228, 30, 63, 0.1);
            border: 1px solid rgba(228, 30, 63, 0.2);
            color: #f43f5e;
            padding: 15px;
            border-radius: 8px;
            text-align: center;
            font-size: 14px;
        }
    </style>

    <script src="https://cdnjs.cloudflare.com/ajax/libs/webrtc-adapter/8.2.3/adapter.min.js"></script>
    <script src="https://cdn.jsdelivr.net/gh/meetecho/janus-gateway@v1.2.0/html/janus.js"></script>
</head>
<body>

<div class="app-layout">
    <!-- Ліва панель: Підключення та консоль -->
    <div class="panel panel-left">
        <h2>📡 WebRTC Test (Token Auth)</h2>
        
        <div class="info-box">
            Ця сторінка використовує <strong>гнучку авторизацію</strong>. Ви можете вибрати тип авторизації, який підтримує ваш сервер Janus.
        </div>

        <div class="form-group">
            <label for="roomId">Room ID (ID кімнати):</label>
            <input type="text" id="roomId" placeholder="Введіть ID кімнати або виберіть праворуч" value="">
        </div>

        <fieldset style="border: 1px solid var(--border); border-radius: 8px; padding: 15px; margin-bottom: 20px; box-sizing: border-box;">
            <legend style="padding: 0 8px; color: #38bdf8; font-size: 13px; font-weight: bold;">Налаштування авторизації в Janus</legend>
            
            <div class="form-group" style="margin-bottom: 15px;">
                <label style="display: inline-block; font-weight: normal; margin-right: 15px; cursor: pointer; color: var(--text-main);">
                    <input type="radio" name="authType" value="token" checked onchange="toggleAuthFields()"> Динамічний токен
                </label>
                <label style="display: inline-block; font-weight: normal; margin-right: 15px; cursor: pointer; color: var(--text-main);">
                    <input type="radio" name="authType" value="manual_token" onchange="toggleAuthFields()"> Власний токен
                </label>
                <label style="display: inline-block; font-weight: normal; margin-right: 15px; cursor: pointer; color: var(--text-main);">
                    <input type="radio" name="authType" value="secret" onchange="toggleAuthFields()"> API Secret
                </label>
                <label style="display: inline-block; font-weight: normal; margin-right: 15px; cursor: pointer; color: var(--text-main);">
                    <input type="radio" name="authType" value="both" onchange="toggleAuthFields()"> Токен + API Secret
                </label>
                <label style="display: inline-block; font-weight: normal; cursor: pointer; color: var(--text-main);">
                    <input type="radio" name="authType" value="none" onchange="toggleAuthFields()"> Без паролів
                </label>
            </div>

            <div id="tokenFieldContainer" class="form-group" style="margin-bottom: 12px;">
                <label for="customToken">Token (Токен):</label>
                <input type="text" id="customToken" placeholder="Буде отримано автоматично при підключенні" value="" disabled>
            </div>

            <div id="secretFieldContainer" class="form-group" style="margin-bottom: 0; display: none;">
                <label for="customSecret">API Secret (Секрет):</label>
                <input type="text" id="customSecret" placeholder="Введіть API Secret (наприклад, janusrocks)" value="janusrocks">
            </div>
        </fieldset>

        <button id="connectBtn" class="btn" onclick="initiateConnection()">🔗 Підключитися</button>

        <audio id="audioPlayer" controls autoplay></audio>

        <div id="logConsole" class="status">-- СИСТЕМНИЙ ЖУРНАЛ --</div>
    </div>

    <!-- Права панель: Список кімнат та користувачів -->
    <div class="panel panel-right">
        <div class="rooms-header">
            <h3 class="rooms-title">🔊 Активні кімнати та користувачі</h3>
            <button class="btn-refresh" onclick="loadRooms()">
                🔄 Оновити
            </button>
        </div>
        
        <div id="roomsList" class="rooms-list">
            <div class="no-rooms">
                <div class="no-rooms-icon">⏳</div>
                <div class="no-rooms-text">Завантаження даних про кімнати...</div>
            </div>
        </div>
    </div>
</div>

<script>
    let janusInstance = null;
    let audioBridge = null;
    // const janusApiSecret = "janusrocks"; // API Secret, якщо використовується статично
    const serverUrl = "wss://test.rfa.toloka.media/janus-ws";

    /**
     * Вивід логів на сторінку для відладки
     */
    function log(message, type = 'INFO') {
        const consoleDiv = document.getElementById("logConsole");
        const time = new Date().toLocaleTimeString();
        let badgeClass = 'badge-info';
        if (type === 'SUCCESS') badgeClass = 'badge-success';
        if (type === 'ERROR') badgeClass = 'badge-error';
        if (type === 'DEBUG') badgeClass = 'badge-debug'; // Використовуйте 'DEBUG' для дебаг-повідомлень

        consoleDiv.innerHTML += `<div><span class="badge ${badgeClass}">${time}</span> ${message}</div>`;
        consoleDiv.scrollTop = consoleDiv.scrollHeight;
        console.log(`[${type}] ${message}`); // Додатковий вивід у консоль браузера
    }

    /**
     * Перемикач полів авторизації
     */
    function toggleAuthFields() {
        const authType = document.querySelector('input[name="authType"]:checked').value;
        const tokenContainer = document.getElementById("tokenFieldContainer");
        const secretContainer = document.getElementById("secretFieldContainer");
        const tokenInput = document.getElementById("customToken");
        const secretInput = document.getElementById("customSecret");

        // Скидання значень та стану полів
        tokenInput.value = "";
        tokenInput.disabled = true;
        secretInput.value = "janusrocks"; // Завжди встановлюємо дефолтний секрет

        tokenContainer.style.display = 'none';
        secretContainer.style.display = 'none';

        if (authType === 'token' || authType === 'both') {
            tokenContainer.style.display = 'block';
            tokenInput.placeholder = "Буде отримано автоматично при підключенні";
        }
        if (authType === 'manual_token') {
            tokenContainer.style.display = 'block';
            tokenInput.disabled = false;
            tokenInput.placeholder = "Введіть ваш токен тут";
        }
        if (authType === 'secret' || authType === 'both') {
            secretContainer.style.display = 'block';
        }
    }

    /**
     * Завантаження списку кімнат з API та відображення
     */
    async function loadRooms() {
        log("Завантаження активних кімнат...", 'DEBUG');
        try {
            const response = await fetch('/api/v1/webrtc/stream/rooms');
            if (!response.ok) {
                throw new Error("HTTP status " + response.status);
            }
            const rooms = await response.json();
            
            const roomsListDiv = document.getElementById("roomsList");
            if (!rooms || rooms.length === 0) {
                roomsListDiv.innerHTML = `
                    <div class="no-rooms">
                        <div class="no-rooms-icon">📭</div>
                        <div class="no-rooms-text">Немає активних кімнат у Janus.</div>
                    </div>`;
                return;
            }

            let html = '';
            rooms.forEach(room => {
                const isStreaming = room.rtp_stream; // Перевірка, чи є RTP стрім (індикатор LIVE)
                const roomId = room.room;
                const description = room.description || `Кімната ${roomId}`;
                const stationId = room.station_id || ''; // Якщо є інфа про станцію, напр. з БД
                const participants = room.participants || [];

                let streamBadge = '';
                let roomClass = 'room-card';
                if (isStreaming) {
                    streamBadge = `<span class="badge badge-live-pulse">🔴 LIVE</span>`;
                    roomClass += ' room-card-live';
                }

                let participantsHtml = '';
                if (participants.length === 0) {
                    participantsHtml = '<div class="no-users">Немає користувачів у кімнаті</div>';
                } else {
                    participantsHtml = '<ul class="user-list">';
                    participants.forEach(p => {
                        const isMuted = p.muted;
                        const isTalking = p.talking;
                        let stateBadge = '';
                        if (isTalking) {
                            stateBadge = '<span class="state-badge talking">📢 говорить</span>';
                        } else if (isMuted) {
                            stateBadge = '<span class="state-badge muted">🔇 вимкнено</span>';
                        } else {
                            stateBadge = '<span class="state-badge active">🎙️ активний</span>';
                        }
                        participantsHtml += `
                            <li class="user-item">
                                <span class="user-avatar">👤</span>
                                <span class="user-name">${p.display || 'Анонім'} <span class="user-id">(${p.id})</span></span>
                                ${stateBadge}
                            </li>`;
                    });
                    participantsHtml += '</ul>';
                }

                html += `
                    <div class="${roomClass}">
                        <div class="room-header">
                            <div class="room-title-container">
                                <span class="room-name">${description}</span>
                                <span class="room-id">ID: ${roomId}</span>
                                ${stationId ? `<span class="station-tag">${stationId}</span>` : ''}
                            </div>
                            ${streamBadge}
                        </div>
                        <div class="room-body">
                            <div class="participants-title">Учасники (${participants.length}):</div>
                            ${participantsHtml}
                        </div>
                        <div class="room-actions">
                            <button class="btn-join-room" onclick="selectAndConnect(${roomId})">🔌 Підключитися</button>
                        </div>
                    </div>`;
            });
            roomsListDiv.innerHTML = html;
        } catch (e) {
            log("Помилка завантаження моніторингу кімнат: " + e.message, 'ERROR');
            document.getElementById("roomsList").innerHTML = `
                <div class="error-box">
                    ⚠️ Помилка завантаження даних з API: ${e.message}
                </div>`;
        }
    }

    /**
     * Вибір кімнати та підключення
     */
    function selectAndConnect(roomId) {
        document.getElementById("roomId").value = roomId;
        initiateConnection();
    }

    /**
     * Ініціалізація з'єднання з Janus з вибором типу авторизації
     */
    async function initiateConnection() {
        const roomId = parseInt(document.getElementById("roomId").value);
        if (isNaN(roomId)) {
            alert("Будь ласка, введіть Room ID!");
            return;
        }

        const authType = document.querySelector('input[name="authType"]:checked').value;
        let token = null;
        let apisecret = null; // Будемо використовувати це поле для api_secret

        document.getElementById("connectBtn").disabled = true;
        log("Розпочинаємо ініціалізацію з'єднання...", 'INFO');

        // 1. Отримання токена (якщо потрібно)
        if (authType === 'token' || authType === 'both') {
            log("Запит динамічного токена та api_secret в API...", 'DEBUG');
            try {
                const response = await fetch('/api/v1/webrtc/stream/token');
                if (!response.ok) {
                    throw new Error(`HTTP error! status: ${response.status}`);
                }
                const data = await response.json();
                token = data.token;
                apisecret = data.api_secret; // Отримуємо api_secret від бекенда
                document.getElementById("customToken").value = token;
                document.getElementById("customSecret").value = apisecret; // Відображаємо отриманий секрет
                log(`Токен отримано: ${token.substring(0, 10)}... (API Secret: ${apisecret.substring(0, 5)}...)`, 'SUCCESS');
            } catch (e) {
                log("Помилка отримання токена/api_secret: " + e.message, 'ERROR');
                document.getElementById("connectBtn").disabled = false;
                return;
            }
        } else if (authType === 'manual_token') {
            const fieldToken = document.getElementById("customToken").value.trim();
            if (fieldToken) {
                token = fieldToken;
                log(`Використовуємо вказаний вручну токен: ${token.substring(0, 10)}...`, 'INFO');
            } else {
                log("Помилка: Токен не вказано для ручного режиму!", 'ERROR');
                document.getElementById("connectBtn").disabled = false;
                return;
            }
        }

        // 2. Отримання секрету (якщо потрібно)
        if (authType === 'secret' || authType === 'both' || authType === 'manual_token') { // Секрет може знадобитися навіть з ручним токеном
            const fieldSecret = document.getElementById("customSecret").value.trim();
            if (fieldSecret) {
                apisecret = fieldSecret;
            } else if (authType === 'secret' || authType === 'both') { // Якщо очікуємо секрет, але його немає
                log("Помилка: API Secret не вказано для обраного режиму!", 'ERROR');
                document.getElementById("connectBtn").disabled = false;
                return;
            }
        }
        
        startJanusStream(roomId, token, apisecret);
    }

    /**
     * Ініціалізує Janus.js та підключається до кімнати
     */
    function startJanusStream(roomId, token, apisecret) {
        log("Ініціалізація Janus з параметрами: " + 
            `Token: ${token ? token.substring(0, 10) + '...' : 'N/A'}, ` + 
            `API Secret: ${apisecret ? apisecret.substring(0, 5) + '...' : 'N/A'}`, 'DEBUG');

        // Конфігурація для Janus екземпляру
        let janusConfig = {
            server: serverUrl,
            success: function() {
                log("WebSocket підключено до Janus", 'SUCCESS');
                // Після успішного підключення, прикріплюємося до плагіна
                attachAudioBridgePlugin(roomId, token, apisecret);
            },
            error: function(error) {
                log("Помилка сесії Janus: " + error, 'ERROR');
                document.getElementById("connectBtn").disabled = false;
            },
            destroyed: function() {
                log("Сесію Janus знищено.", 'INFO');
                document.getElementById("connectBtn").disabled = false;
            }
        };

        // Додаємо авторизаційні параметри для створення сесії
        if (token) janusConfig.token = token;
        if (apisecret) janusConfig.apisecret = apisecret;
        
        // Знищуємо попередній інстанс якщо він існує
        if (janusInstance) {
            log("Знищення попередньої сесії Janus...", 'DEBUG');
            janusInstance.destroy();
            janusInstance = null; // Скидаємо інстанс
        }

        // Глобальна ініціалізація Janus.js, потім створення інстансу
        Janus.init({
            debug: "all",
            callback: function() {
                janusInstance = new Janus(janusConfig);
            }
        });
    }

    /**
     * Прикріплення до плагіна AudioBridge та вхід у кімнату
     */
    function attachAudioBridgePlugin(roomId, token, apisecret) {
        let attachConfig = {
            plugin: "janus.plugin.audiobridge",
            success: function(pluginHandle) {
                audioBridge = pluginHandle;
                log("Плагін AudioBridge прикріплено.", 'SUCCESS');
                
                let join = {
                    request: "join",
                    room: roomId,
                    display: "Web-Tester-" + Janus.randomString(4)
                };
                log("Надсилаємо запит на вхід у кімнату: " + roomId, 'INFO');
                audioBridge.send({ message: join });
            },
            error: function(error) {
                log("Помилка прикріплення плагіна: " + error, 'ERROR');
                document.getElementById("connectBtn").disabled = false;
            },
            onmessage: function(msg, jsep) {
                log("Отримано подію Janus від плагіна: " + JSON.stringify(msg), 'DEBUG');

                // Якщо Janus надсилає JSEP (WebRTC пропозицію)
                if (jsep) {
                    log("Обробка JSEP пропозиції від сервера...", 'INFO');
                    audioBridge.createAnswer({
                        jsep: jsep,
                        media: { audioSend: false, audioRecv: true, video: false }, // Тільки прийом звуку
                        success: function(jsepAnswer) {
                            log("SDP Answer сформовано. Завершуємо Handshake...", 'INFO');
                            let configure = { request: "configure", muted: true };
                            audioBridge.send({ message: configure, jsep: jsepAnswer });
                        },
                        error: function(error) {
                            log("WebRTC Answer Error: " + JSON.stringify(error), 'ERROR');
                        }
                    });
                }
            },
            onremotestream: function(stream) {
                log("УСПІХ: Отримано аудіопотік реального часу!", 'SUCCESS');
                const player = document.getElementById("audioPlayer");
                Janus.attachMediaStream(player, stream);
                player.play();
            },
            oncleanup: function() {
                log("З'єднання плагіна очищено.", 'INFO');
            }
        };

        // Додаємо авторизаційні параметри для прикріплення плагіна
        if (token) attachConfig.token = token;
        if (apisecret) attachConfig.apisecret = apisecret;
        
        janusInstance.attach(attachConfig);
    }


    // Запускати функції при завантаженні сторінки
    document.addEventListener("DOMContentLoaded", function() {
        toggleAuthFields(); // Встановлює початковий стан полів авторизації
        loadRooms(); // Завантажує кімнати одразу
        setInterval(loadRooms, 5000); // Оновлює кімнати кожні 5 секунд
    });
</script>
