<!DOCTYPE html>
<html lang="uk">
<head>
    <meta charset="UTF-8">
    <title>RFA WebRTC - Тест Прямого Ефіру з Токеном</title>
    <style>
        body { font-family: 'Segoe UI', Tahoma, Geneva, Verdana, sans-serif; margin: 40px; background-color: #f0f2f5; color: #1c1e21; }
        .container { max-width: 650px; background: white; padding: 40px; border-radius: 12px; box-shadow: 0 8px 24px rgba(0,0,0,0.15); margin: auto; }
        h2 { color: #1877f2; margin-top: 0; text-align: center; }
        .info-box { background-color: #e7f3ff; border-left: 5px solid #1877f2; padding: 15px; margin-bottom: 25px; font-size: 14px; }
        .form-group { margin-bottom: 20px; }
        label { display: block; font-weight: 600; margin-bottom: 8px; color: #4b4f56; }
        input[type="text"] { width: 100%; padding: 12px; border: 1px solid #dddfe2; border-radius: 6px; box-sizing: border-box; font-size: 16px; }
        button { background-color: #42b72a; color: white; border: none; padding: 14px; font-size: 18px; border-radius: 6px; cursor: pointer; width: 100%; font-weight: bold; transition: background 0.3s; }
        button:hover { background-color: #36a420; }
        button:disabled { background-color: #ccc; cursor: not-allowed; }
        .status { margin-top: 25px; padding: 15px; border-radius: 6px; background-color: #1c1e21; color: #00ff00; font-family: 'Courier New', Courier, monospace; font-size: 13px; height: 200px; overflow-y: auto; border: 1px solid #333; }
        audio { width: 100%; margin-top: 25px; border-radius: 30px; }
        .badge { display: inline-block; padding: 3px 8px; border-radius: 4px; font-size: 11px; font-weight: bold; text-transform: uppercase; margin-right: 5px; }
        .badge-info { background: #1877f2; color: white; }
        .badge-success { background: #42b72a; color: white; }
    </style>

    <script src="https://cdnjs.cloudflare.com/ajax/libs/webrtc-adapter/8.2.3/adapter.min.js"></script>
    <script src="https://cdn.jsdelivr.net/gh/meetecho/janus-gateway@v1.2.0/html/janus.js"></script>
</head>
<body>

<div class="container">
    <h2>📡 WebRTC Test (Token Auth)</h2>
    
    <div class="info-box">
        Ця сторінка використовує <strong>динамічні токени</strong>. Спочатку вона отримує токен у Spring Boot API, 
        реєструє його в Janus через RabbitMQ, і лише потім відкриває WebRTC з'єднання.
    </div>

    <div class="form-group">
        <label for="roomId">Room ID:</label>
        <input type="text" id="roomId" placeholder="ID кімнати з API" value="">
    </div>

    <button id="connectBtn" onclick="initiateWithToken()">🔗 Отримати токен та підключитися</button>

    <audio id="audioPlayer" controls autoplay></audio>

    <div id="logConsole" class="status">-- СИСТЕМНИЙ ЖУРНАЛ --</div>
</div>

<script>
    let janusInstance = null;
    let audioBridge = null;

    const serverUrl = "wss://test.rfa.toloka.media/janus-ws";

    function log(message, type = 'INFO') {
        const consoleDiv = document.getElementById("logConsole");
        const time = new Date().toLocaleTimeString();
        const badgeClass = type === 'SUCCESS' ? 'badge-success' : 'badge-info';
        consoleDiv.innerHTML += `<div><span class="badge ${badgeClass}">${time}</span> ${message}</div>`;
        consoleDiv.scrollTop = consoleDiv.scrollHeight;
    }

    /**
     * Крок 0: Отримання токена з бекенда
     */
    async function initiateWithToken() {
        const roomId = parseInt(document.getElementById("roomId").value);
        if (isNaN(roomId)) {
            alert("Будь ласка, введіть Room ID!");
            return;
        }

        document.getElementById("connectBtn").disabled = true;
        log("Запит токена в API...");

        try {
            const response = await fetch('/api/v1/webrtc/stream/token');
            const data = await response.json();
            const token = data.token;
            
            log("Токен отримано: " + token.substring(0, 15) + "...", 'SUCCESS');
            startJanusStream(roomId, token);

        } catch (e) {
            log("Помилка отримання токена: " + e.message, 'ERROR');
            document.getElementById("connectBtn").disabled = false;
        }
    }

    /**
     * Основна функція підключення
     */
    function startJanusStream(roomId, token) {
        log("Ініціалізація Janus з токеном...");

        Janus.init({
            debug: "all",
            callback: function() {
                janusInstance = new Janus({
                    server: serverUrl,
                    token: token, // ВИКОРИСТОВУЄМО ТОКЕН ЗАМІСТЬ APISECRET
                    success: function() {
                        log("WebSocket підключено (авторизовано токеном)");

                        janusInstance.attach({
                            plugin: "janus.plugin.audiobridge",
                            token: token, // Передаємо токен також і при прикріпленні до плагіна
                            success: function(pluginHandle) {
                                audioBridge = pluginHandle;
                                log("Плагін AudioBridge підключено.");
                                
                                let join = {
                                    request: "join",
                                    room: roomId,
                                    display: "User-" + Janus.randomString(4)
                                };
                                audioBridge.send({ message: join });
                            },
                            error: function(error) {
                                log("Помилка плагіна: " + error, 'ERROR');
                            },
                            onmessage: function(msg, jsep) {
                                if (jsep) {
                                    audioBridge.createAnswer({
                                        jsep: jsep,
                                        media: { audioSend: false, audioRecv: true, video: false },
                                        success: function(jsepAnswer) {
                                            audioBridge.send({ 
                                                message: { request: "configure", muted: true }, 
                                                jsep: jsepAnswer 
                                            });
                                        }
                                    });
                                }
                            },
                            onremotestream: function(stream) {
                                log("Аудіопотік отримано успішно!", 'SUCCESS');
                                Janus.attachMediaStream(document.getElementById("audioPlayer"), stream);
                            }
                        });
                    },
                    error: function(error) {
                        log("Помилка сесії: " + error, 'ERROR');
                        document.getElementById("connectBtn").disabled = false;
                    }
                });
            }
        });
    }
</script>

</body>
</html>
