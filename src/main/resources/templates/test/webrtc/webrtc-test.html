<!DOCTYPE html>
<html lang="uk">
<head>
    <meta charset="UTF-8">
    <title>RFA WebRTC - Тест Прямого Ефіру з Токеном</title>
    <script src="/js/webrtc/tolokawebrtc.js"></script>
    <link href="/css/webrtc/tolokawebrtc.css"  rel="stylesheet" />

    <script src="https://cdnjs.cloudflare.com/ajax/libs/webrtc-adapter/8.2.3/adapter.min.js"></script>
    <script src="https://cdn.jsdelivr.net/gh/meetecho/janus-gateway@v1.2.0/html/janus.js"></script>
</head>
<body>

<div class="app-layout">
    <!-- Ліва панель: Підключення та консоль -->
    <div class="panel panel-left">
        <h2>📡 WebRTC Test (Token Auth)</h2>
        
        <div class="info-box">
            Ця сторінка використовує <strong>гнучку авторизацію</strong>. Ви можете вибрати тип авторизації, який підтримує ваш сервер Janus.
        </div>

        <div class="form-group">
            <label for="stationId">Station ID (ID радіостанції):</label>
            <input type="text" id="stationId" placeholder="Наприклад: rock-fm" value="test_station">
        </div>

        <div class="form-group">
            <label for="roomId">Room ID (ID кімнати):</label>
            <input type="text" id="roomId" placeholder="Введіть ID кімнати або виберіть праворуч" value="">
        </div>

        <div class="form-group">
            <label for="streamUrl">Stream URL (URL потоку радіо):</label>
            <input type="text" id="streamUrl" placeholder="Наприклад: http://icecast.rfa:8000/ukraine" value="http://icecast.rfa:8000/ukraine">
        </div>
        
        <button id="startStreamBtn" class="btn btn-action-room" onclick="startStreamToRoom()">▶️ Запустити потік на радіо</button>
        <button id="stopStreamBtn" class="btn btn-action-room btn-danger" onclick="stopStreamFromRoom()" style="margin-top: 10px;">⏹️ Зупинити потік з радіо</button>


        <fieldset style="border: 1px solid var(--border); border-radius: 8px; padding: 15px; margin-top: 20px; margin-bottom: 20px; box-sizing: border-box;">
            <legend style="padding: 0 8px; color: #38bdf8; font-size: 13px; font-weight: bold;">Налаштування авторизації в Janus</legend>
            
            <div class="form-group" style="margin-bottom: 15px;">
                <label style="display: inline-block; font-weight: normal; margin-right: 15px; cursor: pointer; color: var(--text-main);">
                    <input type="radio" name="authType" value="token" checked onchange="toggleAuthFields()"> Динамічний токен
                </label>
                <label style="display: inline-block; font-weight: normal; margin-right: 15px; cursor: pointer; color: var(--text-main);">
                    <input type="radio" name="authType" value="manual_token" onchange="toggleAuthFields()"> Власний токен
                </label>
                <label style="display: inline-block; font-weight: normal; margin-right: 15px; cursor: pointer; color: var(--text-main);">
                    <input type="radio" name="authType" value="secret" onchange="toggleAuthFields()"> API Secret
                </label>
                <label style="display: inline-block; font-weight: normal; margin-right: 15px; cursor: pointer; color: var(--text-main);">
                    <input type="radio" name="authType" value="both" onchange="toggleAuthFields()"> Токен + API Secret
                </label>
                <label style="display: inline-block; font-weight: normal; cursor: pointer; color: var(--text-main);">
                    <input type="radio" name="authType" value="none" onchange="toggleAuthFields()"> Без паролів
                </label>
            </div>

            <div id="tokenFieldContainer" class="form-group" style="margin-bottom: 12px;">
                <label for="customToken">Token (Токен):</label>
                <input type="text" id="customToken" placeholder="Буде отримано автоматично при підключенні" value="" disabled>
            </div>

            <div id="secretFieldContainer" class="form-group" style="margin-bottom: 0; display: none;">
                <label for="customSecret">API Secret (Секрет):</label>
                <input type="text" id="customSecret" placeholder="Введіть API Secret (наприклад, janusrocks)" value="janusrocks">
            </div>
        </fieldset>

        <button id="connectBtn" class="btn" onclick="initiateConnection()">🔗 Підключитися до кімнати</button>

        <audio id="audioPlayer" controls autoplay></audio>

        <div id="logConsole" class="status">-- СИСТЕМНИЙ ЖУРНАЛ --</div>
    </div>

    <!-- Права панель: Список кімнат та користувачів -->
    <div class="panel panel-right">
        <div class="rooms-header">
            <h3 class="rooms-title">🔊 Активні кімнати та користувачі</h3>
            <button class="btn-refresh" onclick="loadRooms()">
                🔄 Оновити
            </button>
        </div>
        
        <div id="roomsList" class="rooms-list">
            <div class="no-rooms">
                <div class="no-rooms-icon">⏳</div>
                <div class="no-rooms-text">Завантаження даних про кімнати...</div>
            </div>
        </div>
    </div>
</div>



</body>
</html>
