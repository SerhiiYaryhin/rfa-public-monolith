<!DOCTYPE html>
<html lang="uk">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>RFA WebRTC - Прямий Ефір</title>
    <link rel="stylesheet" href="/css/webrtc/qwebrtc.css">
</head>
<body>
<div class="container">
    <!-- Заголовок -->
    <div class="header">
        <h1>📡 RFA WebRTC - Прямий Ефір</h1>
        <div class="status-container">
            <div id="statusIndicator" class="status-indicator"></div>
            <span id="statusText">Відключено</span>
        </div>
    </div>

    <!-- Аудіоплеєр -->
    <div class="audio-player-section">
        <h2>🔊 Аудіоплеєр</h2>
        <audio id="audioPlayer" controls autoplay></audio>
    </div>

    <!-- Список кімнат -->
    <div class="rooms-section">
        <div class="rooms-header">
            <h2>🎙️ Активні кімнати</h2>
            <button class="btn-refresh" onclick="UIRenderer.loadRooms()">🔄 Оновити</button>
        </div>
        <div id="roomsList">
            <div class="no-rooms">
                <div class="no-rooms-icon">⏳</div>
                <div class="no-rooms-text">Завантаження даних про кімнати...</div>
            </div>
        </div>
    </div>

    <!-- Системний журнал -->
    <div class="log-section">
        <h2>-- СИСТЕМНИЙ ЖУРНАЛ --</h2>
        <div id="logConsole"></div>
    </div>
</div>

<!-- Залежності -->
<script src="https://cdnjs.cloudflare.com/ajax/libs/webrtc-adapter/8.2.2/adapter.min.js"></script>
<script src="https://cdn.jsdelivr.net/gh/meetecho/janus-gateway@v1.2.0/html/janus.js"></script>
<script src="https://cdnjs.cloudflare.com/ajax/libs/sockjs-client/1.6.1/sockjs.min.js"></script>
<script src="https://cdnjs.cloudflare.com/ajax/libs/stomp.js/2.3.3/stomp.min.js"></script>

<!-- Наші модулі webrtc (порядок важливий!) -->

<script src="/js/webrtc/v2/config.js"></script>
<script src="/js/webrtc/v2/logger.js"></script>
<script src="/js/webrtc/v2/janus-connection.js"></script>
<script src="/js/webrtc/v2/websocket-signaling.js"></script>
<script src="/js/webrtc/v2/moderator.js"></script>
<script src="/js/webrtc/v2/room-manager.js"></script>
<script src="/js/webrtc/v2/stream-manager.js"></script>
<script src="/js/webrtc/v2/ui-renderer.js"></script>
<script src="/js/webrtc/v2/main.js"></script>
</body>
</html>
