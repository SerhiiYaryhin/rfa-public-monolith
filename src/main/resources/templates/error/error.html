<!DOCTYPE html>
<html lang="uk" xmlns:th="http://www.w3.org/1999/xhtml">
<head>
    <meta charset="utf-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1, shrink-to-fit=no" />
    <title>[[${status}]] - [[${title}]] | Толока</title>
    <link rel="icon" type="image/x-icon" href="/assets/favicon.ico" />
    <script src="https://use.fontawesome.com/releases/v6.3.0/js/all.js" crossorigin="anonymous"></script>
    <link href="/css/bootstrap.min.css" rel="stylesheet" />
    <style>
        body { background-color: #f8f9fa; font-family: 'Montserrat', sans-serif; }
        .error-container { min-height: 100vh; display: flex; align-items: center; justify-content: center; padding-top: 80px; }
        .error-card { border: none; border-radius: 20px; box-shadow: 0 15px 35px rgba(0,0,0,0.1); overflow: hidden; max-width: 600px; width: 100%; }
        .error-header { background: linear-gradient(135deg, #007db5, #ff8a00); padding: 40px; color: white; text-align: center; }
        .error-code { font-size: 6rem; font-weight: 900; line-height: 1; margin-bottom: 0; opacity: 0.8; }
        .error-body { padding: 40px; text-align: center; background: white; }
        .error-title { font-size: 1.5rem; font-weight: 700; color: #333; margin-bottom: 15px; }
        .error-text { color: #666; line-height: 1.6; margin-bottom: 30px; }
        .btn-home { background: #FF8000; border: none; color: white; padding: 12px 30px; border-radius: 50px; font-weight: 700; transition: all 0.3s; text-decoration: none; display: inline-block; }
        .btn-home:hover { background: #e67300; transform: translateY(-3px); box-shadow: 0 5px 15px rgba(255,128,0,0.3); color: white; }
        .error-footer { padding: 20px; background: #f1f3f5; font-size: 0.85rem; color: #adb5bd; }
    </style>
</head>
<body>
    <!-- Navigation-->
    <div th:insert="~{/fragments/navbar :: navbarUniverse}"></div>

    <div class="error-container container">
        <div class="error-card">
            <div class="error-header">
                <div class="error-code" th:text="${status}">500</div>
                <div class="text-uppercase small fw-bold mt-2" th:text="${status == 404 ? 'Page Not Found' : (status == 403 ? 'Access Denied' : 'Server Error')}">Error</div>
            </div>
            <div class="error-body">
                <h1 class="error-title" th:text="${title}">Щось пішло не так</h1>
                <p class="error-text" th:text="${description}">Виникла помилка під час обробки вашого запиту.</p>
                
                <div th:if="${path != 'невідомо'}" class="mb-4 small text-muted">
                    <code>Path: [[${path}]]</code>
                </div>

                <a href="/" class="btn-home shadow-sm">
                    <i class="fas fa-home me-2"></i>Повернутися на головну
                </a>
            </div>
            <div class="error-footer text-center">
                <span th:text="${#dates.format(timestamp, 'dd.MM.yyyy HH:mm:ss')}"></span> | &copy; Студія Толока
            </div>
        </div>
    </div>

    <!-- Footer -->
    <div th:insert="~{/fragments/common :: footer}"></div>
    
    <script src="/js/bootstrap.bundle.min.js"></script>
</body>
</html>
