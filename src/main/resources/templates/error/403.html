<!DOCTYPE html>
<html lang="uk" xmlns:th="http://www.w3.org/1999/xhtml">
<head>
    <meta charset="utf-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1">
    <title>403 — Доступ заборонено | Толока</title>
    <meta name="robots" content="noindex, nofollow" />
    <link rel="icon" type="image/x-icon" href="/assets/favicon.ico" />
    <link href="/css/bootstrap.min.css" rel="stylesheet" />
    <link href="/css/styles.css" rel="stylesheet" />
    <style>
        .error-page {
            min-height: 100vh;
            display: flex;
            align-items: center;
            justify-content: center;
            background: linear-gradient(135deg, #1a1a2e 0%, #2d1b3d 50%, #3d1f4a 100%);
            color: #fff;
            padding-top: 80px;
        }
        .error-page .error-code {
            font-size: 8rem;
            font-weight: 900;
            line-height: 1;
            background: linear-gradient(135deg, #c084fc, #ff8000);
            -webkit-background-clip: text;
            -webkit-text-fill-color: transparent;
            background-clip: text;
        }
        .error-page .error-message { font-size: 1.5rem; margin: 1rem 0; }
        .error-page .error-details {
            color: #adb5bd; font-size: 0.9rem; max-width: 500px; margin: 0 auto;
        }
        .error-page .quick-links { margin-top: 2rem; }
        .error-page .quick-links a {
            color: #c084fc; text-decoration: none; margin: 0 0.5rem;
            transition: color 0.2s ease;
        }
        .error-page .quick-links a:hover { color: #ff8000; }
        .error-page .error-icon {
            width: 120px; height: 120px; margin: 0 auto 1rem;
        }
    </style>
</head>
<body>
    <div th:insert="~{/fragments/navbar :: navbarUniverse}"></div>

    <div class="error-page">
        <div class="container text-center">

            <!-- Іконка замка (SVG) -->
            <div class="error-icon">
                <svg viewBox="0 0 120 120" xmlns="http://www.w3.org/2000/svg">
                    <!-- Замок -->
                    <rect x="35" y="55" width="50" height="35" rx="6" fill="#c084fc" opacity="0.8"/>
                    <path d="M45 55 L45 40 C45 30 75 30 75 40 L75 55" fill="none" stroke="#c084fc" stroke-width="4" opacity="0.6"/>
                    <!-- Ключова дірка -->
                    <circle cx="60" cy="70" r="5" fill="#1a1a2e"/>
                    <rect x="58" y="72" width="4" height="8" rx="2" fill="#1a1a2e"/>
                    <!-- 403 -->
                    <text x="60" y="110" text-anchor="middle" fill="#c084fc" font-size="14"
                          font-weight="bold" font-family="system-ui">403</text>
                </svg>
            </div>

            <div class="error-code">403</div>
            <h1 class="error-message">Доступ заборонено</h1>

            <p class="error-details">
                У вас немає прав для доступу до цієї сторінки.
                Якщо ви вважаєте, що це помилка — зв'яжіться з адміністратором.
            </p>

            <div class="quick-links">
                <a href="/">🏠 Головна</a> ·
                <a href="/creater/info">👤 Мій профайл</a> ·
                <a href="mailto:info@toloka.kiev.ua">📧 Написати</a>
            </div>
        </div>
    </div>

    <script src="/js/bootstrap.bundle.min.js"></script>
</body>
</html>
