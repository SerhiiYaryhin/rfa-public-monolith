<!DOCTYPE html>
<html lang="uk" xmlns:th="http://www.w3.org/1999/xhtml">
<head>
    <meta charset="UTF-8">
    <title>Профайл користувача</title>
</head>
<body>

<div th:fragment="profile">
    <div class="container">
        <div class="row">

            <!-- ===== ГОЛОВНА КОЛОНКА (8/12) ===== -->
            <div class="col-xl-8">

                <!-- Картка профайлу -->
                <div class="card">
                    <div class="card-body pb-0">
                        <div class="row align-items-center">
                            <!-- Фото + ім'я -->
                            <div class="col-md-3">
                                <div class="text-center border-end">
                                    <img loading="lazy"
                                         th:if="${clientdetail.profilephoto} != null"
                                         th:src="'/store/content/' + ${clientdetail.profilephoto.uuid}"
                                         class="img-fluid avatar-xxl rounded-circle"
                                         th:alt="${clientdetail.custname}">
                                    <img th:if="${clientdetail.profilephoto} == null"
                                         src="/assets/img/default-avatar.svg"
                                         class="img-fluid avatar-xxl rounded-circle"
                                         alt="Аватар">
                                    <h4 class="text-primary font-size-20 mt-3 mb-2">
                                        <span th:text="${clientdetail.custname} + ' ' + ${clientdetail.custsurname}"/>
                                    </h4>
                                    <h5 class="text-muted font-size-13 mb-2">
                                        <span th:text="${clientdetail.firmname}"/>
                                    </h5>
                                    <!-- Дата реєстрації -->
                                    <small class="text-muted"
                                           th:if="${clientdetail.createdate} != null"
                                           th:text="'З нами з ' + ${#dates.format(clientdetail.createdate, 'yyyy')}">
                                    </small>
                                </div>
                            </div>

                            <!-- Біо + статистика -->
                            <div class="col-md-9">
                                <div class="ms-3">
                                    <!-- Статистика -->
                                    <div class="d-flex flex-wrap gap-3 mb-3">
                                        <span class="badge bg-primary fs-6">
                                            🎵 <span th:text="${#lists.size(albumList)}">0</span> альбомів
                                        </span>
                                        <span class="badge bg-success fs-6">
                                            🎶 <span th:text="${#lists.size(trackList)}">0</span> треків
                                        </span>
                                        <span class="badge bg-info fs-6">
                                            📝 <span th:text="${#lists.size(postList)}">0</span> постів
                                        </span>
                                        <span class="badge bg-warning fs-6"
                                              th:if="${clientdetail.stationList} != null AND ${#lists.size(clientdetail.stationList) > 0}">
                                            📻 <span th:text="${#lists.size(clientdetail.stationList)}">0</span> станцій
                                        </span>
                                    </div>

                                    <!-- Біографія -->
                                    <div th:utext="${safeComments}"></div>

                                    <!-- Telegram посилання -->
                                    <div th:if="${clientdetail.telegramuser} != null" class="mt-2">
                                        <a th:href="'https://t.me/' + ${clientdetail.telegramuser}"
                                           target="_blank"
                                           rel="noopener"
                                           class="btn btn-sm btn-outline-primary">
                                            ✈️ Telegram
                                        </a>
                                    </div>
                                </div>
                            </div>
                        </div>
                    </div>
                </div>

                <!-- ===== АЛЬБОМИ / ТРЕКИ / ПОСТИ (акордеон) ===== -->
                <div class="row pt-subsection">
                    <div class="col">
                        <div class="accordion" id="accordionExample">

                            <!-- Альбоми -->
                            <div class="accordion-item" th:if="${albumList != null and #lists.size(albumList) > 0}">
                                <h2 class="accordion-header" id="headingOne">
                                    <button class="accordion-button collapsed" type="button"
                                            data-bs-toggle="collapse" data-bs-target="#collapseOne"
                                            aria-expanded="false" aria-controls="collapseOne">
                                        📀 Альбоми
                                        <span class="badge bg-primary ms-2" th:text="${#lists.size(albumList)}">0</span>
                                    </button>
                                </h2>
                                <div id="collapseOne" class="accordion-collapse collapse"
                                     aria-labelledby="headingOne" data-bs-parent="#accordionExample">
                                    <div class="accordion-body">
                                        <div class="list-group list-group-flush">
                                            <a th:each="album : ${albumList}"
                                               class="list-group-item list-group-item-action"
                                               th:href="'/creater/profile/album/' + ${album.uuid}"
                                               th:text="${album.name}">
                                                Альбом
                                            </a>
                                        </div>
                                    </div>
                                </div>
                            </div>

                            <!-- Треки -->
                            <div class="accordion-item" th:if="${trackList != null and #lists.size(trackList) > 0}">
                                <h2 class="accordion-header" id="headingTwo">
                                    <button class="accordion-button collapsed" type="button"
                                            data-bs-toggle="collapse" data-bs-target="#collapseTwo"
                                            aria-expanded="false" aria-controls="collapseTwo">
                                        🎶 Треки
                                        <span class="badge bg-success ms-2" th:text="${#lists.size(trackList)}">0</span>
                                    </button>
                                </h2>
                                <div id="collapseTwo" class="accordion-collapse collapse"
                                     aria-labelledby="headingTwo" data-bs-parent="#accordionExample">
                                    <div class="accordion-body">
                                        <div class="list-group list-group-flush">
                                            <a th:each="track : ${trackList}"
                                               class="list-group-item list-group-item-action"
                                               th:href="'/guest/viewtrack/' + ${track.uuid}">
                                                <span th:text="${track.name}">Трек</span>
                                                <small class="text-muted d-block"
                                                       th:if="${track.autor} != null"
                                                       th:text="${track.autor}">
                                                </small>
                                            </a>
                                        </div>
                                    </div>
                                </div>
                            </div>

                            <!-- Пости -->
                            <div class="accordion-item" th:if="${postList != null and #lists.size(postList) > 0}">
                                <h2 class="accordion-header" id="headingThree">
                                    <button class="accordion-button collapsed" type="button"
                                            data-bs-toggle="collapse" data-bs-target="#collapseThree"
                                            aria-expanded="false" aria-controls="collapseThree">
                                        📝 Пости
                                        <span class="badge bg-info ms-2" th:text="${#lists.size(postList)}">0</span>
                                    </button>
                                </h2>
                                <div id="collapseThree" class="accordion-collapse collapse"
                                     aria-labelledby="headingThree" data-bs-parent="#accordionExample">
                                    <div class="accordion-body">
                                        <div class="list-group list-group-flush">
                                            <a th:each="post : ${postList}"
                                               class="list-group-item list-group-item-action"
                                               th:href="'/post/postview/' + ${post.id}">
                                                <span th:text="${post.posttitle}">Пост</span>
                                                <small class="text-muted d-block"
                                                       th:if="${post.publishdate} != null"
                                                       th:text="'Опубліковано: ' + ${#dates.format(post.publishdate, 'dd.MM.yyyy')}">
                                                </small>
                                            </a>
                                        </div>
                                    </div>
                                </div>
                            </div>

                            <!-- Порожній стан -->
                            <div class="text-center text-muted py-4"
                                 th:if="${(albumList == null or #lists.isEmpty(albumList)) and 
                                          (trackList == null or #lists.isEmpty(trackList)) and 
                                          (postList == null or #lists.isEmpty(postList))}">
                                <p class="mb-0">Контент поки відсутній.</p>
                            </div>
                        </div>
                    </div>
                </div>
            </div>

            <!-- ===== SIDEBAR (4/12) ===== -->
            <div class="col-xl-4">

                <!-- Про нас (біо) -->
                <div class="card" th:if="${safeComments} != null AND ${#strings.length(safeComments) > 20}">
                    <div class="card-body">
                        <div class="pb-2">
                            <h4 class="card-title mb-3">📋 Про нас</h4>
                            <div th:utext="${#strings.abbreviate(safeComments, 200)}"></div>
                        </div>
                    </div>
                </div>

                <!-- Детальніше про нас -->
                <div class="card" th:if="${clientdetail.firmname} != null OR ${clientdetail.telegramuser} != null">
                    <div class="card-body">
                        <h4 class="card-title mb-4">🔍 Детальніше</h4>
                        <div class="table-responsive">
                            <table class="table table-bordered mb-0">
                                <tbody>
                                    <tr th:if="${clientdetail.firmname} != null">
                                        <th scope="row">Сценічне ім'я</th>
                                        <td><span th:text="${clientdetail.firmname}"></span></td>
                                    </tr>
                                    <tr th:if="${clientdetail.telegramuser} != null">
                                        <th scope="row">Telegram</th>
                                        <td>
                                            <a th:href="'https://t.me/' + ${clientdetail.telegramuser}"
                                               target="_blank" rel="noopener"
                                               th:text="'@' + ${clientdetail.telegramuser}">
                                            </a>
                                        </td>
                                    </tr>
                                    <tr th:if="${clientdetail.createdate} != null">
                                        <th scope="row">Реєстрація</th>
                                        <td>
                                            <span th:text="${#dates.format(clientdetail.createdate, 'dd.MM.yyyy')}"></span>
                                        </td>
                                    </tr>
                                    <tr th:if="${clientdetail.account} != null AND ${clientdetail.account > 0}">
                                        <th scope="row">Баланс</th>
                                        <td>
                                            <span class="badge bg-success"
                                                  th:text="${clientdetail.account} + ' ₴'">
                                            </span>
                                        </td>
                                    </tr>
                                </tbody>
                            </table>
                        </div>
                    </div>
                </div>

                <!-- Станції -->
                <div class="card"
                     th:if="${clientdetail.stationList} != null AND ${#lists.size(clientdetail.stationList) > 0}">
                    <div class="card-body">
                        <h4 class="card-title mb-4">📻 Наші станції</h4>
                        <ul class="list-unstyled mb-0">
                            <li class="mb-2" th:each="station : ${clientdetail.stationList}">
                                <a th:href="'/guest/station/' + ${station.uuid}"
                                   class="text-decoration-none"
                                   th:text="${station.name}">
                                </a>
                            </li>
                        </ul>
                    </div>
                </div>

                <!-- Жанри/стилі (з треків) -->
                <div class="card" th:if="${trackList != null and #lists.size(trackList) > 0}">
                    <div class="card-body">
                        <h4 class="card-title mb-4">🎵 Жанри</h4>
                        <div class="d-flex flex-wrap gap-2">
                            <span class="badge badge-soft-secondary p-2"
                                  th:each="track : ${trackList}"
                                  th:if="${track.style} != null and ${#strings.length(track.style) > 0}"
                                  th:text="${track.style}">
                            </span>
                        </div>
                    </div>
                </div>
            </div>

        </div>
    </div>
</div>

</body>
</html>
