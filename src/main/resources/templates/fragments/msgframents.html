<!DOCTYPE html>
<html lang="en" xmlns:th="http://www.thymeleaf.org">
<head>
    <meta charset="UTF-8">
</head>
<body>

<!-- Список кімнат у боковій панелі -->
<div th:fragment="listroom">
    <div class="px-3 py-2 bg-light small fw-bold text-uppercase text-muted">Кімнати</div>
    <div id="roomlist" class="list-group list-group-flush">
        <!-- Динамічно заповнюється через chat.js -->
    </div>
</div>

<!-- Список користувачів у боковій панелі -->
<div th:fragment="listuser">
    <div class="px-3 py-2 bg-light small fw-bold text-uppercase text-muted mt-2">Співрозмовники</div>
    <div id="userlist" class="list-group list-group-flush">
        <!-- Динамічно заповнюється через chat.js -->
    </div>
</div>

<!-- Стилі для елементів списку (додано для chat.js) -->
<style>
    .chat-item { border: none !important; padding: 12px 20px !important; transition: 0.2s; cursor: pointer; display: flex; align-items: center; gap: 12px; }
    .chat-item:hover { background-color: #f1f5f9 !important; }
    .chat-item.active { background-color: #eef2ff !important; border-left: 4px solid #6c5ce7 !important; }
    
    .chat-avatar { width: 40px; height: 40px; border-radius: 50%; background: #e2e8f0; display: flex; align-items: center; justify-content: center; font-weight: bold; color: #64748b; font-size: 0.9rem; flex-shrink: 0; }
    .active .chat-avatar { background: #6c5ce7; color: #fff; }
    
    .chat-info { overflow: hidden; }
    .chat-name { font-weight: 600; font-size: 0.9rem; color: #1e293b; margin-bottom: 2px; }
    .chat-status { font-size: 0.75rem; color: #94a3b8; }
</style>

<!-- Ці фрагменти більше не потрібні окремо, бо інтегровані в messenger.html, 
     але залишаємо порожніми для зворотної сумісності, якщо треба -->
<div th:fragment="areamessage"></div>
<div th:fragment="areaprivatemessage"></div>
<div th:fragment="areamessagecontrol"></div>

</body>
</html>
