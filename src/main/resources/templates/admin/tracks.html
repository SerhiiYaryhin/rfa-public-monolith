<!DOCTYPE html>
<html lang="uk" xmlns:th="http://www.thymeleaf.org"
      xmlns:sec="http://www.thymeleaf.org/thymeleaf-extras-springsecurity6">
<head>
    <meta charset="utf-8"/>
    <meta name="viewport" content="width=device-width, initial-scale=1, shrink-to-fit=no"/>
    <title>Адмін - Керування треками</title>
    <link rel="icon" type="image/x-icon" href="/assets/favicon.ico"/>
    <script src="https://use.fontawesome.com/releases/v6.3.0/js/all.js" crossorigin="anonymous"></script>
    <link href="/css/bootstrap.min.css" rel="stylesheet"/>
    <style>
        .switch { position: relative; display: inline-block; width: 50px; height: 24px; }
        .switch input { opacity: 0; width: 0; height: 0; }
        .slider { position: absolute; cursor: pointer; top: 0; left: 0; right: 0; bottom: 0; background-color: #ccc; transition: .4s; border-radius: 24px; }
        .slider:before { position: absolute; content: ""; height: 16px; width: 16px; left: 4px; bottom: 4px; background-color: white; transition: .4s; border-radius: 50%; }
        input:checked + .slider { background-color: #28a745; }
        input:focus + .slider { box-shadow: 0 0 1px #28a745; }
        input:checked + .slider:before { transform: translateX(26px); }
        .track-unapproved { background-color: rgba(255, 193, 7, 0.05) !important; }
        .admin-container { margin-top: 100px; }
    </style>
</head>
<body class="bg-light">
<header>
    <div th:insert="~{/fragments/navbar :: navbarUniverse}"></div>
</header>

<div class="container-fluid admin-container py-4">
    <div class="row mb-4">
        <div class="col-md-6">
            <h1 class="h3 fw-bold mb-0"><i class="fas fa-music text-primary me-2"></i>Керування треками</h1>
            <p class="text-muted">Модерація та публікація аудіо-контенту</p>
        </div>
        <div class="col-md-6 text-md-end">
             <div th:insert="~{/fragments/messagebox :: mymessagebox}"></div>
        </div>
    </div>

    <div class="card shadow-sm border-0">
        <div class="card-header bg-white py-3">
            <div th:insert="~{/fragments/common :: pagingline}"/>
        </div>
        <div class="card-body p-0">
            <div class="table-responsive">
                <table class="table table-hover align-middle mb-0">
                    <thead class="table-dark">
                    <tr>
                        <th class="ps-3">Аудіо</th>
                        <th>Назва / Автор</th>
                        <th class="text-center">Схвалено</th>
                        <th class="text-center">На порталі</th>
                        <th>Клієнт</th>
                        <th>Дата</th>
                        <th class="text-end pe-3">Дії</th>
                    </tr>
                    </thead>
                    <tbody>
                    <tr th:each="track : ${trackList}" th:classappend="${track.apruve != true} ? 'track-unapproved'">
                        <td class="ps-3">
                            <audio th:if="${track.storeitem != null}" controls style="width: 220px; height: 35px;">
                                <source th:src="'/store/audio/'+${track.storeitem.uuid}">
                            </audio>
                            <span th:if="${track.storeitem == null}" class="text-danger small">Файл відсутній</span>
                        </td>
                        <td>
                            <strong th:classappend="${track.name == null || track.name.isEmpty()} ? 'text-danger fw-normal italic'" 
                                    th:text="${(track.name == null || track.name.isEmpty()) ? '[БЕЗ НАЗВИ]' : track.name}">Назва</strong><br>
                            <span class="text-muted small" 
                                  th:classappend="${track.autor == null || track.autor.isEmpty()} ? 'text-danger'"
                                  th:text="${(track.autor == null || track.autor.isEmpty()) ? '[БЕЗ АВТОРА]' : track.autor}">Автор</span>
                        </td>
                        <td class="text-center">
                            <label class="switch">
                                <input type="checkbox"
                                       th:checked="${track.apruve == true}"
                                       th:data-url="@{'/admin/toggletrack/' + ${track.uuid}}"
                                       onchange="window.location.href=this.getAttribute('data-url')">
                                <span class="slider"></span>
                            </label>
                        </td>
                        <td class="text-center">
                            <a th:href="@{'/admin/togglepublish/' + ${track.uuid}}" 
                               class="btn btn-sm" 
                               th:classappend="${track.publishstatus == true} ? 'btn-success' : 'btn-outline-secondary'"
                               th:title="${track.publishstatus == true} ? 'Публічно' : 'Приховано'">
                                <i class="fas" th:classappend="${track.publishstatus == true} ? 'fa-eye' : 'fa-eye-slash'"></i>
                            </a>
                        </td>
                        <td>
                            <span class="small" th:text="${track.clientdetail.custname} + ' ' + ${track.clientdetail.custsurname}">Клієнт</span><br>
                            <small class="text-muted" th:text="${track.clientdetail.user.email}"></small>
                        </td>
                        <td class="small" th:text="${#dates.format(track.uploaddate, 'dd-MM-yy HH:mm')}">Дата</td>
                        <td class="text-end pe-3">
                            <div class="btn-group">
                                <a class="btn btn-sm btn-outline-info" th:href="@{'/admin/email/tool?recipient=' + ${track.clientdetail.user.email} + '&template=trackStatusNotification'}" title="Написати">
                                    <i class="fas fa-envelope"></i>
                                </a>
                                <a class="btn btn-sm btn-outline-primary" th:href="@{'/admin/edittrack/' + ${track.uuid}}" title="Редагувати">
                                    <i class="fas fa-edit"></i>
                                </a>
                                <a class="btn btn-sm btn-outline-danger" th:href="@{'/admin/deltrack/' + ${track.uuid}}" 
                                   onclick="return confirm('Видалити цей трек назавжди?')" title="Видалити">
                                    <i class="fas fa-trash"></i>
                                </a>
                            </div>
                        </td>
                    </tr>
                    </tbody>
                </table>
            </div>
        </div>
        <div class="card-footer bg-white py-3">
            <div th:insert="~{/fragments/common :: pagingline}"/>
        </div>
    </div>
</div>

<div th:insert="~{/fragments/common :: footer}"></div>
<script src="/js/bootstrap.bundle.min.js"></script>
</body>
</html>
