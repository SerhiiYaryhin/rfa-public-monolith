<!DOCTYPE html>
<html lang="uk" xmlns:th="http://www.thymeleaf.org"
      xmlns:sec="http://www.thymeleaf.org/thymeleaf-extras-springsecurity6">
<head>
    <meta charset="utf-8"/>
    <meta name="viewport" content="width=device-width, initial-scale=1, shrink-to-fit=no"/>
    <title>Адмін - Керування треками</title>
    <link rel="icon" type="image/x-icon" href="/assets/favicon.ico"/>
    <script src="https://use.fontawesome.com/releases/v6.3.0/js/all.js" crossorigin="anonymous"></script>
    <link href="/css/styles.css" rel="stylesheet"/>
    <style>
        .switch { position: relative; display: inline-block; width: 50px; height: 24px; }
        .switch input { opacity: 0; width: 0; height: 0; }
        .slider { position: absolute; cursor: pointer; top: 0; left: 0; right: 0; bottom: 0; background-color: #ccc; transition: .4s; border-radius: 24px; }
        .slider:before { position: absolute; content: ""; height: 16px; width: 16px; left: 4px; bottom: 4px; background-color: white; transition: .4s; border-radius: 50%; }
        input:checked + .slider { background-color: #28a745; }
        input:focus + .slider { box-shadow: 0 0 1px #28a745; }
        input:checked + .slider:before { transform: translateX(26px); }
        .track-unapproved { background-color: rgba(255, 193, 7, 0.05) !important; }
    </style>
</head>
<body id="page-top">

<header>
    <div th:insert="~{/fragments/navbar :: navbarUniverse}"></div>
</header>

<div style="padding-top: 100px" class="container-fluid">
    <div class="row">
        <div class="col-lg-12 text-center">
            <h2 class="section-heading text-uppercase">Керування треками</h2>
            <h3 class="section-subheading text-muted">Повний список треків системи</h3>
        </div>
    </div>

    <div class="row">
        <div class="col-lg-12">
            <table class="table table-hover align-middle">
                <thead class="table-dark">
                <tr>
                    <th>Слухати</th>
                    <th>Назва / Автор</th>
                    <th>Опубліковано</th>
                    <th>Файл</th>
                    <th>Клієнт</th>
                    <th>Дата завантаження</th>
                    <th>Дії</th>
                </tr>
                </thead>
                <tbody>
                <!-- Цикл по списку треків, додаємо клас для підсвічування неопублікованих -->
                <tr th:each="track : ${trackList}" th:classappend="${track.apruve != true} ? 'track-unapproved'">
                    <td>
                        <!-- Плеєр для попереднього прослуховування адміністратором -->
                        <audio th:if="${track.storeitem != null}" th:id="'voice'+${track.uuid}" controls style="width: 250px;">
                            <source th:src="'/store/audio/'+${track.storeitem.uuid}">
                        </audio>
                        <span th:if="${track.storeitem == null}" class="text-danger">Файл відсутній</span>
                    </td>
                    <td>
                        <strong th:text="${track.name}">Назва</strong><br>
                        <span th:text="${track.autor}">Автор</span><br>
                        <small class="text-muted" th:text="${track.style}">Стиль</small>
                    </td>
                    <td class="text-center">
                        <!-- Перемикач статусу публікації (AJAX-like поведінка через перезавантаження) -->
                        <label class="switch">
                            <input type="checkbox" th:checked="${track.apruve == true}" 
                                   th:onchange="'window.location.href=\'/admin/toggletrack/' + ${track.uuid} + '\''">
                            <span class="slider"></span>
                        </label>
                        <br>
                        <small th:text="${track.apruve == true} ? 'Так' : 'Ні'" 
                               th:class="${track.apruve == true} ? 'text-success' : 'text-danger'"></small>
                    </td>
                    <td>
                        <span th:if="${track.storeitem != null}" th:text="${track.storeitem.filename}">filename</span>
                    </td>
                    <td>
                        <!-- Інформація про автора завантаження -->
                        <span th:text="${track.clientdetail.custname} + ' ' + ${track.clientdetail.custsurname}">Клієнт</span>
                    </td>
                    <td th:text="${#dates.format(track.uploaddate, 'dd-MM-yyyy HH:mm')}">Дата</td>
                    <td>
                        <div class="btn-group">
                            <a class="btn btn-outline-info btn-sm" th:href="@{'/admin/email/tool?recipient=' + ${track.clientdetail.user.email} + '&template=trackStatusNotification'}" title="Написати автору">
                                <i class="fas fa-envelope"></i>
                            </a>
                            <a class="btn btn-outline-primary btn-sm" th:href="@{'/admin/edittrack/' + ${track.uuid}}" title="Редагувати дані треку">
                                <i class="fas fa-edit"></i>
                            </a>
                            <!-- Кнопка швидкого схвалення (лише для нових) -->
                            <a th:if="${track.apruve != true}" th:href="@{'/admin/publishtrack/' + ${track.uuid}}" 
                               class="btn btn-outline-success btn-sm" title="Схвалити">
                                <i class="fas fa-check"></i>
                            </a>
                            <!-- Кнопка швидкого зняття з публікації (лише для опублікованих) -->
                            <a th:if="${track.apruve == true}" th:href="@{'/admin/rejecttrack/' + ${track.uuid}}" 
                               class="btn btn-outline-warning btn-sm" title="Зняти з публікації">
                                <i class="fas fa-pause"></i>
                            </a>
                            <!-- Незворотне видалення з диска та бази даних -->
                            <a th:href="@{'/admin/deltrack/' + ${track.uuid}}" class="btn btn-outline-danger btn-sm" 
                               onclick="return confirm('Ви впевнені, що хочете видалити цей трек назавжди? Це видалить файл із сервера!')" title="Видалити">
                                <i class="fas fa-trash"></i>
                            </a>
                        </div>
                    </td>
                </tr>
                <tr th:if="${trackList.isEmpty()}">
                    <td colspan="7" class="text-center">Треків не знайдено</td>
                </tr>
                </tbody>
            </table>
        </div>
    </div>
</div>

<div th:insert="~{/fragments/common :: footer}"></div>

<script src="/js/bootstrap.bundle.min.js"></script>
</body>
</html>
