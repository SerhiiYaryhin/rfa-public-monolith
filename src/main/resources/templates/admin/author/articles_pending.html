<!DOCTYPE html>
<html xmlns="http://www.w3.org/1999/xhtml"
      xmlns:th="https://www.thymeleaf.org"
>
<head>
    <meta charset="utf-8"/>
    <meta name="viewport" content="width=device-width, initial-scale=1">
    <title>Модерація статей - Толока</title>
    <link href="/css/bootstrap.min.css" rel="stylesheet"/>
    <script src="https://use.fontawesome.com/releases/v6.3.0/js/all.js" crossorigin="anonymous"></script>
</head>
<body class="bg-light">
    <div th:insert="~{/fragments/navbar :: navbarUniverse}"></div>

    <div class="container py-5" style="margin-top: 100px;">
        <div class="d-flex justify-content-between align-items-center mb-4">
            <h1 class="h3 fw-bold mb-0">Статті на модерації</h1>
        </div>

        <div th:if="${param.success}" class="alert alert-success alert-dismissible fade show mb-4" role="alert">
            <span th:if="${param.success[0] == 'published'}">Статтю успішно опубліковано!</span>
            <span th:if="${param.success[0] == 'rejected'}">Статтю відхилено.</span>
            <button type="button" class="btn-close" data-bs-dismiss="alert" aria-label="Close"></button>
        </div>

        <div class="card shadow-sm border-0" style="border-radius: 15px;">
            <div class="table-responsive">
                <table class="table table-hover align-middle mb-0">
                    <thead class="bg-white">
                        <tr>
                            <th class="ps-4 py-3">Автор</th>
                            <th class="py-3">Заголовок</th>
                            <th class="py-3">Дата подачі</th>
                            <th class="py-3 text-end pe-4">Дії</th>
                        </tr>
                    </thead>
                    <tbody>
                        <tr th:each="art : ${articles}">
                            <td class="ps-4">
                                <div class="fw-bold" th:text="${art.column?.author?.custname + ' ' + art.column?.author?.custsurname}">Ім'я</div>
                                <div class="small text-muted" th:text="${art.column?.title}">Колонка</div>
                            </td>
                            <td>
                                <div class="fw-bold text-truncate" style="max-width: 400px;" th:text="${art.title}">Заголовок</div>
                            </td>
                            <td th:text="${#dates.format(art.createdAt, 'dd.MM.yyyy HH:mm')}">Дата</td>
                            <td class="text-end pe-4">
                                <a th:href="@{'/admin/author/articles/preview/' + ${art.uuid}}" class="btn btn-sm btn-primary rounded-pill px-3">
                                    Переглянути та опублікувати
                                </a>
                            </td>
                        </tr>
                        <tr th:if="${articles.isEmpty()}">
                            <td colspan="4" class="text-center py-5 text-muted">
                                <i class="fas fa-check-circle fa-3x mb-3 opacity-25"></i>
                                <p>Немає статей, що очікують перевірки</p>
                            </td>
                        </tr>
                    </tbody>
                </table>
            </div>
        </div>
    </div>

    <script src="/js/bootstrap.bundle.min.js"></script>
</body>
</html>
