<!DOCTYPE html>
<html xmlns="http://www.w3.org/1999/xhtml"
      xmlns:th="https://www.thymeleaf.org"
>
<head>
    <meta charset="utf-8"/>
    <meta name="viewport" content="width=device-width, initial-scale=1">
    <title>Модерація авторів - Адмінпанель</title>
    <link href="/css/bootstrap.min.css" rel="stylesheet"/>
    <script src="https://use.fontawesome.com/releases/v6.3.0/js/all.js" crossorigin="anonymous"></script>
</head>
<body class="bg-light">
    <div th:insert="~{/fragments/navbar :: navbarUniverse}"></div>

    <div class="container py-5" style="margin-top: 100px;">
        <div class="d-flex justify-content-between align-items-center mb-4">
            <h1 class="h3 fw-bold mb-0">Запити на авторську колонку</h1>
            <span class="badge bg-primary rounded-pill" th:text="${requests.size() + ' нових'}">0 нових</span>
        </div>

        <div th:if="${param.success}" class="alert alert-success alert-dismissible fade show mb-4" role="alert">
            <span th:if="${param.success[0] == 'approved'}">Запит успішно схвалено. Користувач отримав статус автора.</span>
            <span th:if="${param.success[0] == 'rejected'}">Запит відхилено.</span>
            <button type="button" class="btn-close" data-bs-dismiss="alert" aria-label="Close"></button>
        </div>

        <div class="card shadow-sm border-0" style="border-radius: 15px;">
            <div class="table-responsive">
                <table class="table table-hover align-middle mb-0">
                    <thead class="bg-white">
                        <tr>
                            <th class="ps-4 py-3">Користувач</th>
                            <th class="py-3">Тематика</th>
                            <th class="py-3">Дата запиту</th>
                            <th class="py-3 text-end pe-4">Дії</th>
                        </tr>
                    </thead>
                    <tbody>
                        <tr th:each="req : ${requests}">
                            <td class="ps-4">
                                <div class="fw-bold" th:text="${req.client.custname + ' ' + req.client.custsurname}">Ім'я</div>
                                <div class="small text-muted" th:text="${req.client.custemail}">email</div>
                            </td>
                            <td>
                                <div class="text-truncate" style="max-width: 300px;" th:text="${req.topic}" th:title="${req.topic}">Тематика</div>
                            </td>
                            <td th:text="${#dates.format(req.createdAt, 'dd.MM.yyyy HH:mm')}">Дата</td>
                            <td class="text-end pe-4">
                                <button type="button" class="btn btn-sm btn-outline-primary rounded-pill px-3 me-2" 
                                        data-bs-toggle="modal" th:data-bs-target="'#modal-' + ${req.uuid}">
                                    Деталі
                                </button>
                                <a th:href="@{'/admin/author/requests/approve/' + ${req.uuid}}" class="btn btn-sm btn-success rounded-pill px-3 me-2">Схвалити</a>
                                <a th:href="@{'/admin/author/requests/reject/' + ${req.uuid}}" class="btn btn-sm btn-danger rounded-pill px-3">Відхилити</a>

                                <!-- Modal -->
                                <div class="modal fade" th:id="'modal-' + ${req.uuid}" tabindex="-1" aria-hidden="true">
                                    <div class="modal-dialog modal-dialog-centered">
                                        <div class="modal-content border-0 shadow" style="border-radius: 20px;">
                                            <div class="modal-header border-0 pb-0">
                                                <h5 class="modal-title fw-bold">Заявка на авторство</h5>
                                                <button type="button" class="btn-close" data-bs-dismiss="modal" aria-label="Close"></button>
                                            </div>
                                            <div class="modal-body text-start p-4">
                                                <div class="mb-4">
                                                    <label class="small text-uppercase fw-bold text-muted d-block mb-1">Тематика</label>
                                                    <div th:text="${req.topic}"></div>
                                                </div>
                                                <div class="mb-4">
                                                    <label class="small text-uppercase fw-bold text-muted d-block mb-1">Резюме / Про себе</label>
                                                    <div class="p-3 bg-light rounded" th:text="${req.resume}"></div>
                                                </div>
                                                <div class="mb-0">
                                                    <label class="small text-uppercase fw-bold text-muted d-block mb-1">Посилання</label>
                                                    <div class="small" th:text="${req.links}"></div>
                                                </div>
                                            </div>
                                            <div class="modal-footer border-0 pt-0">
                                                <button type="button" class="btn btn-light rounded-pill px-4" data-bs-dismiss="modal">Закрити</button>
                                            </div>
                                        </div>
                                    </div>
                                </div>
                            </td>
                        </tr>
                        <tr th:if="${requests.isEmpty()}">
                            <td colspan="4" class="text-center py-5 text-muted">
                                <i class="fas fa-inbox fa-3x mb-3 opacity-25"></i>
                                <p>Нових запитів немає</p>
                            </td>
                        </tr>
                    </tbody>
                </table>
            </div>
        </div>
    </div>

    <script src="/js/bootstrap.bundle.min.js"></script>
</body>
</html>
