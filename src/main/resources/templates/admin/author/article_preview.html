<!DOCTYPE html>
<html xmlns="http://www.w3.org/1999/xhtml"
      xmlns:th="https://www.thymeleaf.org"
>
<head>
    <meta charset="utf-8"/>
    <meta name="viewport" content="width=device-width, initial-scale=1">
    <title>Перегляд статті - Адмінпанель</title>
    
    <link href="/css/bootstrap.min.css" rel="stylesheet"/>
    <link href="https://fonts.googleapis.com/css2?family=Inter:wght@400;600;800&family=Lora:ital,wght@0,400;0,700;1,400&display=swap" rel="stylesheet">
    <script src="https://use.fontawesome.com/releases/v6.3.0/js/all.js" crossorigin="anonymous"></script>

    <!-- Editor.js та плагіни (ідентично до сторінки редагування) -->
    <script src="https://cdn.jsdelivr.net/npm/@editorjs/editorjs@latest"></script>
    <script src="https://cdn.jsdelivr.net/npm/@editorjs/header@latest"></script>
    <script src="https://cdn.jsdelivr.net/npm/@editorjs/paragraph@latest"></script>
    <script src="https://cdn.jsdelivr.net/npm/@editorjs/nested-list@latest"></script>
    <script src="https://cdn.jsdelivr.net/npm/@editorjs/image@latest"></script>
    <script src="https://cdn.jsdelivr.net/npm/@editorjs/embed@latest"></script>
    <script src="https://cdn.jsdelivr.net/npm/@editorjs/quote@latest"></script>
    <script src="https://cdn.jsdelivr.net/npm/@editorjs/table@latest"></script>
    <script src="https://cdn.jsdelivr.net/npm/@editorjs/delimiter@latest"></script>
    <script src="https://cdn.jsdelivr.net/npm/@editorjs/marker@latest"></script>
    <script src="https://cdn.jsdelivr.net/npm/editorjs-text-alignment-blocktune@latest"></script>
    <script src="https://cdn.jsdelivr.net/npm/@editorjs/text-variant-tune@latest"></script>

    <style>
        body { font-family: 'Inter', sans-serif; background-color: #f8fafc; }
        .article-container { background: #fff; border-radius: 20px; padding: 60px; box-shadow: 0 10px 30px rgba(0,0,0,0.05); }
        .article-title { font-size: 3rem; font-weight: 800; margin-bottom: 2rem; color: #1e293b; }
        .sticky-mod-tools { position: sticky; top: 100px; }
        
        /* Стилі для рендерингу (Lora як у передперегляді) */
        #editorjs { font-family: 'Lora', serif; font-size: 1.25rem; }
        .ce-block__content, .ce-toolbar__content { max-width: 800px; }
        
        /* Стилі для Text Variant Tune */
        .cdx-text-variant--italic { font-style: italic; }
        .cdx-text-variant--gray { color: #64748b; }
    </style>
</head>
<body class="bg-light">
    <div th:insert="~{/fragments/navbar :: navbarUniverse}"></div>

    <div class="container py-5" style="margin-top: 100px;">
        <div class="row">
            <!-- Текст статті -->
            <div class="col-lg-8">
                <div class="article-container">
                    <h1 class="article-title" th:text="${article.title}">Заголовок</h1>
                    
                    <div class="d-flex align-items-center mb-5 text-muted border-bottom pb-4">
                        <img th:if="${article.column?.author?.profilephoto != null}" 
                             th:src="'/store/content/' + ${article.column.author.profilephoto.uuid}"
                             class="rounded-circle me-3 shadow-sm" style="width: 50px; height: 50px; object-fit: cover;">
                        <div>
                            <div class="fw-bold text-dark" th:text="${article.column?.author?.custname + ' ' + article.column?.author?.custsurname}">Автор</div>
                            <div class="small">Подано на модерацію: [[${#dates.format(article.createdAt, 'dd MMMM yyyy HH:mm')}]]</div>
                        </div>
                    </div>
                    
                    <!-- Editor.js Read-Only Instance -->
                    <div id="editorjs"></div>
                </div>
            </div>

            <!-- Інструменти модерації -->
            <div class="col-lg-4">
                <div class="sticky-mod-tools">
                    <div class="card shadow-sm border-0" style="border-radius: 15px;">
                        <div class="card-body p-4">
                            <h5 class="fw-bold mb-4">Керування публікацією</h5>
                            
                            <form th:action="@{'/admin/author/articles/approve/' + ${article.uuid}}" method="post" class="mb-3">
                                <button type="submit" class="btn btn-success w-100 rounded-pill py-2 fw-bold shadow-sm">
                                    <i class="fas fa-check me-2"></i>Схвалити та опублікувати
                                </button>
                            </form>
                            
                            <form th:action="@{'/admin/author/articles/reject/' + ${article.uuid}}" method="post" class="mb-3">
                                <button type="submit" class="btn btn-outline-warning w-100 rounded-pill py-2">
                                    <i class="fas fa-times me-2"></i>Відхилити
                                </button>
                            </form>
                            
                            <form th:action="@{'/admin/author/articles/delete/' + ${article.uuid}}" method="post" class="mb-3">
                                <button type="submit" class="btn btn-outline-danger w-100 rounded-pill py-2" 
                                        onclick="return confirm('Ви впевнені, що хочете видалити цю статтю назавжди?')">
                                    <i class="fas fa-trash-alt me-2"></i>Видалити статтю
                                </button>
                            </form>

                            <hr class="my-4">
                            <h6 class="small text-uppercase fw-bold text-muted mb-3">Зв'язок з автором</h6>
                            <a th:href="@{'/admin/email/tool?recipient=' + ${article.column?.author?.user?.email} + '&template=authorArticleNotice'}" 
                               class="btn btn-info w-100 rounded-pill text-white py-2 shadow-sm">
                                <i class="fas fa-envelope me-2"></i>Написати автору
                            </a>
                            
                            <hr class="my-4">
                            <a href="/admin/author/articles/pending" class="btn btn-light w-100 rounded-pill">
                                <i class="fas fa-arrow-left me-2"></i>Назад до списку
                            </a>
                        </div>
                    </div>
                </div>
            </div>
        </div>
    </div>

    <input type="hidden" id="articleData" th:value="${article.postbody}">

    <script th:inline="javascript">
        const rawData = document.getElementById('articleData').value;
        const AlignmentClass = window.AlignmentBlockTune || window.AlignmentTune;

        const editor = new EditorJS({
            holder: 'editorjs',
            readOnly: true,
            tools: {
                alignTune: { class: AlignmentClass, config: { default: 'left' } },
                textVariant: TextVariantTune,
                header: {
                    class: Header,
                    tunes: ['alignTune', 'textVariant'],
                    config: { levels: [2, 3], defaultLevel: 2 }
                },
                paragraph: { class: Paragraph, tunes: ['alignTune', 'textVariant'] },
                list: { class: NestedList },
                quote: { class: Quote, tunes: ['alignTune'] },
                image: { class: ImageTool },
                embed: { class: Embed },
                table: { class: Table },
                delimiter: Delimiter,
                marker: Marker
            },
            data: rawData ? JSON.parse(rawData) : {}
        });
    </script>
</body>
</html>
