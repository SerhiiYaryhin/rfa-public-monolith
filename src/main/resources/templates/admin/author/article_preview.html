<!DOCTYPE html>
<html xmlns="http://www.w3.org/1999/xhtml"
      xmlns:th="https://www.thymeleaf.org"
>
<head>
    <meta charset="utf-8"/>
    <meta name="viewport" content="width=device-width, initial-scale=1">
    <title>Перегляд статті - Адмінпанель</title>
    <link href="/css/bootstrap.min.css" rel="stylesheet"/>
    <script src="https://use.fontawesome.com/releases/v6.3.0/js/all.js" crossorigin="anonymous"></script>
    <style>
        .article-content { background: #fff; border-radius: 20px; padding: 50px; box-shadow: 0 10px 30px rgba(0,0,0,0.05); }
        .article-title { font-size: 3rem; font-weight: 800; margin-bottom: 2rem; }
        .block-header { margin-top: 2rem; font-weight: 700; }
        .block-image { width: 100%; border-radius: 10px; margin: 2rem 0; }
        .block-paragraph { font-size: 1.2rem; line-height: 1.8; color: #333; margin-bottom: 1.5rem; }
        .block-quote { border-left: 5px solid #0d6efd; padding-left: 1.5rem; font-style: italic; margin: 2rem 0; }
        .sticky-mod-tools { position: sticky; top: 100px; }
    </style>
</head>
<body class="bg-light">
    <div th:insert="~{/fragments/navbar :: navbarUniverse}"></div>

    <div class="container py-5" style="margin-top: 100px;">
        <div class="row">
            <!-- Текст статті -->
            <div class="col-lg-8">
                <div class="article-content">
                    <h1 class="article-title" th:text="${article.title}">Заголовок</h1>
                    <div class="d-flex align-items-center mb-5 text-muted">
                        <img th:if="${article.column?.author?.profilephoto != null}" 
                             th:src="'/store/content/' + ${article.column.author.profilephoto.uuid}"
                             class="rounded-circle me-3" style="width: 50px; height: 50px; object-fit: cover;">
                        <div>
                            <div class="fw-bold" th:text="${article.column?.author?.custname + ' ' + article.column?.author?.custsurname}">Автор</div>
                            <div class="small" th:text="${#dates.format(article.createdAt, 'dd MMMM yyyy')}">Дата</div>
                        </div>
                    </div>
                    
                    <!-- Рендеринг контенту -->
                    <div id="renderTarget"></div>
                </div>
            </div>

            <!-- Інструменти модерації -->
            <div class="col-lg-4">
                <div class="sticky-mod-tools">
                    <div class="card shadow-sm border-0" style="border-radius: 15px;">
                        <div class="card-body p-4">
                            <h5 class="fw-bold mb-4">Керування публікацією</h5>
                            
                            <form th:action="@{'/admin/author/articles/approve/' + ${article.uuid}}" method="post" class="mb-3">
                                <button type="submit" class="btn btn-success w-100 rounded-pill py-2 fw-bold">
                                    <i class="fas fa-check me-2"></i>Схвалити та опублікувати
                                </button>
                            </form>
                            
                            <form th:action="@{'/admin/author/articles/reject/' + ${article.uuid}}" method="post" class="mb-3">
                                <button type="submit" class="btn btn-outline-warning w-100 rounded-pill py-2">
                                    <i class="fas fa-times me-2"></i>Відхилити
                                </button>
                            </form>
                            
                            <form th:action="@{'/admin/author/articles/delete/' + ${article.uuid}}" method="post" class="mb-3">
                                <button type="submit" class="btn btn-outline-danger w-100 rounded-pill py-2" 
                                        onclick="return confirm('Ви впевнені, що хочете видалити цю статтю назавжди?')">
                                    <i class="fas fa-trash-alt me-2"></i>Видалити статтю
                                </button>
                            </form>

                            <hr class="my-4">
                            <h6 class="small fw-bold text-muted mb-3">Зв'язок з автором</h6>
                            <a th:href="@{'/admin/email/tool?recipient=' + ${article.column?.author?.user?.email} + '&template=authorArticleNotice'}" 
                               class="btn btn-info w-100 rounded-pill text-white py-2">
                                <i class="fas fa-envelope me-2"></i>Написати автору
                            </a>
                            
                            <hr class="my-4">
                            <a href="/admin/author/articles/pending" class="btn btn-light w-100 rounded-pill">
                                <i class="fas fa-arrow-left me-2"></i>Назад до списку
                            </a>
                        </div>
                    </div>
                </div>
            </div>
        </div>
    </div>

    <input type="hidden" id="articleData" th:value="${article.postbody}">

    <script th:inline="javascript">
        document.addEventListener('DOMContentLoaded', function() {
            const rawData = document.getElementById('articleData').value;
            if (!rawData) return;
            
            const data = JSON.parse(rawData);
            const target = document.getElementById('renderTarget');
            
            data.blocks.forEach(block => {
                let html = '';
                switch(block.type) {
                    case 'header':
                        html = `<h${block.data.level} class="block-header">${block.data.text}</h${block.data.level}>`;
                        break;
                    case 'paragraph':
                        html = `<p class="block-paragraph">${block.data.text}</p>`;
                        break;
                    case 'list':
                        const tag = block.data.style === 'ordered' ? 'ol' : 'ul';
                        html = `<${tag} class="block-list">` + 
                               block.data.items.map(item => `<li>${item}</li>`).join('') + 
                               `</${tag}>`;
                        break;
                    case 'image':
                        html = `<figure class="block-image">
                                    <img src="${block.data.file.url}" class="img-fluid rounded shadow-sm">
                                    ${block.data.caption ? `<figcaption class="text-center text-muted small mt-2">${block.data.caption}</figcaption>` : ''}
                                </figure>`;
                        break;
                    case 'quote':
                        html = `<blockquote class="block-quote">
                                    <p class="mb-0">${block.data.text}</p>
                                    ${block.data.caption ? `<cite class="small">— ${block.data.caption}</cite>` : ''}
                                </blockquote>`;
                        break;
                    case 'embed':
                        html = `<div class="block-embed ratio ratio-16x9 my-4">
                                    <iframe src="${block.data.embed}" frameborder="0" allowfullscreen></iframe>
                                </div>`;
                        break;
                }
                target.insertAdjacentHTML('beforeend', html);
            });
        });
    </script>
</body>
</html>
