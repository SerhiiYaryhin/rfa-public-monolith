<!DOCTYPE html>
<html lang="uk" xmlns:th="http://www.thymeleaf.org"
      xmlns:sec="http://www.thymeleaf.org/thymeleaf-extras-springsecurity6">
<head>
    <meta charset="utf-8"/>
    <meta name="viewport" content="width=device-width, initial-scale=1, shrink-to-fit=no"/>
    <title>Адмін - Керування подкастами</title>
    <link rel="icon" type="image/x-icon" href="/assets/favicon.ico"/>
    <script src="https://use.fontawesome.com/releases/v6.3.0/js/all.js" crossorigin="anonymous"></script>
    <link href="/css/bootstrap.min.css" rel="stylesheet"/>
    <style>
        .switch { position: relative; display: inline-block; width: 50px; height: 24px; }
        .switch input { opacity: 0; width: 0; height: 0; }
        .slider { position: absolute; cursor: pointer; top: 0; left: 0; right: 0; bottom: 0; background-color: #ccc; transition: .4s; border-radius: 24px; }
        .slider:before { position: absolute; content: ""; height: 16px; width: 16px; left: 4px; bottom: 4px; background-color: white; transition: .4s; border-radius: 50%; }
        input:checked + .slider { background-color: #28a745; }
        input:checked + .slider:before { transform: translateX(26px); }
        .admin-container { margin-top: 100px; }
        .podcast-unapproved { background-color: rgba(255, 193, 7, 0.05) !important; }
    </style>
</head>
<body class="bg-light">
<header>
    <div th:insert="~{/fragments/navbar :: navbarUniverse}"></div>
</header>

<div class="container admin-container py-4">
    <div class="row mb-4">
        <div class="col-md-6">
            <h1 class="h3 fw-bold mb-0"><i class="fas fa-podcast text-primary me-2"></i>Керування подкастами</h1>
            <p class="text-muted">Модерація та налаштування каналів подкастів</p>
        </div>
        <div class="col-md-6 text-md-end">
             <div th:insert="~{/fragments/messagebox :: mymessagebox}"></div>
        </div>
    </div>

    <div class="card shadow-sm border-0">
        <div class="card-header bg-white py-3">
            <div th:insert="~{/fragments/common :: pagingline}"/>
        </div>
        <div class="card-body p-0">
            <div class="table-responsive">
                <table class="table table-hover align-middle mb-0">
                    <thead class="table-dark">
                    <tr>
                        <th class="ps-3">Обкладинка</th>
                        <th>Назва / Автор</th>
                        <th class="text-center">Схвалено</th>
                        <th>Епізодів</th>
                        <th>Оновлено</th>
                        <th class="text-end pe-3">Дії</th>
                    </tr>
                    </thead>
                    <tbody>
                    <tr th:each="podcast : ${podcastList}" th:classappend="${podcast.apruve != true} ? 'podcast-unapproved'">
                        <td class="ps-3">
                            <img th:if="${podcast.imagechanelstore != null}" th:src="'/store/content/' + ${podcast.imagechanelstore.uuid}" 
                                 style="width: 50px; height: 50px; object-fit: cover; border-radius: 4px;" class="border">
                            <i th:if="${podcast.imagechanelstore == null}" class="fas fa-podcast fa-2x text-muted"></i>
                        </td>
                        <td>
                            <strong th:text="${podcast.title}">Назва</strong><br>
                            <small class="text-muted" th:text="${podcast.clientdetail}"></small>
                        </td>
                        <td class="text-center">
                            <label class="switch">
                                <input type="checkbox"
                                       th:checked="${podcast.apruve == true}"
                                       th:data-url="@{'/admin/togglepodcast/' + ${podcast.uuid}}"
                                       onchange="window.location.href=this.getAttribute('data-url')">
                                <span class="slider"></span>
                            </label>
                        </td>
                        <td class="text-center">
                            <span class="badge bg-secondary" th:text="${podcast.item.size()}">0</span>
                        </td>
                        <td class="small" th:text="${#dates.format(podcast.lastbuilddate, 'dd.MM.yy HH:mm')}">Дата</td>
                        <td class="text-end pe-3">
                            <div class="btn-group">
                                <a class="btn btn-sm btn-outline-info" th:href="@{'/podcast/view/' + ${podcast.uuid}}" target="_blank" title="Переглянути">
                                    <i class="fas fa-eye"></i>
                                </a>
                                <a class="btn btn-sm btn-outline-primary" th:href="@{'/podcast/pedit/' + ${podcast.uuid}}" title="Редагувати">
                                    <i class="fas fa-edit"></i>
                                </a>
                                <a class="btn btn-sm btn-outline-danger" th:href="@{'/podcast/localpodcastdel/' + ${podcast.uuid}}" 
                                   onclick="return confirm('Видалити цей подкаст назавжди?')" title="Видалити">
                                    <i class="fas fa-trash"></i>
                                </a>
                            </div>
                        </td>
                    </tr>
                    </tbody>
                </table>
            </div>
        </div>
        <div class="card-footer bg-white py-3">
            <div th:insert="~{/fragments/common :: pagingline}"/>
        </div>
    </div>
</div>

<div th:insert="~{/fragments/common :: footer}"></div>
<script src="/js/bootstrap.bundle.min.js"></script>
</body>
</html>
