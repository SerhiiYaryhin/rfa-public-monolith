<!DOCTYPE html>
<html xmlns="http://www.w3.org/1999/xhtml"
      xmlns:th="https://www.thymeleaf.org"
      xmlns:sec="http://www.thymeleaf.org/thymeleaf-extras-springsecurity6"
>
<head>
    <meta charset="utf-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1">
    <title>Адмін - Керування користувачами</title>
    <link rel="icon" type="image/x-icon" href="/assets/favicon.ico" />
    <script src="https://use.fontawesome.com/releases/v6.3.0/js/all.js" crossorigin="anonymous"></script>
    <link href="/css/bootstrap.min.css" rel="stylesheet" />
    <style>
        body { background-color: #f4f7f6; font-family: 'Inter', sans-serif; }
        .admin-container { margin-top: 100px; }
        .user-card { border: none; border-radius: 15px; box-shadow: 0 5px 15px rgba(0,0,0,0.05); }
        .role-badge { font-size: 0.75rem; font-weight: 600; padding: 0.35em 0.65em; border-radius: 50rem; }
        .avatar-circle { width: 40px; height: 40px; background-color: #e9ecef; border-radius: 50%; display: flex; align-items: center; justify-content: center; font-weight: bold; color: #495057; }
        .table thead th { border-top: none; background-color: #f8f9fa; text-transform: uppercase; font-size: 0.75rem; letter-spacing: 0.05em; color: #6c757d; }
        .search-input { border-radius: 50px; padding-left: 20px; border: 1px solid #dee2e6; }
        .search-btn { border-radius: 50px; padding: 0.375rem 1.5rem; }
    </style>
</head>
<body>
<header>
    <div th:insert="~{/fragments/navbar :: navbarUniverse}"></div>
</header>

<div class="container admin-container py-4">
    <div class="row mb-4 align-items-center">
        <div class="col-md-6">
            <h1 class="h3 fw-bold mb-0">Користувачі системи</h1>
            <p class="text-muted small mb-0">Керування профілями та правами доступу</p>
        </div>
        <div class="col-md-6">
            <form th:action="@{/admin/users}" method="get" class="d-flex">
                <input type="text" name="q" th:value="${query}" class="form-control search-input me-2 shadow-sm" placeholder="Пошук за email, ім'ям або фірмою...">
                <button type="submit" class="btn btn-primary search-btn shadow-sm">Пошук</button>
            </form>
        </div>
    </div>

    <div th:if="${param.success}" class="alert alert-success alert-dismissible fade show mb-4 rounded-3" role="alert">
        Дані успішно оновлено.
        <button type="button" class="btn-close" data-bs-dismiss="alert" aria-label="Close"></button>
    </div>

    <div class="card user-card overflow-hidden">
        <div class="card-body p-0">
            <div class="table-responsive">
                <table class="table table-hover align-middle mb-0">
                    <thead>
                        <tr>
                            <th class="ps-4">Користувач</th>
                            <th>Фірма</th>
                            <th>Ролі</th>
                            <th>Статус</th>
                            <th class="text-end pe-4">Дії</th>
                        </tr>
                    </thead>
                    <tbody>
                        <tr th:each="user : ${usersList}">
                            <td class="ps-4">
                                <div class="d-flex align-items-center">
                                    <div class="avatar-circle me-3" th:text="${#strings.substring(user.clientdetail.custname,0,1)}">U</div>
                                    <div>
                                        <div class="fw-bold" th:text="${user.clientdetail.custname + ' ' + user.clientdetail.custsurname}">Ім'я</div>
                                        <div class="small text-muted" th:text="${user.email}">email</div>
                                    </div>
                                </div>
                            </td>
                            <td>
                                <div th:text="${user.clientdetail.firmname}">Фірма</div>
                                <div class="small text-muted" th:text="${user.clientdetail.uuid}">UUID</div>
                            </td>
                            <td>
                                <div class="d-flex flex-wrap gap-1">
                                    <span th:each="role : ${user.roles}" class="badge bg-light text-primary border border-primary-subtle role-badge" th:text="${role.role}">ROLE</span>
                                </div>
                            </td>
                            <td class="text-end pe-4">
                                <div class="btn-group">
                                    <a th:href="@{'/admin/email/tool?recipient=' + ${user.email}}" class="btn btn-sm btn-outline-info" title="Надіслати листа">
                                        <i class="fas fa-envelope"></i>
                                    </a>
                                    <button type="button" class="btn btn-sm btn-outline-primary" 
                                            data-bs-toggle="modal" th:data-bs-target="'#editModal-' + ${user.id}" title="Редагувати">
                                        <i class="fas fa-user-edit"></i>
                                    </button>
                                    <a th:href="@{'/admin/users/delete/' + ${user.id}}" class="btn btn-sm btn-outline-danger" 
                                       onclick="return confirm('Ви впевнені?')" title="Видалити/Заблокувати">
                                        <i class="fas fa-trash-alt"></i>
                                    </a>
                                </div>
                                
                                <!-- Modal -->
                                <div class="modal fade" th:id="'editModal-' + ${user.id}" tabindex="-1" aria-hidden="true">
                                    <div class="modal-dialog modal-dialog-centered">
                                        <div class="modal-content border-0 shadow" style="border-radius: 20px;">
                                            <form th:action="@{/admin/users/update}" method="post">
                                                <input type="hidden" name="userId" th:value="${user.id}">
                                                <div class="modal-header border-0 px-4 pt-4">
                                                    <h5 class="modal-title fw-bold">Редагування користувача</h5>
                                                    <button type="button" class="btn-close" data-bs-dismiss="modal" aria-label="Close"></button>
                                                </div>
                                                <div class="modal-body text-start px-4">
                                                    <div class="row g-3">
                                                        <div class="col-md-6">
                                                            <label class="form-label small fw-bold">Ім'я</label>
                                                            <input type="text" name="custname" th:value="${user.clientdetail.custname}" class="form-control rounded-3" required>
                                                        </div>
                                                        <div class="col-md-6">
                                                            <label class="form-label small fw-bold">Прізвище</label>
                                                            <input type="text" name="custsurname" th:value="${user.clientdetail.custsurname}" class="form-control rounded-3" required>
                                                        </div>
                                                        <div class="col-12">
                                                            <label class="form-label small fw-bold">Назва фірми / Студії</label>
                                                            <input type="text" name="firmname" th:value="${user.clientdetail.firmname}" class="form-control rounded-3">
                                                        </div>
                                                        <div class="col-12 mt-4">
                                                            <label class="form-label small fw-bold mb-3 d-block">Ролі користувача</label>
                                                            <div class="row row-cols-2 g-2">
                                                                <div th:each="r : ${allRoles}" class="col">
                                                                    <div class="form-check">
                                                                        <input class="form-check-input" type="checkbox" name="roles" 
                                                                               th:value="${r}" th:id="'role-' + ${user.id} + '-' + ${r}"
                                                                               th:checked="${#lists.toList(user.roles.![role]).contains(r)}">
                                                                        <label class="form-check-label small" th:for="'role-' + ${user.id} + '-' + ${r}" th:text="${r.label}">Роль</label>
                                                                    </div>
                                                                </div>
                                                            </div>
                                                        </div>
                                                    </div>
                                                </div>
                                                <div class="modal-footer border-0 px-4 pb-4 mt-3">
                                                    <button type="button" class="btn btn-light rounded-pill px-4" data-bs-dismiss="modal">Скасувати</button>
                                                    <button type="submit" class="btn btn-primary rounded-pill px-4 fw-bold">Зберегти зміни</button>
                                                </div>
                                            </form>
                                        </div>
                                    </div>
                                </div>
                            </td>
                        </tr>
                        <tr th:if="${usersList.isEmpty()}">
                            <td colspan="5" class="text-center py-5 text-muted">
                                <i class="fas fa-user-slash fa-3x mb-3 opacity-25"></i>
                                <p>Користувачів не знайдено</p>
                            </td>
                        </tr>
                    </tbody>
                </table>
            </div>
        </div>
        
        <!-- Пагінація -->
        <div class="card-footer bg-white py-4 border-top" th:if="${totalPages > 1}">
            <nav aria-label="Page navigation">
                <ul class="pagination pagination-sm justify-content-center mb-0">
                    <li class="page-item" th:classappend="${currentPage == 0} ? 'disabled'">
                        <a class="page-link shadow-none" th:href="@{/admin/users(page=${currentPage - 1}, q=${query})}"><i class="fas fa-chevron-left"></i></a>
                    </li>
                    <li class="page-item" th:each="i : ${#numbers.sequence(0, totalPages - 1)}" th:classappend="${i == currentPage} ? 'active'">
                        <a class="page-link shadow-none" th:href="@{/admin/users(page=${i}, q=${query})}" th:text="${i + 1}">1</a>
                    </li>
                    <li class="page-item" th:classappend="${currentPage == totalPages - 1} ? 'disabled'">
                        <a class="page-link shadow-none" th:href="@{/admin/users(page=${currentPage + 1}, q=${query})}"><i class="fas fa-chevron-right"></i></a>
                    </li>
                </ul>
            </nav>
        </div>
    </div>
</div>

<div th:insert="~{/fragments/common :: footer}"></div>
<script src="/js/bootstrap.bundle.min.js"></script>
</body>
</html>
