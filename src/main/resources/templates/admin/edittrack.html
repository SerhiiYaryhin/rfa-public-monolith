<!DOCTYPE html>
<html lang="uk" xmlns:th="http://www.thymeleaf.org"
      xmlns:sec="http://www.thymeleaf.org/thymeleaf-extras-springsecurity6">
<head>
    <meta charset="utf-8"/>
    <title>Адмін - Редагування треку</title>
    <link th:rel="stylesheet" th:href="@{/css/bootstrap.min.css} "/>
    <link href="/css/styles.css" rel="stylesheet"/>
    <script src="https://use.fontawesome.com/releases/v6.3.0/js/all.js" crossorigin="anonymous"></script>
    <script src="https://cdn.tiny.cloud/1/jfs2v9uma7vkxn632w42djz02jxqivtjdlovkkqzafgboa10/tinymce/6/tinymce.min.js" referrerpolicy="origin"></script>
</head>
<body id="page-top">

<header>
    <div th:insert="~{/fragments/navbar :: navbarUniverse}"></div>
</header>

<div style="padding-top: 100px" class="container">
    <div class="row justify-content-center">
        <div class="col-lg-8">
            <div class="card shadow">
                <div class="card-header bg-primary text-white d-flex justify-content-between align-items-center">
                    <h4 class="mb-0">Редагування треку (Адмін-панель)</h4>
                    <span class="badge bg-light text-primary" th:text="${track.uuid}">uuid</span>
                </div>
                <div class="card-body">
                    
                    <!-- Плеєр для перевірки що саме редагуємо -->
                    <div class="mb-4 text-center bg-light p-3 rounded">
                        <h6>Попереднє прослуховування:</h6>
                        <audio th:if="${track.storeitem != null}" controls style="width: 100%">
                            <source th:src="'/store/audio/'+${track.storeitem.uuid}">
                        </audio>
                    </div>

                    <form th:action="@{/admin/edittrack}" method="post" th:object="${track}">
                        <input type="hidden" th:field="*{uuid}"/>
                        
                        <div class="row mb-3">
                            <div class="col-md-6">
                                <label class="form-label fw-bold">Виконавець / Автор</label>
                                <input type="text" th:field="*{autor}" class="form-control" required>
                            </div>
                            <div class="col-md-6">
                                <label class="form-label fw-bold">Назва треку</label>
                                <input type="text" th:field="*{name}" class="form-control" required>
                            </div>
                        </div>

                        <div class="mb-3">
                            <label class="form-label fw-bold">Стиль / Жанр</label>
                            <input type="text" th:field="*{style}" class="form-control">
                        </div>

                        <div class="mb-3">
                            <label class="form-label fw-bold">Опис треку</label>
                            <textarea th:field="*{description}" id="trackDescription"></textarea>
                        </div>

                        <div class="row mb-3 align-items-center">
                            <div class="col-md-6">
                                <label class="form-label fw-bold">Альбом автора</label>
                                <select th:field="*{album}" class="form-select">
                                    <option value="">-- Без альбому --</option>
                                    <option th:each="al : ${albumList}" th:value="${al.id}" th:text="${al.name}"></option>
                                </select>
                            </div>
                            <div class="col-md-6">
                                <div class="form-check mt-4">
                                    <input class="form-check-input" type="checkbox" th:field="*{notnormalvocabulary}" id="notnormal">
                                    <label class="form-check-label" for="notnormal">
                                        Ненормативна лексика
                                    </label>
                                </div>
                            </div>
                        </div>

                        <hr>
                        <div class="d-flex justify-content-between">
                            <a href="/admin/tracks" class="btn btn-secondary">
                                <i class="fas fa-arrow-left me-1"></i> Скасувати
                            </a>
                            <button type="submit" class="btn btn-success px-5">
                                <i class="fas fa-save me-1"></i> Зберегти зміни
                            </button>
                        </div>
                    </form>
                </div>
            </div>
        </div>
    </div>
</div>

<script>
    tinymce.init({
        selector: '#trackDescription',
        height: 300,
        plugins: 'advlist autolink lists link charmap preview anchor searchreplace visualblocks code fullscreen insertdatetime media table help wordcount',
        toolbar: 'undo redo | blocks | bold italic | alignleft aligncenter alignright alignjustify | bullist numlist outdent indent | help'
    });
</script>

<div th:insert="~{/fragments/common :: footer}"></div>
<script src="/js/bootstrap.bundle.min.js"></script>
</body>
</html>
