<!DOCTYPE html>
<html xmlns="http://www.w3.org/1999/xhtml"
      xmlns:th="https://www.thymeleaf.org"
      xmlns:sec="http://www.thymeleaf.org/thymeleaf-extras-springsecurity6"
>
<head>
    <meta charset="utf-8"/>
    <meta name="viewport" content="width=device-width, initial-scale=1">
    <title>Толока - Моє Сховище</title>
    <link rel="icon" type="image/x-icon" href="/assets/favicon.ico"/>
    <script src="https://use.fontawesome.com/releases/v6.3.0/js/all.js" crossorigin="anonymous"></script>
    <link href="/css/bootstrap.min.css" rel="stylesheet"/>
    <link th:rel="stylesheet" th:href="@{/css/dropzone.min.css}"/>
    <link th:rel="stylesheet" th:href="@{/css/toastr.min.css}"/>
    <style>
        .store-table img { width: 50px; height: 50px; object-fit: cover; border-radius: 4px; }
        .file-icon { font-size: 1.5rem; color: #6c757d; }
        .uuid-copy { cursor: pointer; color: #0d6efd; font-family: monospace; font-size: 0.85rem; }
        .uuid-copy:hover { text-decoration: underline; }
        .dropzone { border: 2px dashed #0d6efd; border-radius: 12px; background: #f8f9fa; }
    </style>
</head>
<body class="bg-light">
<header>
    <div th:insert="~{/fragments/navbar :: navbarUniverse}"></div>
</header>

<div class="container py-5" style="padding-top: 120px !important;">
    <div class="row mb-4">
        <div class="col-md-6">
            <h1 class="display-6 fw-bold mb-0"><i class="fas fa-database text-primary me-2"></i>Ваше Сховище</h1>
            <p class="text-muted">Керуйте всіма вашими медіа-файлами в одному місці</p>
        </div>
        <div class="col-md-6 text-md-end">
            <div th:insert="~{/fragments/messagebox :: mymessagebox}"></div>
        </div>
    </div>

    <!-- Область завантаження -->
    <div class="row mb-5">
        <div class="col-12">
            <div id="dropzone">
                <form action="/creater/storefileupload" class="dropzone needsclick" id="main-store-upload" method="post">
                    <input type="hidden" th:name="${_csrf.parameterName}" th:value="${_csrf.token}"/>
                    <div class="dz-message needsclick py-4">
                        <i class="fas fa-cloud-upload-alt fa-3x text-primary mb-3"></i><br>
                        <span class="fs-5 fw-bold">Перетягніть файли сюди або натисніть для вибору</span><br>
                        <small class="text-muted text-uppercase">Файли автоматично з'являться у списку нижче</small>
                    </div>
                </form>
            </div>
        </div>
    </div>

    <!-- Список файлів -->
    <div class="card shadow-sm border-0">
        <div class="card-header bg-white py-3">
            <div th:insert="~{/fragments/common :: pagingline}"/>
        </div>
        <div class="card-body p-0">
            <div class="table-responsive">
                <table class="table table-hover align-middle mb-0 store-table">
                    <thead class="table-light">
                    <tr>
                        <th class="ps-4">Тип</th>
                        <th>Файл / UUID</th>
                        <th>Дата</th>
                        <th>Тип системи</th>
                        <th class="text-end pe-4">Дії</th>
                    </tr>
                    </thead>
                    <tbody>
                    <tr th:each="storeitem : ${viewList}">
                        <td class="ps-4">
                            <!-- Попередній перегляд для зображень -->
                            <img th:if="${#strings.contains(storeitem.contentMimeType, 'image')}" 
                                 th:src="'/store/content/'+${storeitem.uuid}" class="shadow-sm border">
                            <!-- Іконка для аудіо -->
                            <i th:if="${#strings.contains(storeitem.contentMimeType, 'audio')}" class="fas fa-file-audio file-icon"></i>
                            <!-- Іконка для інших -->
                            <i th:if="${!#strings.contains(storeitem.contentMimeType, 'image') && !#strings.contains(storeitem.contentMimeType, 'audio')}" 
                               class="fas fa-file file-icon"></i>
                        </td>
                        <td>
                            <strong th:text="${storeitem.filename}">filename</strong><br>
                            <span class="uuid-copy" th:data-uuid="${storeitem.uuid}" onclick="copyToClipboard(this.getAttribute('data-uuid'))" 
                                  th:title="'Натисніть щоб скопіювати UUID'">
                                <i class="far fa-copy me-1"></i> <span th:text="${storeitem.uuid}">uuid</span>
                            </span>
                        </td>
                        <td>
                            <small th:text="${#dates.format(storeitem.createdate, 'dd-MM-yyyy HH:mm')}"></small>
                        </td>
                        <td>
                            <span class="badge bg-light text-dark border" th:text="${storeitem.storefiletype.label}"></span>
                        </td>
                        <td class="text-end pe-4">
                            <div class="btn-group">
                                <a class="btn btn-sm btn-outline-secondary" th:href="@{'/store/edititem/'+${storeitem.uuid} + '?from=user'}" title="Редагувати">
                                    <i class="fas fa-edit"></i>
                                </a>
                                <a class="btn btn-sm btn-outline-primary" th:href="@{'/store/content/og/'+${storeitem.uuid}+'/'+ ${storeitem.filename}}" download title="Завантажити">
                                    <i class="fas fa-download"></i>
                                </a>
                                <a class="btn btn-sm btn-outline-danger" th:href="@{'/creater/store/delete/'+${storeitem.uuid} + '?from=user'}" 
                                   onclick="return confirm('Видалити цей файл назавжди з сервера?')" title="Видалити">
                                    <i class="fas fa-trash-alt"></i>
                                </a>
                            </div>
                        </td>
                    </tr>
                    <tr th:if="${viewList.isEmpty()}">
                        <td colspan="5" class="text-center py-5 text-muted">Ваше сховище поки порожнє. Завантажте свій перший файл!</td>
                    </tr>
                    </tbody>
                </table>
            </div>
        </div>
        <div class="card-footer bg-white py-3">
            <div th:insert="~{/fragments/common :: pagingline}"/>
        </div>
    </div>
</div>

<div th:insert="~{/fragments/common :: footer}"></div>

<script th:src="@{/js/jquery.min.js}"></script>
<script src="/js/bootstrap.bundle.min.js"></script>
<script th:src="@{/js/dropzone.min.js}"></script>
<script th:src="@{/js/toastr.min.js}"></script>

<script th:inline="javascript">
    Dropzone.autoDiscover = false;

    $(document).ready(function() {
        $("#main-store-upload").dropzone({
            maxFiles: 10,
            success : function(file, response) {
                if (response && !response.startsWith("error")) {
                    toastr.success('Файл ' + file.name + ' завантажено');
                    // Оновлюємо сторінку через короткий час, щоб користувач побачив прогрес
                    setTimeout(() => { window.location.reload(); }, 1000);
                } else {
                    toastr.error('Помилка: ' + response);
                }
            }
        });
    });

    function copyToClipboard(text) {
        navigator.clipboard.writeText(text).then(function() {
            toastr.info('UUID скопійовано: ' + text);
        }, function(err) {
            console.error('Could not copy text: ', err);
        });
    }
</script>

</body>
</html>
