<!DOCTYPE html>
<html xmlns:th="http://www.thymeleaf.org" lang="uk">
<head>
    <meta charset="UTF-8">
    <title>Форма банера</title>
    <link rel="icon" type="image/x-icon" href="/assets/favicon.ico" />
    <link href="https://cdn.jsdelivr.net/npm/bootstrap@5.3.3/dist/css/bootstrap.min.css" rel="stylesheet">
    <link href="https://cdnjs.cloudflare.com/ajax/libs/dropzone/5.9.3/dropzone.min.css" rel="stylesheet">
    <style>
        #media-preview img, #media-preview video {
            max-width: 300px;
            max-height: 250px;
        }
        #media-preview audio {
            width: 100%;
            max-width: 300px;
        }
    </style>
</head>
<body class="bg-light">

<!-- Контейнер для Bootstrap Toast -->
<div class="toast-container position-fixed bottom-0 end-0 p-3" id="toastContainer"></div>

<header>
    <div th:insert="~{/fragments/navbar :: navbarUniverse}"></div>
</header>
<div style="padding-top: 60px"/>

<div class="container-fluid">
    <div class="mt-4"></div>
    <div class="card shadow rounded-4 mt-4">
        <div class="card-header bg-primary text-white">
            <h4 class="mb-0"
                th:text="${#strings.isEmpty(banner.uuid) ? 'Створення банера' : 'Редагування банера'}"></h4>
        </div>
        <div class="card-body">

            <!-- Діагностичний блок (за потреби розкоментуй) -->
            <!--
            <div class="alert alert-warning">
                <strong>Діагностика:</strong><br>
                banner.uuid: <code th:text="${banner.uuid}">-</code><br>
                banner.uuidmedia: <code th:text="${banner.uuidmedia}">-</code><br>
                banner.store: <code th:text="${banner.store}">-</code><br>
                banner.store.uuid: <code th:text="${banner.store != null ? banner.store.uuid : 'null'}">-</code><br>
                banner.bannertype: <code th:text="${banner.bannertype}">-</code>
            </div>
            -->

            <!-- ============================================ -->
            <!-- БЛОК ЗАВАНТАЖЕННЯ МЕДІА (тільки для існуючого банера) -->
            <!-- ============================================ -->
            <div th:if="${banner.id != null}" class="row">
                <div class="row">
                    <!-- Ліва колонка: Dropzone + кнопка вибору зі сховища -->
                    <div class="col-sm-6">
                        <div id="dropzone">
                            <form th:action="@{/api/store/upload}"
                                  class="dropzone needsclick"
                                  id="demo-upload"
                                  method="post">
                                <input type="hidden"
                                       th:name="${_csrf.parameterName}"
                                       th:value="${_csrf.token}"/>
                                <div class="dz-message needsclick">
                                    <button type="button" class="dz-button">
                                        Перенесіть медіафайл сюди або натисніть для вибору медіафайлу.<br>
                                        Якщо не завантажувати медіафайл, то банер буде текстовим.
                                    </button>
                                    <br/>
                                </div>
                            </form>
                        </div>

                        <!-- Кнопка вибору зі сховища — під Dropzone -->
                        <div class="mt-3">
                            <a th:href="@{/banners/select-media(bannerUuid=${banner.uuid})}">
                                <button type="button" class="btn btn-outline-success btn-sm">
                                    📁 Обрати медіа зі сховища
                                </button>
                            </a>
                        </div>
                    </div>

                    <!-- Права колонка: Прев'ю + кнопка видалення -->
                    <div class="col-sm-6">
                        <h6 class="mb-2">Попередній перегляд:</h6>

                        <!-- Контейнер прев'ю -->
                        <div id="media-preview">
                            <!-- Серверний рендеринг, якщо банер вже має медіа -->
                            <div th:if="${banner.uuidmedia != null and !#strings.isEmpty(banner.uuidmedia)}">
                                <div th:switch="${banner.bannertype.name}">
                                    <img th:case="'IMAGE'"
                                         th:src="@{/store/content/{uuid}(uuid=${banner.uuidmedia})}"
                                         alt="Зображення"
                                         class="img-fluid rounded">
                                    <audio th:case="'AUDIO'" controls>
                                        <source th:src="@{/store/content/{uuid}(uuid=${banner.uuidmedia})}">
                                        Ваш браузер не підтримує аудіо-елемент.
                                    </audio>
                                    <video th:case="'VIDEO'" controls>
                                        <source th:src="@{/store/content/{uuid}(uuid=${banner.uuidmedia})}">
                                        Ваш браузер не підтримує відео-елемент.
                                    </video>
                                    <span th:case="*">Невідомий формат</span>
                                </div>
                            </div>
                            <!-- Якщо медіа немає -->
                            <div th:if="${banner.uuidmedia == null or #strings.isEmpty(banner.uuidmedia)}"
                                 class="text-muted fst-italic" id="no-media-placeholder">
                                Медіафайл не приєднано. Банер буде текстовим.
                            </div>
                        </div>

                        <!-- Кнопка "Видалити медіа" — ПІД прев'ю, видима тільки коли медіа є -->
                        <div id="clear-media-container" class="mt-3"
                             th:style="${banner.uuidmedia != null and !#strings.isEmpty(banner.uuidmedia)} ? '' : 'display:none;'">
                            <a th:href="@{'/banners/clearmedia/' + ${banner.uuid}}"
                               onclick="return confirm('Видалити медіа з банера і зробити його текстовим?');">
                                <button type="button" class="btn btn-danger btn-sm">
                                    🗑️ Видалити медіа і зробити банер текстовим
                                </button>
                            </a>
                        </div>
                    </div>
                </div>
            </div>
        </div>

        <!-- ============================================ -->
        <!-- ФОРМА ЗБЕРЕЖЕННЯ БАНЕРА -->
        <!-- ============================================ -->
        <form th:action="@{/banners/save}" th:object="${banner}" method="post" class="needs-validation" novalidate>

            <!-- Приховані поля -->
            <input type="hidden" th:field="*{uuid}">
            <input type="hidden" th:field="*{id}">
            <input type="hidden" th:field="*{uuidmedia}">
            <input type="hidden" th:field="*{store}">

            <!-- Заголовок -->
            <hr>
            <div style="padding-top: 20px"/>
            <div class="mb-3">
                <label for="title" class="form-label">Заголовок</label>
                <input type="text" th:field="*{title}" id="title" class="form-control"
                       placeholder="Введіть заголовок" required>
                <div class="invalid-feedback">Вкажіть заголовок</div>
            </div>

            <!-- Опис -->
            <div class="mb-3">
                <label for="description" class="form-label">Текст банера</label>
                <textarea th:field="*{description}" id="description" rows="3" class="form-control"
                          placeholder="Введіть текст"></textarea>
            </div>

            <!-- Посилання -->
            <div class="mb-3">
                <label for="link" class="form-label">Посилання</label>
                <input type="url" th:field="*{link}" id="link" class="form-control"
                       placeholder="https://example.com">
            </div>

            <!-- Дати -->
            <div class="row">
                <div class="col-md-4 mb-3">
                    <label for="startdate" class="form-label">Дата старту</label>
                    <input type="date" th:field="*{startdate}" id="startdate" class="form-control">
                </div>
                <div class="col-md-4 mb-3">
                    <label for="enddate" class="form-label">Дата завершення</label>
                    <input type="date" th:field="*{enddate}" id="enddate" class="form-control">
                </div>
                <div class="col-md-4 mb-3">
                    <label for="aprovedate" class="form-label">Дата схвалення</label>
                    <input type="date" th:field="*{aprovedate}" id="aprovedate" class="form-control">
                </div>
            </div>

            <!-- Тип банера (прихований, заповнюється JS) -->
            <div hidden class="mb-3">
                <label for="bannertype" class="form-label">Тип банера</label>
                <select th:field="*{bannertype}" id="bannertype" class="form-select">
                    <option th:each="type : ${T(media.toloka.rfa.banner.model.enumerate.EBannerType).values()}"
                            th:value="${type}" th:text="${type}"></option>
                </select>
            </div>

            <!-- Стиль банера -->
            <div class="mb-3">
                <label for="bannerstyle" class="form-label">Стиль банера</label>
                <select th:field="*{bannerstyle}" id="bannerstyle" class="form-select">
                    <option th:each="style : ${T(media.toloka.rfa.banner.model.enumerate.EBannerStyle).values()}"
                            th:value="${style}"
                            th:text="${style != null ? style.label + ' ' + style.h + 'x' + style.v : '-'}"></option>
                </select>
            </div>

            <!-- Схвалення -->
            <div class="form-check mb-3">
                <input type="checkbox" th:field="*{approve}" id="approve" class="form-check-input">
                <label for="approve" class="form-check-label">Схвалено для публікації</label>
            </div>

            <!-- Кнопки -->
            <div class="d-flex justify-content-between">
                <button type="submit" class="btn btn-success">Зберегти</button>
                <a href="/banners" class="btn btn-secondary">Повернутися</a>
            </div>

        </form>
    </div>

    <hr>

    <!-- Приклади вигляду банера -->
    <div class="banner card shadow-sm rounded-4 text-center p-3 mb-3"
         style="width:100%; max-width:600px;">
        <div class="card-body d-flex flex-column justify-content-center">
            <h5 class="card-title fw-bold mb-2" th:text="${banner.title}">Назва банера</h5>
            <p class="card-text small mb-3" th:text="${banner.description}">Опис банера</p>
            <a th:href="${banner.link}" target="_blank" class="btn btn-success btn-sm mt-auto">
                Перейти
            </a>
        </div>
    </div>

    <hr>

    <div class="banner card shadow-sm rounded-4 text-center p-3 mb-3"
         th:style="'max-width:300px; min-height:250px;'">
        <div class="card-body d-flex flex-column justify-content-center">
            <h5 class="card-title fw-bold mb-2" th:text="${banner.title}">Назва банера</h5>
            <p class="card-text small mb-3" th:text="${banner.description}">
                Короткий текст банера, що підлаштовується під контейнер.
            </p>
            <a th:href="${banner.link}" target="_blank" rel="noopener"
               class="btn btn-primary btn-sm w-100 mt-auto">
                Дізнатись більше
            </a>
        </div>
    </div>
</div>

<script src="https://cdn.jsdelivr.net/npm/bootstrap@5.3.3/dist/js/bootstrap.bundle.min.js"></script>
<script src="https://cdnjs.cloudflare.com/ajax/libs/jquery/3.7.1/jquery.min.js"></script>
<script src="https://cdnjs.cloudflare.com/ajax/libs/dropzone/5.9.3/dropzone.min.js"></script>
<script src="https://cdnjs.cloudflare.com/ajax/libs/toastr.js/latest/toastr.min.js"></script>

<!--<script src="https://cdn.jsdelivr.net/npm/bootstrap@5.3.3/dist/js/bootstrap.bundle.min.js"></script>-->
<!--<script src="https://cdnjs.cloudflare.com/ajax/libs/dropzone/5.9.3/dropzone.min.js"></script>-->

<script>
    // =============================================
    // Bootstrap валідація форми
    // =============================================
    (() => {
        'use strict';
        const forms = document.querySelectorAll('.needs-validation');
        Array.from(forms).forEach(form => {
            form.addEventListener('submit', event => {
                if (!form.checkValidity()) {
                    event.preventDefault();
                    event.stopPropagation();
                }
                form.classList.add('was-validated');
            }, false);
        });
    })();

    // =============================================
    // Bootstrap Toast замість toastr (без jQuery)
    // =============================================
    function showToast(message, type) {
        const container = document.getElementById('toastContainer');
        const toastId = 'toast-' + Date.now();

        let bgClass = 'bg-success';
        if (type === 'error') bgClass = 'bg-danger';
        else if (type === 'warning') bgClass = 'bg-warning';

        const toastHtml = `
            <div id="${toastId}" class="toast align-items-center text-white ${bgClass} border-0" role="alert">
                <div class="d-flex">
                    <div class="toast-body">${message}</div>
                    <button type="button" class="btn-close btn-close-white me-2 m-auto"
                            data-bs-dismiss="toast"></button>
                </div>
            </div>`;

        container.insertAdjacentHTML('beforeend', toastHtml);

        const toastEl = document.getElementById(toastId);
        const toast = new bootstrap.Toast(toastEl, { delay: 4000 });
        toast.show();

        toastEl.addEventListener('hidden.bs.toast', () => toastEl.remove());
    }

    // =============================================
    // Динамічне формування HTML-елемента прев'ю
    // =============================================
    function renderMediaPreview(url, bannerType, mimeType) {
        const preview = document.getElementById('media-preview');
        if (!preview) return;

        let html = '';

        switch (bannerType) {
            case 'IMAGE':
                html = '<img src="' + url + '" alt="Зображення банера" class="img-fluid rounded">';
                break;
            case 'AUDIO':
                html = '<audio controls>' +
                    '<source src="' + url + '" type="' + (mimeType || 'audio/mpeg') + '">' +
                    'Ваш браузер не підтримує аудіо-елемент.' +
                    '</audio>';
                break;
            case 'VIDEO':
                html = '<video controls>' +
                    '<source src="' + url + '" type="' + (mimeType || 'video/mp4') + '">' +
                    'Ваш браузер не підтримує відео-елемент.' +
                    '</video>';
                break;
            default:
                html = '<span class="text-muted">Невідомий формат файлу</span>';
        }

        preview.innerHTML = html;

        // Показуємо кнопку "Видалити медіа" після завантаження
        const clearBtn = document.getElementById('clear-media-container');
        if (clearBtn) clearBtn.style.display = 'block';
    }

    // =============================================
    // Dropzone: завантаження медіа для банера
    // =============================================
    Dropzone.autoDiscover = false;

    const bannerDropzone = new Dropzone("#demo-upload", {
        maxFiles: 1,
        acceptedFiles: "image/*,audio/*,video/*",
        paramName: "file",
        headers: {
            'X-CSRF-TOKEN': document.querySelector('input[name="_csrf"]').value
        },

        // Визначаємо тип файлу перед відправкою на сервер
        sending: function (file, xhr, formData) {
            let storeType = "STORE_BANNERIMAGE";
            let bannerType = "IMAGE";

            if (file.type.startsWith('audio/')) {
                storeType = "STORE_BANNERAUDIO";
                bannerType = "AUDIO";
            } else if (file.type.startsWith('video/')) {
                storeType = "STORE_BANNERVIDEO";
                bannerType = "VIDEO";
            }

            formData.append("type", storeType);
            file._bannerType = bannerType;
        },

        init: function () {
            this.on("success", function (file, response) {
                if (response.success && response.uuid) {
                    showToast('Файл «' + file.name + '» успішно завантажено', 'success');

                    // Заповнюємо приховані поля форми банера
                    document.getElementById('uuidmedia').value = response.uuid;
                    document.getElementById('bannertype').value = file._bannerType;

                    // Динамічно рендеримо прев'ю відповідно до типу файлу
                    renderMediaPreview(response.url, file._bannerType, file.type);

                } else {
                    showToast('Помилка завантаження: ' + (response.error || 'невідома'), 'error');
                }
            });

            this.on("error", function (file, msg) {
                showToast('Помилка завантаження файлу: ' + msg, 'error');
            });

            this.on("maxfilesexceeded", function (file) {
                showToast('Можна завантажити лише один файл. Спочатку видаліть попередній.', 'warning');
                this.removeFile(file);
            });
        }
    });
</script>

</body>
</html>
