<!DOCTYPE html>
<html xmlns="http://www.w3.org/1999/xhtml"
      xmlns:th="https://www.thymeleaf.org"
      xmlns:sec="http://www.thymeleaf.org/thymeleaf-extras-springsecurity6"
>
<head>
    <meta charset="utf-8"/>
    <meta name="viewport" content="width=device-width, initial-scale=1">
    <title>Толока - радіо для всіх!</title>
    <!-- Favicon-->
    <link rel="icon" type="image/x-icon" href="/assets/favicon.ico"/>
    <!-- Font Awesome icons (free version)-->
    <script src="https://use.fontawesome.com/releases/v6.3.0/js/all.js" crossorigin="anonymous"></script>
    <!-- Google fonts-->
    <link href="https://fonts.googleapis.com/css?family=Montserrat:400,700" rel="stylesheet" type="text/css"/>
    <link href="https://fonts.googleapis.com/css?family=Roboto+Slab:400,100,300,700" rel="stylesheet" type="text/css"/>
    <!-- Core theme CSS (includes Bootstrap)-->
    <link href="/css/bootstrap.min.css" rel="stylesheet"/>

</head>
<body>
<script type="module" src="/js/audioplayer/rfapodcastplayer.js"></script>
<div th:insert="~{/fragments/RFAPlayer :: rfaplayertemplate}"/>
<header>
    <div th:insert="~{/fragments/navbar :: navbarUniverse}"></div>
</header>
<div class="pt-minimal">
    <!--<div class="pt-minimal">-->
    <div class="container-fluid">
        <div class="row text-center pt-navbar-xs">
            <div class="col align-center">
                <div th:insert="~{/fragments/messagebox :: mymessagebox}"></div>
            </div>
        </div>
        <!--        <div class="row">-->
        <!--            <audio-player id="TrackPlayer" th:data-src="'/store/audio/'+ ${curtrack.storeitem.uuid}"></audio-player>-->
        <!--        </div>-->
        <div class="row pt-zero">
            <!-- Колонка -->
            <div class="col-lg-6 col-sm-12">
                <audio-player id="TrackPlayer" th:data-src="'/store/audio/'+ ${curtrack.storeitem.uuid}"></audio-player>
                <h1 th:text="${curtrack.name}" class="pt-subsection"></h1>
                <h2><span>Автор:</span><span th:text="${curtrack.autor}"/></h2>
                <h5 th:if="${curtrack.style != null} "><span th:if=" ${#strings.length(curtrack.style) > 0}">Стиль:<span
                        th:text="' '+${curtrack.style}"/></span></h5>
                <!--                <hr>-->
                <!--                <div th:utext="${curtrack.description}"></div>-->

            </div>
            <div class="col-lg-6 col-sm-12">
                <!-- Медіа Хаб-->
                <!--                <div th:insert="~{/fragments/mediahub :: usermediahub}">  </div>-->
            </div>
        </div>
        <hr>
        <div class="row pt-zero">
            <div class="col-lg-12 col-sm-12" th:utext="${curtrack.description}"></div>
        </div>
        <!--Завантажити -->
        <div class="row text-center pt-subsection">
            <div class="col ">
                <hr>
                <a class="mx-auto"
                   th:href="'/store/content/'+${curtrack.storeitem.uuid}"
                   th:download="${curtrack.storeitem.filename}">
                    <span class="badge rounded-pill bg-primary">Завантажити трек</span>
                </a>
            </div>
        </div>
        <div class="row pt-subsection">
            <h3>Коментарі</h3>
            <div th:replace="~{/fragments/comments_section_rest :: commentsSection (
                        commentsPage=${commentsPage},
                        currentPage=${currentPage},
                        totalPages=${totalPages},
                        currentUserId=${currentUserId},
                        contentAuthorId=${contentAuthorId},
                        contentEntityType=${contentEntityType},
                        contentEntityId=${contentEntityId})}">
            </div>
        </div>
    </div>
</div>

<!--Футер -->
<div th:insert="~{/fragments/common :: footer}"></div>

<script src="/js/bootstrap.bundle.min.js"></script>

<!-- TinyMCE 7 (self-hosted) -->
<script src="/js/tinymce/tinymce.min.js"></script>
<script src="/js/wysiwyg-init.js"></script>
</body>
</html>
