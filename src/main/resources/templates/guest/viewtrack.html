<!DOCTYPE html>
<html xmlns="http://www.w3.org/1999/xhtml"
      xmlns:th="https://www.thymeleaf.org"
      xmlns:sec="http://www.thymeleaf.org/thymeleaf-extras-springsecurity6">
<head>
    <meta charset="utf-8"/>
    <meta name="viewport" content="width=device-width, initial-scale=1">
    <div th:replace="~{/fragments/common :: ogtrack(track=${curtrack})}"/>
    <title th:text="${curtrack.name} + ' - ' + ${curtrack.autor} + ' | Толока'"></title>

    <link rel="icon" type="image/x-icon" href="/assets/favicon.ico"/>
    <script src="https://use.fontawesome.com/releases/v6.3.0/js/all.js" crossorigin="anonymous"></script>

    <link href="https://fonts.googleapis.com/css2?family=Inter:wght@400;600;800&family=Lora:ital,wght@0,400;0,700;1,400&display=swap" rel="stylesheet">
    <link href="/css/bootstrap.min.css" rel="stylesheet"/>

    <!-- Editor.js Core and Tools (для відображення в режимі readOnly) -->
    <script src="https://cdn.jsdelivr.net/npm/@editorjs/editorjs@latest"></script>
    <script src="https://cdn.jsdelivr.net/npm/@editorjs/header@latest"></script>
    <script src="https://cdn.jsdelivr.net/npm/@editorjs/paragraph@latest"></script>
    <script src="https://cdn.jsdelivr.net/npm/@editorjs/list@latest"></script>
    <script src="https://cdn.jsdelivr.net/npm/@editorjs/quote@latest"></script>
    <script src="https://cdn.jsdelivr.net/npm/@editorjs/delimiter@latest"></script>

    <style>
        body {
            font-family: 'Inter', sans-serif;
            background-color: #fff;
            color: #1e293b;
        }

        /* Стилі для контенту Editor.js */
        #track-editor {
            font-family: 'Lora', serif;
            font-size: 1.2rem;
            line-height: 1.8;
            color: #334155;
            padding: 2rem 0;
        }
        #track-editor .ce-block__content,
        #track-editor .ce-toolbar__content {
            max-width: 800px;
        }
        #track-editor .ce-header {
            font-family: 'Inter', sans-serif;
            font-weight: 700;
            color: #007db5;
            margin-top: 2rem;
            margin-bottom: 1rem;
        }
        #track-editor .cdx-block {
            padding: 0.6rem 0;
        }
        #track-editor .cdx-quote {
            border-left: 5px solid #007db5;
            padding: 1rem 0 1rem 1.5rem;
            font-style: italic;
            background: #f0f9ff;
            border-radius: 0 8px 8px 0;
            margin: 1.5rem 0;
        }
        #track-editor .cdx-quote__text {
            font-size: 1.25rem;
            line-height: 1.6;
        }
        #track-editor .cdx-list {
            padding-left: 1.5rem;
        }
        #track-editor .cdx-list__item {
            margin-bottom: 0.5rem;
        }
        #track-editor .ce-delimiter {
            margin: 2.5rem 0;
        }

        /* Заголовок треку */
        .track-title {
            font-family: 'Inter', sans-serif;
            font-weight: 800;
            font-size: 2.5rem;
            line-height: 1.2;
            color: #0f172a;
            margin-top: 1.5rem;
            margin-bottom: 0.75rem;
        }
        .track-author {
            font-size: 1.2rem;
            color: #475569;
            margin-bottom: 0.5rem;
        }
        .track-style {
            display: inline-block;
            background: #e0f2fe;
            color: #007db5;
            padding: 6px 16px;
            border-radius: 50px;
            font-size: 0.9rem;
            font-weight: 600;
            margin-top: 0.5rem;
        }

        /* Кастомний плеєр */
        audio-player {
            display: block;
            width: 100%;
            margin-bottom: 1rem;
        }
    </style>
</head>
<body>
<script type="module" src="/js/audioplayer/rfapodcastplayer.js"></script>
<div th:insert="~{/fragments/RFAPlayer :: rfaplayertemplate}"/>

<header>
    <div th:insert="~{/fragments/navbar :: navbarUniverse}"></div>
</header>

<div style="padding-top: 1px">
    <div class="container-fluid">
        <!-- Повідомлення -->
        <div class="row text-center" style="padding-top: 60px">
            <div class="col align-center">
                <div th:insert="~{/fragments/messagebox :: mymessagebox}"></div>
            </div>
        </div>

        <!-- Основний блок -->
        <div class="row" style="padding-top: 0px">
            <div class="col-lg-6 col-sm-12">
                <audio-player th:if="${curtrack.storeitem != null}"
                              id="TrackPlayer"
                              th:data-src="'/store/audio/'+ ${curtrack.storeitem.uuid}">
                </audio-player>
                <div th:if="${curtrack.storeitem == null}" class="alert alert-warning">
                    <i class="fas fa-exclamation-triangle me-2"></i>Файл треку не знайдено.
                </div>

                <h1 class="track-title" th:text="${curtrack.name}">Назва треку</h1>
                <div class="track-author">
                    <i class="fas fa-user-circle me-2 text-primary"></i>
                    <span th:text="${curtrack.autor}">Автор</span>
                </div>
                <div th:if="${curtrack.style != null and #strings.length(curtrack.style) > 0}">
                    <span class="track-style">
                        <i class="fas fa-music me-1"></i>
                        <span th:text="${curtrack.style}">Стиль</span>
                    </span>
                </div>
            </div>

            <div class="col-lg-6 col-sm-12">
                <!-- Медіа Хаб (закоментовано) -->
                <!-- <div th:insert="~{/fragments/mediahub :: usermediahub}"></div> -->
            </div>
        </div>

        <hr class="my-4">

        <!-- Блок опису треку (тепер через Editor.js readOnly) -->
        <div class="row">
            <div class="col-lg-12 col-sm-12">
                <div id="track-editor"></div>
                <div id="track-editor-fallback" class="text-muted" style="display:none;">
                    Опис недоступний.
                </div>
            </div>
        </div>

        <!-- Кнопка завантаження -->
        <div class="row text-center" style="padding-top: 20px" th:if="${curtrack.storeitem != null}">
            <div class="col">
                <hr>
                <a class="mx-auto"
                   th:href="'/store/content/'+${curtrack.storeitem.uuid}"
                   th:download="${curtrack.storeitem.filename}">
                    <span class="badge rounded-pill bg-primary" style="font-size: 1rem; padding: 10px 20px;">
                        <i class="fas fa-download me-2"></i>Завантажити трек
                    </span>
                </a>
            </div>
        </div>

        <!-- Коментарі -->
        <div class="row" style="padding-top: 40px">
            <h3 class="mb-4"><i class="fas fa-comments me-2 text-primary"></i>Коментарі</h3>
            <div th:replace="~{/fragments/comments_section_rest :: commentsSection (
                        commentsPage=${commentsPage},
                        currentPage=${currentPage},
                        totalPages=${totalPages},
                        currentUserId=${currentUserId},
                        contentAuthorId=${contentAuthorId},
                        contentEntityType=${contentEntityType},
                        contentEntityId=${contentEntityId})}">
            </div>
        </div>
    </div>
</div>

<!-- Приховане поле з даними опису -->
<input type="hidden" id="trackDescriptionData" th:value="${curtrack.description}">

<!-- Футер -->
<div th:insert="~{/fragments/common :: footer}"></div>

<script src="/js/jquery.min.js"></script>
<script src="/js/bootstrap.bundle.min.js"></script>

<script th:inline="javascript">
    const rawData = document.getElementById('trackDescriptionData').value;

    /**
     * Конвертує старий HTML-опис у формат Editor.js blocks
     */
    function htmlToEditorBlocks(html) {
        const blocks = [];
        const tempDiv = document.createElement('div');
        // Базова санітизація
        const cleaned = html.replace(/<script\b[^<]*(?:(?!<\/script>)<[^<]*)*<\/script>/gi, '')
            .replace(/<iframe\b[^>]*>.*?<\/iframe>/gi, '')
            .replace(/on\w+="[^"]*"/gi, '');
        tempDiv.innerHTML = cleaned;

        Array.from(tempDiv.childNodes).forEach(node => {
            if (node.nodeType === Node.TEXT_NODE) {
                const text = node.textContent.trim();
                if (text) blocks.push({ type: 'paragraph', data: { text } });
                return;
            }
            if (node.nodeType !== Node.ELEMENT_NODE) return;

            const tag = node.tagName.toLowerCase();
            const content = node.innerHTML || node.textContent || '';

            switch (tag) {
                case 'h1':
                    blocks.push({ type: 'header', data: { text: content, level: 1 } });
                    break;
                case 'h2':
                    blocks.push({ type: 'header', data: { text: content, level: 2 } });
                    break;
                case 'h3':
                    blocks.push({ type: 'header', data: { text: content, level: 3 } });
                    break;
                case 'h4': case 'h5': case 'h6':
                    blocks.push({ type: 'header', data: { text: content, level: 4 } });
                    break;
                case 'p': case 'div': case 'span':
                    if (content.trim()) blocks.push({ type: 'paragraph', data: { text: content } });
                    break;
                case 'ul':
                    blocks.push({
                        type: 'list',
                        data: {
                            style: 'unordered',
                            items: Array.from(node.querySelectorAll('li')).map(li => li.innerHTML)
                        }
                    });
                    break;
                case 'ol':
                    blocks.push({
                        type: 'list',
                        data: {
                            style: 'ordered',
                            items: Array.from(node.querySelectorAll('li')).map(li => li.innerHTML)
                        }
                    });
                    break;
                case 'blockquote':
                    blocks.push({
                        type: 'quote',
                        data: { text: content, caption: '', alignment: 'left' }
                    });
                    break;
                case 'hr':
                    blocks.push({ type: 'delimiter', data: {} });
                    break;
                default:
                    if (content.trim()) blocks.push({ type: 'paragraph', data: { text: content } });
            }
        });

        return { blocks: blocks.length > 0 ? blocks : [] };
    }

    /**
     * Визначає формат рядка (JSON або HTML) і повертає структуру для Editor.js
     */
    function parseDescription(raw) {
        if (!raw || raw.trim() === '') {
            return { blocks: [] };
        }
        const trimmed = raw.trim();
        // Якщо схоже на JSON
        if (trimmed.startsWith('{') || trimmed.startsWith('[')) {
            try {
                const parsed = JSON.parse(trimmed);
                if (parsed.blocks) return parsed;
            } catch (e) {
                // Невалідний JSON — fallback нижче
            }
        }
        // Інакше конвертуємо HTML у блоки
        return htmlToEditorBlocks(trimmed);
    }

    /**
     * Ініціалізація Editor.js у режимі лише читання
     */
    try {
        const parsedData = parseDescription(rawData);

        if (parsedData.blocks && parsedData.blocks.length > 0) {
            const editor = new EditorJS({
                holder: 'track-editor',
                readOnly: true,
                tools: {
                    header: {
                        class: Header,
                        config: { levels: [2, 3, 4], defaultLevel: 2 }
                    },
                    paragraph: {
                        class: Paragraph,
                        inlineToolbar: false
                    },
//                    list: {
//                        class: List,
//                        inlineToolbar: false
//                    },
                    quote: {
                        class: Quote,
                        inlineToolbar: false
                    },
                    delimiter: {
                        class: Delimiter
                    }
                },
                data: parsedData,
                logLevel: 'ERROR'
            });
        } else {
            // Порожній опис
            document.getElementById('track-editor').innerHTML =
                '<p class="text-muted fst-italic">Опис для цього треку поки не додано.</p>';
        }
    } catch (e) {
        console.error('Помилка ініціалізації Editor.js:', e);
        // Fallback: якщо JS не спрацював, виводимо сирий текст
        document.getElementById('track-editor').style.display = 'none';
        document.getElementById('track-editor-fallback').style.display = 'block';
        document.getElementById('track-editor-fallback').innerHTML =
            '<p class="text-muted">Не вдалося завантажити опис треку.</p>';
    }
</script>
</body>
</html>
