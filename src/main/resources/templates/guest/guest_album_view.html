<!DOCTYPE html>
<html lang="uk" xmlns:th="http://www.thymeleaf.org">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title th:text="${album.name} + ' - RFA'">Альбом - RFA</title>

    <!-- Bootstrap 5.3 -->
    <link href="https://cdn.jsdelivr.net/npm/bootstrap@5.3.2/dist/css/bootstrap.min.css" rel="stylesheet">
    <link rel="stylesheet" href="https://cdn.jsdelivr.net/npm/bootstrap-icons@1.11.1/font/bootstrap-icons.css">

    <!-- Наші модульні стилі -->
    <link rel="stylesheet" th:href="@{/css/rfa-player.css}">
    <link rel="stylesheet" th:href="@{/css/rfa-editorjs.css}">

    <!-- Додаткові стилі для цієї сторінки -->
    <style>
        .album-cover-wrapper {
            position: relative;
            border-radius: 12px;
            overflow: hidden;
            box-shadow: 0 8px 24px rgba(0, 0, 0, 0.12);
        }
        .album-cover {
            width: 100%;
            height: auto;
            display: block;
        }
        .album-cover-placeholder {
            width: 100%;
            aspect-ratio: 1;
            display: flex;
            align-items: center;
            justify-content: center;
            background: linear-gradient(135deg, #2563eb 0%, #1e3a8a 100%);
            color: white;
            font-size: 5rem;
        }
        .album-meta-item {
            display: flex;
            align-items: center;
            gap: 0.5rem;
            margin-bottom: 0.75rem;
        }
        .album-meta-item i {
            color: #2563eb;
            font-size: 1.2rem;
        }
    </style>
</head>
<body class="bg-light">

<!-- ============================================ -->
<!-- 1. МОДУЛЬНИЙ ПЛЕЄР -->
<!-- ============================================ -->
<div th:replace="~{/fragments/audio-player :: player(${trackList})}"></div>

<div class="container py-5">
    <a href="/albums" class="btn btn-outline-secondary mb-4">
        <i class="bi bi-arrow-left me-2"></i>Назад до списку альбомів
    </a>

    <div class="card shadow border-0">
        <div class="card-body p-4 p-md-5">
            <div class="row">
                <!-- Ліва колонка: Обкладинка -->
                <div class="col-md-4 text-center mb-4 mb-md-0">
                    <div class="album-cover-wrapper">
                        <img th:if="${coverStore != null}"
                             th:src="@{/store/content/{uuid}(uuid=${coverStore.uuid})}"
                             class="album-cover"
                             alt="Обкладинка альбому">
                        <div th:unless="${coverStore != null}" class="album-cover-placeholder">
                            <i class="bi bi-music-note-beamed"></i>
                        </div>
                    </div>
                </div>

                <!-- Права колонка: Інформація -->
                <div class="col-md-8">
                    <h1 class="display-6 fw-bold mb-3" th:text="${album.name}">Назва альбому</h1>
                    <h4 class="text-primary mb-4" th:text="${album.autor}">Виконавець</h4>

                    <div class="mb-4">
                        <div class="album-meta-item">
                            <i class="bi bi-tag-fill"></i>
                            <span><strong>Стиль:</strong> <span th:text="${album.style ?: 'Не вказано'}">Стиль</span></span>
                        </div>
                        <div class="album-meta-item">
                            <i class="bi bi-calendar3"></i>
                            <span><strong>Дата релізу:</strong> <span th:text="${#dates.format(album.datealbumrelise, 'dd MMMM yyyy')}">Дата</span></span>
                        </div>
                        <div class="album-meta-item">
                            <i class="bi bi-music-note-list"></i>
                            <span><strong>Кількість треків:</strong> <span th:text="${trackList != null ? trackList.size() : 0}">0</span></span>
                        </div>
                    </div>

                    <!-- ============================================ -->
                    <!-- 2. МОДУЛЬНИЙ EDITOR.JS (Опис альбому) -->
                    <!-- ============================================ -->
                    <div class="mb-4" th:if="${album.description != null and !#strings.isEmpty(album.description) and album.description.trim() != '{}'}">
                        <h5 class="fw-bold mb-3">Опис:</h5>
                        <div th:replace="~{/fragments/editorjs-view :: editorjs('album-' + ${album.uuid}, ${album.description})}"></div>
                    </div>
                    <div class="mb-4" th:if="${album.description == null or #strings.isEmpty(album.description) or album.description.trim() == '{}'}">
                        <h5 class="fw-bold mb-3">Опис:</h5>
                        <p class="text-muted fst-italic">Опис відсутній.</p>
                    </div>
                </div>
            </div>

            <hr class="my-5">

            <!-- ============================================ -->
            <!-- 3. СПИСОК ТРЕКІВ -->
            <!-- ============================================ -->
            <h3 class="mb-4 fw-bold">
                <i class="bi bi-music-note-list me-2"></i>Список треків
            </h3>

            <div th:if="${trackList == null or trackList.empty}" class="alert alert-info">
                <i class="bi bi-info-circle me-2"></i>У цьому альбомі поки що немає треків.
            </div>

            <div class="list-group list-group-flush" th:if="${trackList != null and !trackList.empty}">
                <div th:each="track, iterStat : ${trackList}"
                     class="rfa-track-item list-group-item py-3"
                     th:data-audio-src="@{/store/audio/{uuid}(uuid=${track.storeuuid})}"
                     th:data-track-name="${track.name}"
                     th:data-track-autor="${track.autor}">
                    <div class="d-flex flex-column flex-md-row justify-content-between align-items-md-center gap-3">
                        <div class="flex-grow-1 d-flex align-items-center">
                            <span class="badge bg-secondary me-3" style="min-width: 40px;" th:text="${iterStat.count}">1</span>
                            <div>
                                <h6 class="mb-1 rfa-track-name fw-bold" th:text="${track.name}">Назва треку</h6>
                                <small class="text-muted" th:text="${track.autor}">Автор треку</small>
                            </div>
                        </div>

                        <div class="text-primary d-none">
                            <i class="bi bi-soundwave fs-4"></i>
                        </div>
                    </div>
                </div>
            </div>

        </div>
    </div>
</div>

<!-- ============================================ -->
<!-- СКРИПТИ -->
<!-- ============================================ -->

<!-- Bootstrap JS -->
<script src="https://cdn.jsdelivr.net/npm/bootstrap@5.3.2/dist/js/bootstrap.bundle.min.js"></script>

<!-- ============================================ -->
<!-- 4. ПІДКЛЮЧЕННЯ CDN-СКРИПТІВ EDITOR.JS ЧЕРЕЗ ФРАГМЕНТ -->
<!-- ============================================ -->
<th:block th:replace="~{/fragments/editorjs-scripts :: editorjs-scripts}"></th:block>

<!-- Наші модульні скрипти -->
<script th:src="@{/js/rfa-player.js}"></script>
<script th:src="@{/js/rfa-editorjs.js}"></script>

</body>
</html>
