<!DOCTYPE html>
<html xmlns="http://www.w3.org/1999/xhtml"
      xmlns:th="https://www.thymeleaf.org"
      xmlns:sec="http://www.thymeleaf.org/thymeleaf-extras-springsecurity6"
>
<head>
    <meta charset="utf-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1">
    <title>Толока - радіо для всіх!</title>
    <!-- Favicon-->
    <link rel="icon" type="image/x-icon" href="/assets/favicon.ico" />
    <!-- Font Awesome icons (free version)-->
    <script src="https://use.fontawesome.com/releases/v6.3.0/js/all.js" crossorigin="anonymous"></script>
    <!-- Google fonts-->
    <link href="https://fonts.googleapis.com/css?family=Montserrat:400,700" rel="stylesheet" type="text/css" />
    <link href="https://fonts.googleapis.com/css?family=Roboto+Slab:400,100,300,700" rel="stylesheet" type="text/css" />
    <!-- Core theme CSS (includes Bootstrap)-->
    <link href="/css/bootstrap.min.css"  rel="stylesheet" />
    <link href="/css/styles.css" rel="stylesheet" />
</head>
<body>

<!-- Navigation-->
<div th:insert="~{/fragments/navbar :: navbarUniverse}"></div>
<div th:insert="~{/fragments/mediahub :: audiotemplate}"/>

<!-- Main Content-->
<div class="main-content">
    <div class="container-fluid">
        <div class="row text-center">
            <div class="col align-center">
                <div th:insert="~{/fragments/messagebox :: mymessagebox}"></div>
            </div>
        </div>

        <div class="row">
            <!-- Останні завантажені треки -->
            <div th:insert="~{/fragments/mediahub :: lasttrecksall}"></div>
            <!-- Медіа Хаб -->
            <div th:insert="~{/fragments/mediahub :: usermediahub}"></div>
        </div>
    </div>
</div>

<script type="module" src="/js/audioplayer/audioplayer.js"></script>
<script>
    function onClickTrack(event, name, autor) {
        document.getElementById('audio-player').myChangeTrack(event.id, name, autor);
    }
</script>

<script src="/js/bootstrap.bundle.min.js"></script>
</body>
</html>
