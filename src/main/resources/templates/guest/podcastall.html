<!DOCTYPE html>
<html xmlns="http://www.w3.org/1999/xhtml"
      xmlns:th="https://www.thymeleaf.org"
      xmlns:sec="http://www.thymeleaf.org/thymeleaf-extras-springsecurity6"
>
<head>
    <meta charset="utf-8"/>
    <meta name="viewport" content="width=device-width, initial-scale=1">
    <title>Толока - Всі подкасти</title>
    <link rel="icon" type="image/x-icon" href="/assets/favicon.ico"/>
    <!-- Font Awesome icons (free version)-->
    <script src="https://use.fontawesome.com/releases/v6.3.0/js/all.js" crossorigin="anonymous"></script>
    <!-- Google fonts-->
    <link href="https://fonts.googleapis.com/css?family=Montserrat:400,700" rel="stylesheet" type="text/css"/>
    <link href="https://fonts.googleapis.com/css?family=Roboto+Slab:400,100,300,700" rel="stylesheet" type="text/css"/>
    <!-- Core theme CSS (includes Bootstrap)-->
    <link href="/css/bootstrap.min.css" rel="stylesheet"/>
    <style>
        .podcast-card { 
            transition: all 0.3s cubic-bezier(.25,.8,.25,1); 
            border: none; 
            border-radius: 15px;
            overflow: hidden;
            height: 100%; 
        }
        .podcast-card:hover { 
            transform: translateY(-10px); 
            box-shadow: 0 14px 28px rgba(0,0,0,0.1), 0 10px 10px rgba(0,0,0,0.08) !important; 
        }
        .podcast-cover { 
            width: 100%;
            height: auto;
            object-fit: contain; 
            max-height: 300px;
            background-color: #f8f9fa;
        }
        .card-title a { text-decoration: none; color: #212529; }
        .card-title a:hover { color: #0d6efd; }
        .btn-play-podcast {
            background: linear-gradient(to right, #007db5, #ff8a00);
            border: none;
            color: white;
            transition: opacity 0.2s;
        }
        .btn-play-podcast:hover {
            opacity: 0.9;
            color: white;
        }
    </style>
</head>
<body class="bg-light">
    <header>
        <div th:insert="~{/fragments/navbar :: navbarUniverse}"></div>
    </header>

    <div class="container py-5" style="padding-top: 120px !important;">
        <div class="row mb-5">
            <div class="col-lg-8 mx-auto text-center">
                <h1 class="display-4 fw-bold mb-3">Подкасти на Толоці</h1>
                <div class="mx-auto bg-primary mb-4" style="height: 4px; width: 60px; border-radius: 2px;"></div>
                <p class="lead text-muted">Слухайте цікаві історії, новини та музичні обзори від наших авторів у зручний для вас час.</p>
            </div>
        </div>
        <!-- Пагінація (компактна та безпечна) -->
        <div class="mt-5 pt-4 border-top" th:if="${totalPages > 1}">
            <nav aria-label="Podcast navigation">
                <ul class="pagination pagination-sm justify-content-center">
                    <li class="page-item" th:classappend="${currentPage == 0} ? 'disabled'">
                        <a class="page-link shadow-none" th:href="'/podcast/all/0'" title="Початок"><i class="fas fa-angle-double-left"></i></a>
                    </li>
                    <li class="page-item" th:classappend="${currentPage < 10} ? 'disabled'">
                        <a class="page-link shadow-none" th:href="'/podcast/all/' + ${currentPage - 10 < 0 ? 0 : currentPage - 10}">-10</a>
                    </li>
                    <li class="page-item" th:classappend="${currentPage == 0} ? 'disabled'">
                        <a class="page-link shadow-none" th:href="'/podcast/all/' + ${currentPage - 1 < 0 ? 0 : currentPage - 1}"><i class="fas fa-chevron-left"></i></a>
                    </li>

                    <th:block th:with="start=${currentPage - 2 < 0 ? 0 : currentPage - 2}, end=${currentPage + 2 > totalPages - 1 ? totalPages - 1 : currentPage + 2}">
                        <li class="page-item" th:each="lpage : ${#numbers.sequence(start, end)}" th:classappend="${lpage == currentPage} ? 'active'">
                            <a class="page-link shadow-none" th:href="'/podcast/all/'+${lpage}" th:text="${lpage+1}">1</a>
                        </li>
                    </th:block>

                    <li class="page-item" th:classappend="${currentPage >= totalPages - 1} ? 'disabled'">
                        <a class="page-link shadow-none" th:href="'/podcast/all/' + ${currentPage + 1 >= totalPages ? totalPages - 1 : currentPage + 1}"><i class="fas fa-chevron-right"></i></a>
                    </li>
                    <li class="page-item" th:classappend="${currentPage > totalPages - 11} ? 'disabled'">
                        <a class="page-link shadow-none" th:href="'/podcast/all/' + ${currentPage + 10 > totalPages - 1 ? totalPages - 1 : currentPage + 10}">+10</a>
                    </li>
                    <li class="page-item" th:classappend="${currentPage >= totalPages - 1} ? 'disabled'">
                        <a class="page-link shadow-none" th:href="'/podcast/all/' + ${totalPages - 1}" title="Кінець"><i class="fas fa-angle-double-right"></i></a>
                    </li>
                </ul>
            </nav>
        </div>
        <div class="row row-cols-1 row-cols-md-2 row-cols-lg-3 row-cols-xl-4 g-4">
            <div th:each="podcast : ${podcastList}" class="col">
                <div class="card podcast-card shadow-sm">
                    <!-- Обкладинка -->
                    <a th:href="'/podcast/view/'+${podcast.uuid}">
                        <img th:if="${podcast.imagechanelstore != null}" 
                             th:src="'/store/content/' + ${podcast.imagechanelstore.uuid}"
                             class="podcast-cover" style="aspect-ratio: 1/1; object-fit: cover;" alt="Podcast Cover">
                        <div th:if="${podcast.imagechanelstore == null}" 
                             class="podcast-cover bg-dark d-flex align-items-center justify-content-center text-white-50" style="aspect-ratio: 1/1;">
                            <i class="fas fa-microphone-alt fa-4x opacity-25"></i>
                        </div>
                    </a>
                    
                    <div class="card-body d-flex flex-column">
                        <h5 class="card-title fw-bold mb-2">
                            <a th:href="'/podcast/view/'+${podcast.uuid}" th:text="${podcast.title}">Назва подкасту</a>
                        </h5>
                        <div class="card-text text-muted small mb-4 flex-grow-1">
                            <div th:if="${podcast.lead}" th:text="${podcast.lead}">Лід</div>
                            <div th:if="${(podcast.lead == null || podcast.lead.isEmpty()) && podcast.description}" th:utext="${#strings.length(podcast.description) > 120 ? #strings.substring(podcast.description, 0, 120) + '...' : podcast.description}"></div>
                        </div>
                        
                        <div class="mt-auto pt-3 border-top d-flex justify-content-between align-items-center">
                            <span class="badge bg-light text-dark rounded-pill fw-normal px-3 py-2 border">
                                <i class="fas fa-list-ul text-primary me-2"></i><span th:text="${podcast.item.size()}">0</span> еп.
                            </span>
                            <a th:href="'/podcast/view/'+${podcast.uuid}" class="btn btn-sm btn-play-podcast rounded-pill px-4 py-2 fw-bold shadow-sm">
                                <i class="fas fa-play me-2"></i>Слухати
                            </a>
                        </div>
                    </div>
                </div>
            </div>
        </div>

        <!-- Пагінація (компактна та безпечна) -->
        <div class="mt-5 pt-4 border-top" th:if="${totalPages > 1}">
            <nav aria-label="Podcast navigation">
                <ul class="pagination pagination-sm justify-content-center">
                    <li class="page-item" th:classappend="${currentPage == 0} ? 'disabled'">
                        <a class="page-link shadow-none" th:href="'/podcast/all/0'" title="Початок"><i class="fas fa-angle-double-left"></i></a>
                    </li>
                    <li class="page-item" th:classappend="${currentPage < 10} ? 'disabled'">
                        <a class="page-link shadow-none" th:href="'/podcast/all/' + ${currentPage - 10 < 0 ? 0 : currentPage - 10}">-10</a>
                    </li>
                    <li class="page-item" th:classappend="${currentPage == 0} ? 'disabled'">
                        <a class="page-link shadow-none" th:href="'/podcast/all/' + ${currentPage - 1 < 0 ? 0 : currentPage - 1}"><i class="fas fa-chevron-left"></i></a>
                    </li>
                    
                    <th:block th:with="start=${currentPage - 2 < 0 ? 0 : currentPage - 2}, end=${currentPage + 2 > totalPages - 1 ? totalPages - 1 : currentPage + 2}">
                        <li class="page-item" th:each="lpage : ${#numbers.sequence(start, end)}" th:classappend="${lpage == currentPage} ? 'active'">
                            <a class="page-link shadow-none" th:href="'/podcast/all/'+${lpage}" th:text="${lpage+1}">1</a>
                        </li>
                    </th:block>

                    <li class="page-item" th:classappend="${currentPage >= totalPages - 1} ? 'disabled'">
                        <a class="page-link shadow-none" th:href="'/podcast/all/' + ${currentPage + 1 >= totalPages ? totalPages - 1 : currentPage + 1}"><i class="fas fa-chevron-right"></i></a>
                    </li>
                    <li class="page-item" th:classappend="${currentPage > totalPages - 11} ? 'disabled'">
                        <a class="page-link shadow-none" th:href="'/podcast/all/' + ${currentPage + 10 > totalPages - 1 ? totalPages - 1 : currentPage + 10}">+10</a>
                    </li>
                    <li class="page-item" th:classappend="${currentPage >= totalPages - 1} ? 'disabled'">
                        <a class="page-link shadow-none" th:href="'/podcast/all/' + ${totalPages - 1}" title="Кінець"><i class="fas fa-angle-double-right"></i></a>
                    </li>
                </ul>
            </nav>
        </div>
    </div>

    <!-- Футер -->
    <div th:insert="~{/fragments/common :: footer}"></div>
    
    <script src="/js/bootstrap.bundle.min.js"></script>
</body>
</html>
