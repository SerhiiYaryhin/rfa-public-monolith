<!DOCTYPE html>
<html xmlns="http://www.w3.org/1999/xhtml"
      xmlns:th="https://www.thymeleaf.org"
      xmlns:sec="http://www.thymeleaf.org/thymeleaf-extras-springsecurity6"
>
<head>
    <meta charset="utf-8"/>
    <meta name="viewport" content="width=device-width, initial-scale=1">
    <title>Толока - Всі подкасти</title>
    <link rel="icon" type="image/x-icon" href="/assets/favicon.ico"/>
    <script src="https://use.fontawesome.com/releases/v6.3.0/js/all.js" crossorigin="anonymous"></script>
    <link href="/css/bootstrap.min.css" rel="stylesheet"/>
    <style>
        .podcast-card { transition: transform 0.2s; border: none; shadow: 0 0.125rem 0.25rem rgba(0, 0, 0, 0.075); height: 100%; }
        .podcast-card:hover { transform: translateY(-5px); box-shadow: 0 0.5rem 1rem rgba(0, 0, 0, 0.15) !important; }
        .podcast-cover { height: 220px; object-fit: cover; }
        .card-title a { text-decoration: none; color: #212529; }
        .card-title a:hover { color: #0d6efd; }
    </style>
</head>
<body class="bg-light">
    <header>
        <div th:insert="~{/fragments/navbar :: navbarUniverse}"></div>
    </header>

    <div class="container py-5" style="padding-top: 120px !important;">
        <div class="row mb-5 text-center">
            <div class="col-lg-8 mx-auto">
                <h1 class="display-4 fw-bold">Подкасти на Толоці</h1>
                <p class="lead text-muted">Слухайте цікаві історії, новини та музичні обзори від наших авторів.</p>
            </div>
        </div>

        <div class="row row-cols-1 row-cols-md-2 row-cols-lg-3 row-cols-xl-4 g-4">
            <div th:each="podcast : ${podcastList}" class="col">
                <div class="card podcast-card shadow-sm">
                    <a th:href="'/podcast/view/'+${podcast.uuid}">
                        <img th:if="${podcast.imagechanelstore != null}" 
                             th:src="'/store/content/' + ${podcast.imagechanelstore.uuid}"
                             class="card-img-top podcast-cover" alt="Podcast Cover">
                        <div th:if="${podcast.imagechanelstore == null}" 
                             class="card-img-top podcast-cover bg-secondary d-flex align-items-center justify-content-center text-white-50">
                            <i class="fas fa-microphone-alt fa-4x"></i>
                        </div>
                    </a>
                    <div class="card-body">
                        <h5 class="card-title fw-bold text-truncate">
                            <a th:href="'/podcast/view/'+${podcast.uuid}" th:text="${podcast.title}">Назва</a>
                        </h5>
                        <p class="card-text text-muted small" th:if="${podcast.description}" 
                           th:text="${#strings.length(podcast.description) > 100 ? #strings.substring(podcast.description, 0, 100) + '...' : podcast.description}">
                        </p>
                    </div>
                    <div class="card-footer bg-white border-top-0 d-flex justify-content-between align-items-center pb-3">
                        <small class="text-muted">
                            <i class="fas fa-list-ul me-1"></i> <span th:text="${podcast.item.size()}">0</span> еп.
                        </small>
                        <a th:href="'/podcast/view/'+${podcast.uuid}" class="btn btn-sm btn-primary rounded-pill px-3 shadow-sm">Слухати</a>
                    </div>
                </div>
            </div>
        </div>

        <!-- Пагінація -->
        <nav aria-label="Pagination" class="mt-5" th:if="${totalPages > 1}">
            <ul class="pagination justify-content-center shadow-sm">
                <li class="page-item" th:classappend="${currentPage == 0} ? 'disabled'">
                    <a class="page-link" th:href="@{'/podcast/all/' + ${currentPage - 1}}"><i class="fas fa-chevron-left"></i></a>
                </li>
                <li class="page-item" th:each="i : ${#numbers.sequence(0, totalPages - 1)}" th:classappend="${i == currentPage} ? 'active'">
                    <a class="page-link" th:href="@{'/podcast/all/' + ${i}}" th:text="${i + 1}">1</a>
                </li>
                <li class="page-item" th:classappend="${currentPage == totalPages - 1} ? 'disabled'">
                    <a class="page-link" th:href="@{'/podcast/all/' + ${currentPage + 1}}"><i class="fas fa-chevron-right"></i></a>
                </li>
            </ul>
        </nav>
    </div>

    <div th:insert="~{/fragments/common :: footer}"></div>
    <script src="/js/bootstrap.bundle.min.js"></script>
</body>
</html>
