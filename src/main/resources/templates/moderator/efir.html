<!DOCTYPE html>
<html xmlns="http://www.w3.org/1999/xhtml"
      xmlns:th="https://www.thymeleaf.org">
<head>
    <meta charset="utf-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1" />
    <title>Command Center - <th:block th:text="${station.name}">Радіостанція</th:block></title>

    <link rel="icon" type="image/x-icon" href="/favicon.ico" />
    <link href="/css/bootstrap.min.css" rel="stylesheet" />
    <link href="https://fonts.googleapis.com/css2?family=Inter:wght@400;500;600;700&display=swap" rel="stylesheet">
    <link rel="stylesheet" href="https://cdnjs.cloudflare.com/ajax/libs/animate.css/4.1.1/animate.min.css"/>
    <script src="https://use.fontawesome.com/releases/v6.3.0/js/all.js" crossorigin="anonymous"></script>

    <script src="/js/sockjs.min.js"></script>
    <script src="/js/stomp.js"></script>
    <script type="module" src="https://cdn.jsdelivr.net/npm/emoji-picker-element@latest/index.js"></script>

    <style>
        :root {
            --primary: #6c5ce7;
            --success: #00b894;
            --warning: #fdcb6e;
            --danger: #d63031;
            --dark: #2d3436;
            --light: #f0f2f5;
            --sidebar-width: 280px;
        }

        * { box-sizing: border-box; }

        body {
            font-family: 'Inter', sans-serif;
            background: linear-gradient(135deg, #667eea 0%, #764ba2 100%);
            margin: 0;
            padding: 0;
            height: 100vh;
            overflow: hidden;
        }

        .command-center {
            display: flex;
            flex-direction: column;
            height: 100vh;
            padding: 15px;
            gap: 15px;
        }

        .cc-header {
            background: white; border-radius: 12px; padding: 15px 25px;
            box-shadow: 0 4px 15px rgba(0,0,0,0.1); display: flex;
            justify-content: space-between; align-items: center; flex-shrink: 0;
        }
        .cc-header-left h1 { margin: 0; font-size: 1.5rem; color: var(--dark); display: flex; align-items: center; gap: 10px; }
        .cc-header-info { color: #636e72; font-size: 0.85rem; margin-top: 5px; }
        .live-indicator { display: flex; align-items: center; gap: 8px; padding: 8px 16px; background: #ffebee; border-radius: 20px; font-weight: 600; color: var(--danger); }
        .live-indicator.active { animation: pulse 2s infinite; }
        .live-dot { width: 10px; height: 10px; background: var(--danger); border-radius: 50%; }
        @keyframes pulse { 0%, 100% { opacity: 1; } 50% { opacity: 0.6; } }

        .cc-control-bar {
            background: white; border-radius: 12px; padding: 15px 25px;
            box-shadow: 0 4px 15px rgba(0,0,0,0.1); display: flex; gap: 10px; flex-shrink: 0; flex-wrap: wrap;
        }
        .btn-control {
            padding: 12px 24px; border: none; border-radius: 8px; font-weight: 600;
            cursor: pointer; transition: all 0.3s; display: flex; align-items: center;
            gap: 8px; flex: 1; min-width: 150px; justify-content: center; color: white;
        }
        .btn-primary { background: var(--primary); } .btn-primary:hover { background: #5b4cc4; transform: translateY(-2px); }
        .btn-success { background: var(--success); } .btn-success:hover { background: #00a383; transform: translateY(-2px); }
        .btn-warning { background: var(--warning); color: var(--dark); } .btn-warning:hover { background: #f39c12; transform: translateY(-2px); }
        .btn-danger { background: var(--danger); } .btn-danger:hover { background: #c0392b; transform: translateY(-2px); }
        .btn-control:disabled { background: #b2bec3; cursor: not-allowed; transform: none; }

        .cc-main {
            display: grid;
            grid-template-columns: var(--sidebar-width) 1fr 1fr;
            gap: 15px;
            flex: 1;
            min-height: 0;
            overflow: hidden;
        }

        .cc-rooms {
            background: white; border-radius: 12px; padding: 20px;
            box-shadow: 0 4px 15px rgba(0,0,0,0.1); overflow-y: auto;
            display: flex;
            flex-direction: column;
        }
        .cc-section-title { font-size: 0.9rem; font-weight: 600; color: #636e72; margin-bottom: 15px; text-transform: uppercase; letter-spacing: 0.5px; }
        .room-item {
            padding: 12px 15px; border-radius: 8px; margin-bottom: 10px; cursor: pointer;
            transition: all 0.3s; border-left: 4px solid transparent; display: flex; align-items: center; justify-content: space-between;
        }
        .room-item:hover { background: #f8f9fa; transform: translateX(5px); }
        .room-item.active { background: #f0f2f5; border-left-color: var(--primary); }
        .room-item-main { border-left-color: var(--primary); }
        .room-item-green { border-left-color: var(--warning); }
        .room-item-broadcast { border-left-color: var(--danger); }
        .room-item-staff { border-left-color: #636e72; }
        .room-name { font-weight: 600; font-size: 0.9rem; color: var(--dark); }
        .room-count { background: var(--light); padding: 2px 8px; border-radius: 12px; font-size: 0.75rem; font-weight: 600; }

        .waiting-section {
            margin-top: 20px;
            padding-top: 20px;
            border-top: 2px solid #f0f2f5;
            flex-grow: 1;
            display: flex;
            flex-direction: column;
        }

        .waiting-item {
            display: flex;
            align-items: center;
            padding: 10px 12px;
            background: #fff8dc;
            border-radius: 8px;
            margin-bottom: 8px;
            border-left: 3px solid var(--warning);
            animation: slideIn 0.3s ease;
        }

        @keyframes slideIn {
            from { opacity: 0; transform: translateX(-10px); }
            to { opacity: 1; transform: translateX(0); }
        }

        .waiting-item:hover {
            background: #fff3cd;
        }

        .waiting-name {
            flex-grow: 1;
            font-size: 0.9rem;
            font-weight: 500;
            color: var(--dark);
            white-space: nowrap;
            overflow: hidden;
            text-overflow: ellipsis;
        }

        .waiting-actions {
            display: flex;
            gap: 5px;
        }

        .btn-waiting {
            width: 28px;
            height: 28px;
            border-radius: 50%;
            border: none;
            cursor: pointer;
            display: flex;
            align-items: center;
            justify-content: center;
            font-size: 0.75rem;
            transition: all 0.2s;
        }

        .btn-accept {
            background: var(--success);
            color: white;
        }

        .btn-accept:hover {
            background: #00a383;
            transform: scale(1.1);
        }

        .btn-decline {
            background: #e74c3c;
            color: white;
        }

        .btn-decline:hover {
            background: #c0392b;
            transform: scale(1.1);
        }

        .cc-participants {
            background: white; border-radius: 12px; padding: 20px;
            box-shadow: 0 4px 15px rgba(0,0,0,0.1); overflow-y: auto; display: flex; flex-direction: column;
        }
        .participant-list { flex: 1; overflow-y: auto; }

        .efir-participant-item {
            display: flex;
            align-items: center;
            padding: 10px 15px;
            border-radius: 8px;
            margin-bottom: 6px;
            transition: all 0.2s ease;
            cursor: pointer;
            background-color: transparent;
        }

        .efir-participant-item:hover {
            background-color: #f8f9fa;
        }

        .efir-participant-talking {
            background-color: rgba(0, 184, 148, 0.15);
            border-left: 3px solid var(--success);
        }

        .efir-participant-talking .efir-participant-name {
            font-weight: 700;
            color: var(--success);
        }

        .efir-participant-name {
            font-size: 0.95rem;
            color: var(--dark);
            white-space: nowrap;
            overflow: hidden;
            text-overflow: ellipsis;
            flex-grow: 1;
        }

        .participant-actions {
            display: flex;
            gap: 5px;
            margin-left: 10px;
        }

        .btn-participant {
            width: 32px;
            height: 32px;
            border-radius: 50%;
            border: none;
            cursor: pointer;
            display: flex;
            align-items: center;
            justify-content: center;
            font-size: 0.8rem;
            transition: all 0.2s;
        }

        .btn-invite-green {
            background: var(--warning);
            color: var(--dark);
        }

        .btn-invite-green:hover {
            background: #f39c12;
            transform: scale(1.1);
        }

        .btn-invite-broadcast {
            background: var(--danger);
            color: white;
        }

        .btn-invite-broadcast:hover {
            background: #c0392b;
            transform: scale(1.1);
        }

        .cc-chat {
            background: white; border-radius: 12px; box-shadow: 0 4px 15px rgba(0,0,0,0.1);
            display: flex; flex-direction: column; overflow: hidden;
        }
        .chat-header { padding: 15px 20px; border-bottom: 2px solid #f0f2f5; font-weight: 600; color: var(--dark); display: flex; justify-content: space-between; align-items: center; }
        .chat-messages { flex: 1; overflow-y: auto; padding: 20px; background: #fafbfc; display: flex; flex-direction: column; gap: 15px; }

        .bubble { max-width: 85%; padding: 12px 18px; border-radius: 20px; font-size: 0.95rem; line-height: 1.4; position: relative; animation: fadeInUp 0.3s ease; }
        .bubble-other { align-self: flex-start; background: #fff; border: 1px solid #e2e8f0; color: #2d3436; border-bottom-left-radius: 4px; }
        .bubble-me { align-self: flex-end; background: var(--primary); color: #fff; border-bottom-right-radius: 4px; box-shadow: 0 4px 15px rgba(108, 92, 231, 0.2); }
        .bubble-meta { font-size: 0.7rem; margin-top: 5px; opacity: 0.7; display: flex; align-items: center; gap: 5px; }
        .bubble-me .bubble-meta { justify-content: flex-end; color: #fff; }
        @keyframes fadeInUp { from { opacity: 0; transform: translateY(10px); } to { opacity: 1; transform: translateY(0); } }

        .chat-input-area { padding: 15px; border-top: 2px solid #f0f2f5; display: flex; align-items: center; gap: 12px; background: #fff; }
        .input-group-custom { flex-grow: 1; position: relative; }
        .chat-input { border-radius: 30px; border: 2px solid #f1f5f9; padding: 12px 20px; padding-right: 50px; transition: 0.3s; font-size: 0.95rem; width: 100%; }
        .chat-input:focus { border-color: var(--primary); outline: none; box-shadow: 0 0 0 4px rgba(108, 92, 231, 0.1); }
        .btn-emoji { position: absolute; right: 15px; top: 50%; transform: translateY(-50%); background: none; border: none; font-size: 1.3rem; opacity: 0.5; transition: 0.3s; cursor: pointer; }
        .btn-emoji:hover { opacity: 1; transform: translateY(-50%) scale(1.1); }
        .btn-send { width: 45px; height: 45px; border-radius: 50%; background: var(--primary); color: #fff; border: none; display: flex; align-items: center; justify-content: center; transition: 0.3s; cursor: pointer; }
        .btn-send:hover { transform: scale(1.05) rotate(-10deg); background: #5b4cc4; }

        emoji-picker { position: absolute; bottom: 85px; right: 25px; z-index: 1000; box-shadow: 0 10px 30px rgba(0,0,0,0.1); border-radius: 15px; display: none; }
        emoji-picker.visible { display: block; }

        .context-menu { position: absolute; background: white; border-radius: 8px; box-shadow: 0 4px 20px rgba(0,0,0,0.15); padding: 8px 0; min-width: 200px; z-index: 1000; display: none; }
        .context-menu-item { padding: 10px 15px; cursor: pointer; transition: all 0.2s; display: flex; align-items: center; gap: 10px; font-size: 0.9rem; }
        .context-menu-item:hover { background: #f0f2f5; }
        .context-menu-item.danger { color: var(--danger); }

        ::-webkit-scrollbar { width: 6px; }
        ::-webkit-scrollbar-track { background: transparent; }
        ::-webkit-scrollbar-thumb { background: #cbd5e1; border-radius: 10px; }
    </style>
</head>
<body>

<div class="command-center">
    <div class="cc-header">
        <div class="cc-header-left">
            <h1><i class="fas fa-broadcast-tower"></i> <th:block th:text="${station.name}">Радіостанція</th:block></h1>
            <div class="cc-header-info">
                <strong>UUID:</strong> <th:block th:text="${stationUuid}">uuid</th:block> |
                <strong>Модератор:</strong> <th:block th:text="${curusername}">Ім'я</th:block>
            </div>
        </div>
        <div class="live-indicator" id="liveIndicator">
            <div class="live-dot"></div>
            <span id="liveStatus">OFFLINE</span>
            <span id="efirTimer" style="margin-left: 10px; font-family: monospace;">00:00:00</span>
        </div>
    </div>

    <div class="cc-control-bar">
        <button class="btn-control btn-primary" id="btnPrepare" onclick="prepareEfir()"><i class="fas fa-cog"></i> Підготувати ефір</button>
        <button class="btn-control btn-success" id="btnStart" onclick="startEfir()" disabled><i class="fas fa-play"></i> Запустити ефір</button>
        <button class="btn-control btn-warning" id="btnPause" onclick="pauseEfir()" disabled><i class="fas fa-pause"></i> Пауза</button>
        <button class="btn-control btn-danger" id="btnStop" onclick="stopEfir()" disabled><i class="fas fa-stop"></i> Зупинити</button>
    </div>

    <div class="cc-main">
        <div class="cc-rooms">
            <div class="cc-section-title"><i class="fas fa-door-open"></i> Кімнати</div>
            <div class="room-item room-item-main active" data-room-type="main" th:data-room-uuid="${mainRoom != null ? mainRoom.uuid : ''}" th:data-room-name="${mainRoom != null ? mainRoom.roomname : 'Основна'}">
                <div class="room-name"><i class="fas fa-comments"></i> Основна</div>
                <div class="room-count" id="countMain">0</div>
            </div>
            <div class="room-item room-item-green" th:if="${greenRoom != null}" data-room-type="green" th:data-room-uuid="${greenRoom.uuid}" th:data-room-name="${greenRoom.roomname}">
                <div class="room-name"><i class="fas fa-door-open"></i> Green Room</div>
                <div class="room-count" id="countGreen">0</div>
            </div>
            <div class="room-item room-item-broadcast" th:if="${broadcastRoom != null}" data-room-type="broadcast" th:data-room-uuid="${broadcastRoom.uuid}" th:data-room-name="${broadcastRoom.roomname}">
                <div class="room-name"><i class="fas fa-broadcast-tower"></i> Ефір</div>
                <div class="room-count" id="countBroadcast">0</div>
            </div>
            <div class="room-item room-item-staff" th:if="${staffRoom != null}" data-room-type="staff" th:data-room-uuid="${staffRoom.uuid}" th:data-room-name="${staffRoom.roomname}">
                <div class="room-name"><i class="fas fa-users-cog"></i> Staff</div>
                <div class="room-count" id="countStaff">0</div>
            </div>

            <div class="waiting-section" id="waitingSection" style="display: none;">
                <div class="cc-section-title">
                    <i class="fas fa-hand-paper"></i> Очікують
                    <span class="badge rounded-pill bg-warning text-dark" id="waitingCount">0</span>
                </div>
                <div id="waitingList"></div>
            </div>
        </div>

        <div class="cc-participants">
            <div class="cc-section-title"><i class="fas fa-users"></i> Учасники чату</div>
            <div class="participant-list" id="efirParticipantList">
                <div style="text-align: center; color: #636e72; padding: 20px;"><i class="fas fa-spinner fa-spin"></i> Завантаження...</div>
            </div>
        </div>

        <div class="cc-chat">
            <div class="chat-header">
                <span><i class="fas fa-comment-dots"></i> <span id="chatTitle">Публічний чат</span></span>
                <span class="text-success small" id="connectstatus"><i class="fas fa-circle me-1" style="font-size: 0.5rem;"></i> Онлайн</span>
            </div>
            <div class="chat-messages" id="mainMessagesArea">
                <div id="publicarea" class="d-flex flex-column gap-3"></div>
                <div id="privatearea" class="d-flex flex-column gap-3"></div>
            </div>
            <div class="chat-input-area">
                <div class="d-flex gap-2">
                    <button class="btn btn-light rounded-circle" onclick="document.getElementById('imageInput').click()" title="Завантажити зображення" style="width: 45px; height: 45px; display: flex; align-items: center; justify-content: center;">
                        <i class="fas fa-image text-muted"></i>
                    </button>
                    <input type="file" id="imageInput" hidden accept="image/*" onchange="uploadImage(this.files[0])">
                </div>
                <div class="input-group-custom">
                    <input type="text" id="newmessage" class="form-control chat-input" placeholder="Напишіть повідомлення..." autocomplete="off" onkeypress="if(event.key==='Enter') handleSend()">
                    <button class="btn-emoji" id="emojiToggle">😀</button>
                </div>
                <emoji-picker id="picker"></emoji-picker>
                <button class="btn-send" onclick="handleSend()"><i class="fas fa-paper-plane"></i></button>
            </div>
        </div>
    </div>
</div>

<div class="context-menu" id="contextMenu">
    <div class="context-menu-item" onclick="contextAction('mute')"><i class="fas fa-microphone-slash"></i> <span id="muteText">Mute</span></div>
    <div class="context-menu-item" onclick="contextAction('giveWord')"><i class="fas fa-hand-paper"></i> Дати слово</div>
    <div class="context-menu-item" onclick="contextAction('move')"><i class="fas fa-exchange-alt"></i> Перемістити</div>
    <div class="context-menu-item" onclick="contextAction('timer')"><i class="fas fa-clock"></i> Таймер</div>
    <div class="context-menu-item danger" onclick="contextAction('kick')"><i class="fas fa-ban"></i> Kick</div>
</div>

<!-- ✅ ОДИН блок скриптів з усіма змінними -->
<script th:inline="javascript">
    var curuuid = /*[[${curuuid}]]*/ '';
    var curusername = /*[[${curusername}]]*/ '';
    var curroom = /*[[${mainRoom != null ? mainRoom.uuid : null}]]*/;
    var stationUuid = /*[[${stationUuid}]]*/ '';
    var currentRoomType = 'main';
    var clientuuid = null;
    var subRoomParticipants = null;
    var subPresenceUpdate = null; // ✅ НОВА ПІДПИСКА

    const rooms = {
        main: /*[[${mainRoom != null ? mainRoom.uuid : null}]]*/,
        green: /*[[${greenRoom != null ? greenRoom.uuid : null}]]*/,
        broadcast: /*[[${broadcastRoom != null ? broadcastRoom.uuid : null}]]*/,
        staff: /*[[${staffRoom != null ? staffRoom.uuid : null}]]*/
    };

    document.addEventListener('DOMContentLoaded', () => {
        document.querySelectorAll('.room-item').forEach(item => {
            item.addEventListener('click', function() {
                const roomType = this.dataset.roomType;
                const roomUuid = this.dataset.roomUuid;
                const roomName = this.dataset.roomName;
                if (roomType && roomUuid) {
                    document.querySelectorAll('.room-item').forEach(el => el.classList.remove('active'));
                    this.classList.add('active');
                    document.getElementById('chatTitle').innerText = roomName || 'Чат';
                    currentRoomType = roomType;
                    if (typeof selectroom === 'function') {
                        selectroom(roomUuid, roomName);
                    }
                    setTimeout(loadModeratorParticipants, 500);
                }
            });
        });

        const picker = document.getElementById('picker');
        const input = document.getElementById('newmessage');
        const emojiToggle = document.getElementById('emojiToggle');
        if (emojiToggle) emojiToggle.onclick = (e) => { e.stopPropagation(); picker.classList.toggle('visible'); };
        if (picker) {
            picker.addEventListener('emoji-click', event => {
                input.value += event.detail.unicode;
                picker.classList.remove('visible');
                input.focus();
            });
        }
        document.addEventListener('click', () => { if (picker) picker.classList.remove('visible'); });

        // ✅ Налаштовуємо підписку на оновлення учасників
        setupModeratorPresenceSubscription();

        setTimeout(() => {
            loadModeratorParticipants();
            loadWaitingGuests();
        }, 1500);
    });

    /**
     * ✅ НОВА ФУНКЦІЯ: Підписка на топік сповіщень про зміни в складі учасників.
     * Коли будь-який користувач переходить між кімнатами в чаті,
     * ChatRoomPresenceService публікує подію в /topic/efir.room.presence,
     * і ця функція автоматично оновлює список у панелі модератора.
     */
    function setupModeratorPresenceSubscription() {
        const trySubscribe = () => {
            if (stompClient && stompClient.connected && !subPresenceUpdate) {
                subPresenceUpdate = stompClient.subscribe(
                    '/topic/efir.room.presence',
                    (payload) => {
                        console.log('🔔 Отримано сповіщення про зміну учасників');
                        // Невелика затримка, щоб сервер встиг оновити стан
                        setTimeout(loadModeratorParticipants, 200);
                    }
                );
                console.log('✅ Підписано на /topic/efir.room.presence');
                return true;
            }
            return false;
        };

        if (!trySubscribe()) {
            // Якщо STOMP ще не підключений, пробуємо кожні 500мс
            const interval = setInterval(() => {
                if (trySubscribe()) {
                    clearInterval(interval);
                }
            }, 500);

            // Зупиняємо спроби через 30 секунд
            setTimeout(() => clearInterval(interval), 30000);
        }

        // ✅ Fallback: періодичне опитування кожні 10 секунд (для надійності)
        setInterval(() => {
            if (stompClient && stompClient.connected) {
                loadModeratorParticipants();
            }
        }, 10000);
    }

    function loadModeratorParticipants() {
        const list = document.getElementById('efirParticipantList');
        if (!list) return;

        const activeRoomUuid = rooms[currentRoomType];
        if (!activeRoomUuid) {
            list.innerHTML = '<div style="text-align: center; color: #636e72; padding: 20px;">Кімната не вибрана</div>';
            return;
        }

        if (stompClient && stompClient.connected) {
            if (!subRoomParticipants) {
                subRoomParticipants = stompClient.subscribe(
                    '/topic/chat.room.participants.' + curuuid,
                    onRoomParticipantsReceived
                );
            }

            stompClient.send("/app/room/participants", {}, JSON.stringify({
                uuid: curuuid,
                roomuuid: activeRoomUuid,
                send: Date.now()
            }));
        }
    }

    function onRoomParticipantsReceived(payload) {
        const list = document.getElementById('efirParticipantList');
        if (!list) return;

        try {
            const data = JSON.parse(payload.body);
            const participants = JSON.parse(data.body);

            list.innerHTML = '';

            if (!participants || participants.length === 0) {
                list.innerHTML = '<div style="text-align: center; color: #636e72; padding: 20px; font-size: 0.9rem;">Немає учасників</div>';
                return;
            }

            const countEl = document.getElementById(`count${currentRoomType.charAt(0).toUpperCase() + currentRoomType.slice(1)}`);
            if (countEl) countEl.textContent = participants.length;

            participants.forEach(u => {
                const item = document.createElement('div');
                item.className = 'efir-participant-item';

                item.innerHTML = `
                    <div class="efir-participant-name" title="${u.name}">${u.name}</div>
                    <div class="participant-actions">
                        <button class="btn-participant btn-invite-green" onclick="inviteToGreenRoom('${u.uuid}', '${u.name.replace(/'/g, "\\'")}')" title="Запросити в Green Room">
                            <i class="fas fa-door-open"></i>
                        </button>
                        <button class="btn-participant btn-invite-broadcast" onclick="inviteToBroadcast('${u.uuid}', '${u.name.replace(/'/g, "\\'")}')" title="Запросити в Ефір">
                            <i class="fas fa-broadcast-tower"></i>
                        </button>
                    </div>
                `;
                list.appendChild(item);
            });
        } catch (e) {
            console.error('Error parsing room participants:', e);
            list.innerHTML = '<div style="text-align: center; color: var(--danger); padding: 20px;">Помилка завантаження</div>';
        }
    }

    function inviteToGreenRoom(userUuid, userName) {
        if (!rooms.green) {
            alert('Green Room ще не створено. Натисніть "Підготувати ефір".');
            return;
        }
        console.log(`📢 Запрошення ${userName} в Green Room (${userUuid})`);
        alert(`Запрошення ${userName} в Green Room (буде реалізовано на наступному етапі)`);
    }

    function inviteToBroadcast(userUuid, userName) {
        if (!rooms.broadcast) {
            alert('Ефір ще не створено. Натисніть "Підготувати ефір".');
            return;
        }
        console.log(`📢 Запрошення ${userName} в Ефір (${userUuid})`);
        alert(`Запрошення ${userName} в Ефір (буде реалізовано на наступному етапі)`);
    }

    function loadWaitingGuests() {
        const waitingList = document.getElementById('waitingList');
        const waitingSection = document.getElementById('waitingSection');
        if (!waitingList) return;
        waitingSection.style.display = 'none';
    }

    var selectedParticipant = null;
    function showContextMenu(participant, roomId) {
        selectedParticipant = { ...participant, roomId };
        const menu = document.getElementById('contextMenu');
        menu.style.display = 'block';
        menu.style.left = `${event.pageX}px`;
        menu.style.top = `${event.pageY}px`;
        document.getElementById('muteText').textContent = participant.muted ? 'Unmute' : 'Mute';
    }

    function contextAction(action) {
        if (!selectedParticipant) return;
        alert(`Дія "${action}" буде реалізована на наступному етапі`);
        document.getElementById('contextMenu').style.display = 'none';
    }
    document.addEventListener('click', () => { document.getElementById('contextMenu').style.display = 'none'; });

    function prepareEfir() {
        const btn = document.getElementById('btnPrepare');
        btn.disabled = true; btn.innerHTML = '<i class="fas fa-spinner fa-spin"></i> Підготовка...';
        fetch(`/api/v1/broadcast/prepare/${stationUuid}`, { method: 'POST' })
            .then(r => r.json()).then(data => {
            if (data.success) location.reload();
            else { alert('Помилка: ' + data.error); btn.disabled = false; btn.innerHTML = '<i class="fas fa-cog"></i> Підготувати ефір'; }
        });
    }
    function startEfir() { document.getElementById('liveIndicator').classList.add('active'); document.getElementById('liveStatus').textContent = 'LIVE'; }
    function pauseEfir() {}
    function stopEfir() { document.getElementById('liveIndicator').classList.remove('active'); document.getElementById('liveStatus').textContent = 'OFFLINE'; }
</script>

<script src="/js/chat.js"></script>

</body>
</html>
