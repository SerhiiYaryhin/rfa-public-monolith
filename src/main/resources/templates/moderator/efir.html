<!DOCTYPE html>
<html xmlns="http://www.w3.org/1999/xhtml"
      xmlns:th="https://www.thymeleaf.org">
<head>
    <meta charset="utf-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1" />
    <title>Command Center - <th:block th:text="${station.name}">Радіостанція</th:block></title>

    <link rel="icon" type="image/x-icon" href="/favicon.ico" />

    <!-- CSS -->
    <link href="/css/bootstrap.min.css" rel="stylesheet" />
    <link href="https://fonts.googleapis.com/css2?family=Inter:wght@400;500;600;700&display=swap" rel="stylesheet">
    <link rel="stylesheet" href="https://cdnjs.cloudflare.com/ajax/libs/animate.css/4.1.1/animate.min.css"/>
    <link rel="stylesheet" href="/css/webrtc/efir.css">

    <!-- FontAwesome -->
    <script src="https://use.fontawesome.com/releases/v6.3.0/js/all.js" crossorigin="anonymous"></script>

    <!-- SockJS & STOMP -->
    <script src="/js/sockjs.min.js"></script>
    <script src="/js/stomp.js"></script>

    <!-- ✅ Janus Gateway + WebRTC Adapter (CDN) -->
    <script src="https://cdn.jsdelivr.net/gh/meetecho/janus-gateway@v1.2.0/html/janus.js"></script>
    <script src="https://cdnjs.cloudflare.com/ajax/libs/webrtc-adapter/8.2.2/adapter.min.js"></script>

    <!-- Emoji Picker Element -->
    <script type="module" src="https://cdn.jsdelivr.net/npm/emoji-picker-element@latest/index.js"></script>
</head>
<body>

<div class="command-center">

    <!-- HEADER -->
    <div class="cc-header">
        <div class="cc-header-left">
            <h1><i class="fas fa-broadcast-tower"></i> <th:block th:text="${station.name}">Радіостанція</th:block></h1>
            <div class="cc-header-info">
                <strong>UUID:</strong> <th:block th:text="${stationUuid}">uuid</th:block> |
                <strong>Модератор:</strong> <th:block th:text="${curusername}">Ім'я</th:block>
            </div>
        </div>
        <div class="live-indicator" id="liveIndicator">
            <div class="live-dot"></div>
            <span id="liveStatus">OFFLINE</span>
            <span id="efirTimer" style="margin-left: 10px; font-family: monospace;">00:00:00</span>
        </div>
    </div>

    <!-- CONTROL BAR -->
    <div class="cc-control-bar">
        <button class="btn-control btn-primary" id="btnPrepare" onclick="prepareEfir()">
            <i class="fas fa-cog"></i> Підготувати ефір
        </button>
        <button class="btn-control btn-success" id="btnStart" onclick="startEfir()" disabled>
            <i class="fas fa-play"></i> Запустити ефір
        </button>
        <button class="btn-control btn-warning" id="btnPause" onclick="pauseEfir()" disabled>
            <i class="fas fa-pause"></i> Пауза
        </button>
        <button class="btn-control btn-danger" id="btnStop" onclick="stopEfir()" disabled>
            <i class="fas fa-stop"></i> Зупинити
        </button>
    </div>

    <!-- MAIN GRID -->
    <div class="cc-main">

        <!-- ROOMS SIDEBAR -->
        <div class="cc-rooms">
            <div class="cc-section-title"><i class="fas fa-door-open"></i> Кімнати</div>

            <!-- Основна кімната -->
            <div class="room-item room-item-main active" data-room-type="main"
                 th:data-room-uuid="${mainRoom != null ? mainRoom.uuid : ''}"
                 th:data-room-name="${mainRoom != null ? mainRoom.roomname : 'Основна'}">
                <div style="flex:1;">
                    <div class="room-name">
                        <i class="fas fa-comments"></i> Основна
                        <!-- ✅ Кнопка ЗАВЖИ видима (поза прихованою панеллю) -->
                        <button class="btn-listen btn-listen-start" id="btn-listen-main"
                                onclick="event.stopPropagation(); ModeratorAudio.startListening('main')">
                            <i class="fas fa-headphones"></i> Слухати
                        </button>
                    </div>
                    <!-- Панель з VU-метром, статусом і мікрофоном (прихована до підключення) -->
                    <div class="room-audio-panel" id="audioPanel-main" onclick="event.stopPropagation();">
                        <div class="audio-controls-row">
                            <button class="btn-mic btn-mic-off" id="btn-mic-main"
                                    onclick="ModeratorAudio.toggleMic('main')">
                                <i class="fas fa-microphone-slash"></i> Мікрофон OFF
                            </button>
                            <div class="vu-meter-track">
                                <div class="vu-meter-fill" id="vu-main"></div>
                            </div>
                        </div>
                        <div class="listen-status" id="status-main">Не підключено</div>
                    </div>
                </div>
                <div class="room-count" id="countMain">0</div>
            </div>

            <!-- Green Room -->
            <div class="room-item room-item-green" th:if="${greenRoom != null}" data-room-type="green"
                 th:data-room-uuid="${greenRoom.uuid}" th:data-room-name="${greenRoom.roomname}">
                <div style="flex:1;">
                    <div class="room-name">
                        <i class="fas fa-door-open"></i> Green Room
                        <button class="btn-listen btn-listen-start" id="btn-listen-green"
                                onclick="event.stopPropagation(); ModeratorAudio.startListening('green')">
                            <i class="fas fa-headphones"></i> Слухати
                        </button>
                    </div>
                    <div class="room-audio-panel" id="audioPanel-green" onclick="event.stopPropagation();">
                        <div class="audio-controls-row">
                            <button class="btn-mic btn-mic-off" id="btn-mic-green"
                                    onclick="ModeratorAudio.toggleMic('green')">
                                <i class="fas fa-microphone-slash"></i> Мікрофон OFF
                            </button>
                            <div class="vu-meter-track">
                                <div class="vu-meter-fill" id="vu-green"></div>
                            </div>
                        </div>
                        <div class="listen-status" id="status-green">Не підключено</div>
                    </div>
                </div>
                <div class="room-count" id="countGreen">0</div>
            </div>

            <!-- Broadcast -->
            <div class="room-item room-item-broadcast" th:if="${broadcastRoom != null}" data-room-type="broadcast"
                 th:data-room-uuid="${broadcastRoom.uuid}" th:data-room-name="${broadcastRoom.roomname}">
                <div style="flex:1;">
                    <div class="room-name">
                        <i class="fas fa-broadcast-tower"></i> Ефір
                        <button class="btn-listen btn-listen-start" id="btn-listen-broadcast"
                                onclick="event.stopPropagation(); ModeratorAudio.startListening('broadcast')">
                            <i class="fas fa-headphones"></i> Слухати
                        </button>
                    </div>
                    <div class="room-audio-panel" id="audioPanel-broadcast" onclick="event.stopPropagation();">
                        <div class="audio-controls-row">
                            <button class="btn-mic btn-mic-off" id="btn-mic-broadcast"
                                    onclick="ModeratorAudio.toggleMic('broadcast')">
                                <i class="fas fa-microphone-slash"></i> Мікрофон OFF
                            </button>
                            <div class="vu-meter-track">
                                <div class="vu-meter-fill" id="vu-broadcast"></div>
                            </div>
                        </div>
                        <div class="listen-status" id="status-broadcast">Не підключено</div>
                    </div>
                </div>
                <div class="room-count" id="countBroadcast">0</div>
            </div>

            <!-- Staff -->
            <div class="room-item room-item-staff" th:if="${staffRoom != null}" data-room-type="staff"
                 th:data-room-uuid="${staffRoom.uuid}" th:data-room-name="${staffRoom.roomname}">
                <div style="flex:1;">
                    <div class="room-name">
                        <i class="fas fa-users-cog"></i> Staff
                        <button class="btn-listen btn-listen-start" id="btn-listen-staff"
                                onclick="event.stopPropagation(); ModeratorAudio.startListening('staff')">
                            <i class="fas fa-headphones"></i> Слухати
                        </button>
                    </div>
                    <div class="room-audio-panel" id="audioPanel-staff" onclick="event.stopPropagation();">
                        <div class="audio-controls-row">
                            <button class="btn-mic btn-mic-off" id="btn-mic-staff"
                                    onclick="ModeratorAudio.toggleMic('staff')">
                                <i class="fas fa-microphone-slash"></i> Мікрофон OFF
                            </button>
                            <div class="vu-meter-track">
                                <div class="vu-meter-fill" id="vu-staff"></div>
                            </div>
                        </div>
                        <div class="listen-status" id="status-staff">Не підключено</div>
                    </div>
                </div>
                <div class="room-count" id="countStaff">0</div>
            </div>

            <!-- Черга очікування -->
            <div class="waiting-section" id="waitingSection" style="display: none;">
                <div class="cc-section-title">
                    <i class="fas fa-hand-paper"></i> Очікують
                    <span class="badge rounded-pill bg-warning text-dark" id="waitingCount" style="margin-left: auto;">0</span>
                </div>
                <div class="waiting-list" id="waitingList">
                    <div class="waiting-empty">Немає гостей</div>
                </div>
            </div>
        </div>

        <!-- PARTICIPANTS -->
        <div class="cc-participants">
            <div class="cc-section-title">
                <i class="fas fa-users"></i> Учасники
                <span class="badge rounded-pill bg-primary" id="activeRoomCount" style="margin-left: auto;">0</span>
            </div>
            <div class="participant-list" id="efirParticipantList">
                <div class="participant-grid" id="participantGrid">
                    <div class="participants-empty" style="grid-column: 1 / -1;">
                        <i class="fas fa-spinner fa-spin"></i> Завантаження...
                    </div>
                </div>
            </div>
        </div>

        <!-- CHAT -->
        <div class="cc-chat">
            <div class="chat-header">
                <span><i class="fas fa-comment-dots"></i> <span id="chatTitle">Публічний чат</span></span>
                <span class="text-success small" id="connectstatus">
                    <i class="fas fa-circle me-1" style="font-size: 0.5rem;"></i> Онлайн
                </span>
            </div>
            <div class="chat-messages" id="mainMessagesArea">
                <div id="publicarea" class="d-flex flex-column gap-3"></div>
                <div id="privatearea" class="d-flex flex-column gap-3"></div>
            </div>
            <div class="chat-input-area">
                <div class="d-flex gap-2">
                    <button class="btn btn-light rounded-circle"
                            onclick="document.getElementById('imageInput').click()"
                            title="Завантажити зображення"
                            style="width: 45px; height: 45px; display: flex; align-items: center; justify-content: center;">
                        <i class="fas fa-image text-muted"></i>
                    </button>
                    <input type="file" id="imageInput" hidden accept="image/*" onchange="uploadImage(this.files[0])">
                </div>
                <div class="input-group-custom">
                    <input type="text" id="newmessage" class="form-control chat-input"
                           placeholder="Напишіть повідомлення..." autocomplete="off"
                           onkeypress="if(event.key==='Enter') handleSend()">
                    <button class="btn-emoji" id="emojiToggle">😀</button>
                </div>
                <emoji-picker id="picker"></emoji-picker>
                <button class="btn-send" onclick="handleSend()">
                    <i class="fas fa-paper-plane"></i>
                </button>
            </div>
        </div>
    </div>
</div>

<!-- Context Menu -->
<div class="context-menu" id="contextMenu">
    <div class="context-menu-item" onclick="contextAction('mute')">
        <i class="fas fa-microphone-slash"></i> <span id="muteText">Mute</span>
    </div>
    <div class="context-menu-item" onclick="contextAction('giveWord')">
        <i class="fas fa-hand-paper"></i> Дати слово
    </div>
    <div class="context-menu-item" onclick="contextAction('move')">
        <i class="fas fa-exchange-alt"></i> Перемістити
    </div>
    <div class="context-menu-item" onclick="contextAction('timer')">
        <i class="fas fa-clock"></i> Таймер
    </div>
    <div class="context-menu-item danger" onclick="contextAction('kick')">
        <i class="fas fa-ban"></i> Kick
    </div>
</div>

<!-- ================================================================ -->
<!-- SCRIPTS                                                           -->
<!-- ================================================================ -->

<!-- ✅ WebRTC Modules v2 (порядок важливий!) -->
<script type="text/javascript" src="/js/webrtc/v2/config.js"></script>
<script type="text/javascript" src="/js/webrtc/v2/logger.js"></script>
<script type="text/javascript" src="/js/webrtc/v2/janus-connection.js"></script>
<script type="text/javascript" src="/js/webrtc/v2/websocket-signaling.js"></script>
<script type="text/javascript" src="/js/webrtc/v2/moderator.js"></script>
<script type="text/javascript" src="/js/webrtc/v2/room-manager.js"></script>
<script type="text/javascript" src="/js/webrtc/v2/stream-manager.js"></script>
<script type="text/javascript" src="/js/webrtc/v2/ui-renderer.js"></script>
<script type="text/javascript" src="/js/webrtc/v2/audio-monitor.js"></script>
<script type="text/javascript" src="/js/webrtc/v2/network-monitor.js"></script>
<!-- ⚠️ main.js НЕ підключаємо — модератор використовує ModeratorAudio -->

<!-- ✅ Thymeleaf змінні (передаються з сервера) -->
<script th:inline="javascript">
    /*<![CDATA[*/
    var curuuid = /*[[${curuuid}]]*/ '';
    var curusername = /*[[${curusername}]]*/ '';
    var curroom = /*[[${mainRoom != null ? mainRoom.uuid : null}]]*/;
    var stationUuid = /*[[${stationUuid}]]*/ '';
    var clientuuid = null;

    // UUID текстових кімнат (для STOMP-підписок та selectroom)
    const rooms = {
        main: /*[[${mainRoom != null ? mainRoom.uuid : null}]]*/,
        green: /*[[${greenRoom != null ? greenRoom.uuid : null}]]*/,
        broadcast: /*[[${broadcastRoom != null ? broadcastRoom.uuid : null}]]*/,
        staff: /*[[${staffRoom != null ? staffRoom.uuid : null}]]*/
    };

    // ✅ Числові ID кімнат Janus (для ModeratorAudio)
    const janusRoomIds = {
        main: /*[[${mainRoom != null ? mainRoom.id : null}]]*/,
        green: /*[[${greenRoom != null ? greenRoom.id : null}]]*/,
        broadcast: /*[[${broadcastRoom != null ? broadcastRoom.id : null}]]*/,
        staff: /*[[${staffRoom != null ? staffRoom.id : null}]]*/
    };
    /*]]>*/
</script>

<!-- ✅ Логіка панелі модератора (МІСТИТЬ ModeratorAudio) -->
<script type="text/javascript" src="/js/webrtc/efir.js?v=4"></script>

<!-- ✅ Текстовий чат (ПІСЛЯ efir.js) -->
<script type="text/javascript" src="/js/chat.js?v=4"></script>

</body>
</html>
