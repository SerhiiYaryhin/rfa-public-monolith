<!DOCTYPE html>
<html xmlns="http://www.w3.org/1999/xhtml"
      xmlns:th="https://www.thymeleaf.org"
      xmlns:sec="http://www.thymeleaf.org/thymeleaf-extras-springsecurity6"
>
<head>
    <meta charset="utf-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1">
    <title>Толока - Обкладинка епізоду</title>
    <link rel="icon" type="image/x-icon" href="/assets/favicon.ico" />
    <script src="https://use.fontawesome.com/releases/v6.3.0/js/all.js" crossorigin="anonymous"></script>
    <link href="/css/bootstrap.min.css"  rel="stylesheet" />
    <link th:rel="stylesheet" th:href="@{/css/dropzone.min.css}"/>
    <link th:rel="stylesheet" th:href="@{/css/toastr.min.css}"/>
</head>
<body class="bg-light">
<header>
    <div th:insert="~{/fragments/navbar :: navbarUniverse}">  </div>
</header>

<div class="container py-5" style="padding-top: 120px !important;">
    <div class="row justify-content-center">
        <div class="col-lg-10">
            <nav aria-label="breadcrumb">
                <ol class="breadcrumb">
                    <li class="breadcrumb-item"><a th:href="@{'/podcast/episodeedit/'+${podcast.uuid}+'/'+${episode.uuid}}">Редагування епізоду</a></li>
                    <li class="breadcrumb-item active">Завантаження обкладинки</li>
                </ol>
            </nav>

            <div class="card border-primary shadow-sm mt-4">
                <div class="card-header bg-primary text-white">
                    <h5 class="mb-0"><i class="fas fa-image me-2"></i>Крок 1: Завантажити нову обкладинку епізоду</h5>
                </div>
                <div class="card-body p-5">
                    <div id="dropzone">
                        <form action="/api/store/upload?type=STORE_PODCASTCOVER" class="dropzone needsclick" id="episode-cover-upload" method="post">
                            <input type="hidden" th:name="${_csrf.parameterName}" th:value="${_csrf.token}" />
                            <div class="dz-message needsclick">
                                <button type="button" class="dz-button">
                                    <i class="fas fa-cloud-upload-alt fa-4x mb-3 text-primary"></i><br>
                                    <span class="fs-5">Перетягніть ілюстрацію сюди або натисніть для вибору.</span><br>
                                    <small class="text-muted text-uppercase">Обкладинка буде автоматично призначена епізоду після завантаження</small>
                                </button>
                            </div>
                        </form>
                    </div>
                </div>
            </div>

            <div class="card border-dark shadow-sm mt-5">
                <div class="card-header bg-dark text-white">
                    <h5 class="mb-0"><i class="fas fa-images me-2"></i>Крок 2: Або обрати з наявних</h5>
                </div>
                <div class="card-body">
                    <div class="row row-cols-2 row-cols-md-4 row-cols-lg-5 g-4">
                        <div class="col" th:each="storeitem : ${storeList}">
                            <div class="card h-100 shadow-sm">
                                <img th:src="'/store/content/'+${storeitem.uuid}" class="card-img-top" alt="Preview" style="height: 120px; object-fit: cover;">
                                <div class="card-body p-2 text-center">
                                    <a class="btn btn-sm btn-primary w-100" th:href="@{'/podcast/coverepisodeset/'+${episode.uuid}+'/'+${storeitem.uuid} }">
                                        <i class="fas fa-check me-1"></i> Обрати
                                    </a>
                                </div>
                            </div>
                        </div>
                    </div>
                </div>
            </div>

            <div class="mt-4 text-center">
                <a th:href="@{'/podcast/episodeedit/'+${podcast.uuid}+'/'+${episode.uuid}}" class="btn btn-secondary px-5">
                    <i class="fas fa-arrow-left me-2"></i> Повернутися до епізоду
                </a>
            </div>
        </div>
    </div>
</div>

<div th:insert="~{/fragments/common :: footer}"></div>

<script th:src="@{/js/jquery.min.js}"></script>
<script src="/js/bootstrap.bundle.min.js"></script>
<script th:src="@{/js/dropzone.min.js}"></script>
<script th:src="@{/js/toastr.min.js}"></script>

<script th:inline="javascript">
    Dropzone.autoDiscover = false;
    const episodeUuid = [[${episode.uuid}]];

    $(document).ready(function() {
        $("#episode-cover-upload").dropzone({
            maxFiles: 1,
            acceptedFiles: "image/*",
            success : function(file, response) {
                if (response && response.success) {
                    toastr.success('Обкладинку завантажено! Встановлюємо...');
                    // Автоматично призначаємо завантажене зображення епізоду
                    window.location.href = '/podcast/coverepisodeset/' + episodeUuid + '/' + response.uuid;
                } else {
                    toastr.error('Помилка завантаження: ' + (response.error || response));
                    this.removeFile(file);
                }
            },
            error: function(file, message) {
                toastr.error('Помилка: ' + message);
                this.removeFile(file);
            }
        });
    });
</script>

</body>
</html>
