<!DOCTYPE html>
<html xmlns="http://www.w3.org/1999/xhtml"
      xmlns:th="https://www.thymeleaf.org"
      xmlns:sec="http://www.thymeleaf.org/thymeleaf-extras-springsecurity6"
>
<head>
    <meta charset="utf-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1">
    <title>Толока - Мої подкасти</title>
    <link rel="icon" type="image/x-icon" href="/assets/favicon.ico" />
    <script src="https://use.fontawesome.com/releases/v6.3.0/js/all.js" crossorigin="anonymous"></script>
    <link href="/css/bootstrap.min.css"  rel="stylesheet" />
    <style>
        .podcast-card { transition: transform 0.2s; border: none; shadow: 0 0.125rem 0.25rem rgba(0, 0, 0, 0.075); }
        .podcast-card:hover { transform: translateY(-5px); box-shadow: 0 0.5rem 1rem rgba(0, 0, 0, 0.15) !important; }
        .podcast-cover { height: 200px; object-fit: cover; border-radius: 8px 8px 0 0; }
        .status-badge { position: absolute; top: 10px; right: 10px; }
    </style>
</head>
<body class="bg-light">
    <header>
        <div th:insert="~{/fragments/navbar :: navbarUniverse}">  </div>
    </header>

    <div th:insert="~{/fragments/messagebox :: mymessagebox}">  </div>

    <div class="container py-5" style="padding-top: 120px !important;">
        <div class="row mb-4 align-items-center">
            <div class="col-md-6">
                <h1 class="display-6 fw-bold mb-0"><i class="fas fa-podcast text-primary me-2"></i>Ваші подкасти</h1>
                <p class="text-muted mt-2">Керуйте вашими аудіо-каналами та епізодами</p>
            </div>
            <div class="col-md-6 text-md-end">
                <div class="btn-group">
                    <a class="btn btn-primary" href="/podcast/pedit/0">
                        <i class="fas fa-plus-circle me-1"></i> Створити подкаст
                    </a>
                    <a class="btn btn-outline-primary" href="/podcast/getRSSFromUrl">
                        <i class="fas fa-file-import me-1"></i> Імпортувати з RSS
                    </a>
                </div>
            </div>
        </div>

        <div th:if="${warning}" class="alert alert-info shadow-sm border-0">
            <i class="fas fa-info-circle me-2"></i> <span th:text="${warning}"></span>
        </div>

        <div class="row row-cols-1 row-cols-md-2 row-cols-xl-3 g-4">
            <!-- початок циклу виводу подкастів -->
            <div th:each="podcast : ${podcastslist}" class="col">
                <div class="card h-100 shadow-sm podcast-card">
                    <!-- Обкладинка -->
                    <div class="position-relative">
                        <img th:if="${podcast.imagechanelstore != null}" 
                             th:src="'/store/content/' + ${podcast.imagechanelstore.uuid}"
                             class="card-img-top podcast-cover" alt="Podcast Cover">
                        <div th:if="${podcast.imagechanelstore == null}" 
                             class="card-img-top podcast-cover bg-secondary d-flex align-items-center justify-content-center">
                            <i class="fas fa-microphone-alt fa-4x text-white-50"></i>
                        </div>
                        
                        <!-- Бейдж статусу -->
                        <div class="status-badge">
                            <span th:if="${podcast.publishing}" class="badge bg-success shadow-sm">
                                <i class="fas fa-broadcast-tower me-1"></i> В ефірі
                            </span>
                            <span th:unless="${podcast.publishing}" class="badge bg-dark shadow-sm">
                                <i class="fas fa-pen-nib me-1"></i> Чернетка
                            </span>
                            <span th:if="${podcast.apruve != true}" class="badge bg-warning text-dark shadow-sm ms-1">
                                <i class="fas fa-clock me-1"></i> Модерація
                            </span>
                        </div>
                    </div>

                    <div class="card-body">
                        <h5 class="card-title fw-bold" th:text="${podcast.title}">Назва подкасту</h5>
                        <p class="card-text text-muted small" th:if="${podcast.description}" 
                           th:text="${#strings.length(podcast.description) > 120 ? #strings.substring(podcast.description, 0, 120) + '...' : podcast.description}">
                           Опис подкасту
                        </p>
                    </div>

                    <div class="card-footer bg-transparent border-top-0 pb-3">
                        <div class="row align-items-center">
                            <div class="col-6">
                                <small class="text-muted">
                                    <i class="fas fa-layer-group me-1"></i> <span th:text="${podcast.item.size()}">0</span> еп.
                                </small>
                            </div>
                            <div class="col-6 text-end">
                                <div class="btn-group">
                                    <a class="btn btn-sm btn-outline-primary" th:href="'/podcast/pedit/'+${podcast.uuid}" title="Редагувати">
                                        <i class="fas fa-edit"></i>
                                    </a>
                                    <a class="btn btn-sm btn-outline-danger" th:href="'/podcast/localpodcastdel/'+${podcast.uuid}" 
                                       onclick="return confirm('Видалити цей подкаст та всі його епізоди?')" title="Видалити">
                                        <i class="fas fa-trash"></i>
                                    </a>
                                </div>
                            </div>
                        </div>
                    </div>
                </div>
            </div>
            <!-- кінець циклу -->
        </div>

        <!-- Пагінація -->
        <nav aria-label="Podcast Pagination" class="mt-5" th:if="${totalPages > 1}">
            <ul class="pagination justify-content-center shadow-sm">
                <li class="page-item" th:classappend="${currentPage == 0} ? 'disabled'">
                    <a class="page-link" th:href="@{'/podcast/home/' + ${currentPage - 1}}"><i class="fas fa-chevron-left"></i></a>
                </li>
                <li class="page-item" th:each="i : ${#numbers.sequence(0, totalPages - 1)}" th:classappend="${i == currentPage} ? 'active'">
                    <a class="page-link" th:href="@{'/podcast/home/' + ${i}}" th:text="${i + 1}">1</a>
                </li>
                <li class="page-item" th:classappend="${currentPage == totalPages - 1} ? 'disabled'">
                    <a class="page-link" th:href="@{'/podcast/home/' + ${currentPage + 1}}"><i class="fas fa-chevron-right"></i></a>
                </li>
            </ul>
        </nav>
    </div>

    <div th:insert="~{/fragments/common :: footer}">  </div>
    <script src="/js/bootstrap.bundle.min.js"></script>
</body>
</html>
