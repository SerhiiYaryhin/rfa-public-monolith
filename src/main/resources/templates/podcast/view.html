<!DOCTYPE html>
<html xmlns="http://www.w3.org/1999/xhtml"
      xmlns:th="https://www.thymeleaf.org"
      xmlns:sec="http://www.thymeleaf.org/thymeleaf-extras-springsecurity6"
>
<head>
    <meta charset="utf-8"/>
    <meta name="viewport" content="width=device-width, initial-scale=1">
    <title>Толока - Подкаст: [[${podcast.title}]]</title>
    <div th:insert="~{/fragments/common :: ogpodcast}"/>
    <link rel="icon" type="image/x-icon" href="/assets/favicon.ico"/>
    <script src="https://use.fontawesome.com/releases/v6.3.0/js/all.js" crossorigin="anonymous"></script>
    <link href="/css/bootstrap.min.css" rel="stylesheet"/>
    <style>
        .podcast-hero { background: #fff; padding: 3rem 0; border-bottom: 1px solid #eee; margin-top: 80px; }
        .podcast-cover-large { width: 100%; max-width: 300px; border-radius: 12px; box-shadow: 0 1rem 3rem rgba(0,0,0,.175); }
        .episode-card { border: none; border-bottom: 1px solid #eee; transition: background 0.2s; }
        .episode-card:hover { background: #f8f9fa; }
        .play-btn { width: 45px; height: 45px; border-radius: 50%; display: flex; align-items: center; justify-content: center; font-size: 1.2rem; transition: transform 0.2s; }
        .play-btn:hover { transform: scale(1.1); }
        .rss-link { color: #f26522; font-weight: bold; text-decoration: none; }
    </style>
</head>
<body class="bg-light">
    <header>
        <div th:insert="~{/fragments/navbar :: navbarUniverse}"></div>
    </header>

    <!-- Плеєр -->
    <div th:insert="~{/fragments/mediahub :: audiotemplate}"/>

    <!-- Hero Section -->
    <section class="podcast-hero shadow-sm">
        <div class="container">
            <div class="row align-items-center">
                <div class="col-md-4 text-center mb-4 mb-md-0">
                    <img th:if="${podcast.imagechanelstore != null}" 
                         th:src="'/store/content/' + ${podcast.imagechanelstore.uuid}"
                         class="podcast-cover-large shadow" alt="Cover">
                    <div th:if="${podcast.imagechanelstore == null}" 
                         class="podcast-cover-large bg-secondary d-inline-flex align-items-center justify-content-center text-white-50 mx-auto" style="height: 300px; width: 300px;">
                        <i class="fas fa-microphone-alt fa-6x"></i>
                    </div>
                </div>
                <div class="col-md-8">
                    <h1 class="display-5 fw-bold" th:text="${podcast.title}">Назва</h1>
                    <div class="d-flex align-items-center gap-3 mb-3">
                        <span class="badge bg-primary px-3 py-2 rounded-pill shadow-sm" th:text="${podcast.language}">Мова</span>
                        <a th:href="'/podcast/rss/'+${podcast.uuid}" class="rss-link shadow-sm p-1 rounded">
                            <i class="fas fa-rss-square fa-2x"></i>
                        </a>
                        <small class="text-muted"><i class="fas fa-eye me-1"></i> <span th:text="${podcast.looked}">0</span> переглядів</small>
                    </div>
                    <p class="lead text-muted" th:utext="${podcast.description}">Опис</p>
                    <hr>
                    <div class="small text-muted">
                        Категорії: 
                        <span th:each="cat : ${podcast.itunescategory}" class="me-2 badge bg-light text-dark border">
                            [[${cat.firstlevel}]] <span th:if="${cat.secondlevel}"> / [[${cat.secondlevel}]]</span>
                        </span>
                    </div>
                </div>
            </div>
        </div>
    </section>

    <!-- Епізоди -->
    <div class="container py-5">
        <div class="row">
            <div class="col-lg-10 mx-auto">
                <div th:if="${episodes != null && !episodes.isEmpty()}" class="text-center card-body" style="padding-bottom: 35px;">
                    <audio-player id="audio-player" style="padding:0"
                              th:data-src="'/store/audio/' + ${episodes[0].storeuuid}"
                              th:data-name="${podcast.title}"
                              th:data-autor="${episodes[0].title}"
                    />
                </div>
            </div>
            <div class="col-lg-10 mx-auto">
                <h2 class="mb-4 fw-bold"><i class="fas fa-list-ul text-primary me-2"></i>Епізоди</h2>
                <!-- Пагінація епізодів -->
                <nav aria-label="Episodes Pagination" class="mt-5" th:if="${totalPages > 1}">
                    <ul class="pagination justify-content-center shadow-sm">
                        <li class="page-item" th:classappend="${currentPage == 0} ? 'disabled'">
                            <a class="page-link" th:href="@{'/podcast/view/' + ${podcast.uuid} + '/' + ${currentPage - 1}}"><i class="fas fa-chevron-left"></i></a>
                        </li>
                        <li class="page-item" th:each="i : ${#numbers.sequence(0, totalPages - 1)}" th:classappend="${i == currentPage} ? 'active'">
                            <a class="page-link" th:href="@{'/podcast/view/' + ${podcast.uuid} + '/' + ${i}}" th:text="${i + 1}">1</a>
                        </li>
                        <li class="page-item" th:classappend="${currentPage == totalPages - 1} ? 'disabled'">
                            <a class="page-link" th:href="@{'/podcast/view/' + ${podcast.uuid} + '/' + ${currentPage + 1}}"><i class="fas fa-chevron-right"></i></a>
                        </li>
                    </ul>
                </nav>


                <div class="card shadow-sm border-0">
                    <div class="list-group list-group-flush rounded">
                        <div th:each="item : ${episodes}" class="list-group-item episode-card p-4">
                            <div class="row align-items-center">
                                <div class="col-auto">
                                    <!-- Кнопка Play для нашого Custom Audio Player -->
                                    <button th:if="${item.enclosurestore != null}" 
                                            class="btn btn-primary play-btn shadow"
                                            th:id="${item.enclosurestore.uuid}"
                                            th:data-src="${item.enclosurestore.uuid}"
                                            th:data-name="${podcast.title}"
                                            th:data-autor="${item.title}"
                                            th:onclick="onClickTrack(this.dataset.src, this.dataset.name, this.dataset.autor)"/>
<!--                                            th:onclick="onClickTrack(this,[[${item.title}]],[[${podcast.title}]])">-->
                                        <i class="fas fa-play ms-1"></i>
                                    </button>
                                </div>
                                <div class="col">
                                    <h5 class="mb-1 fw-bold" th:text="${item.title}">Назва епізоду</h5>
                                    <div class="text-muted small mb-2" th:if="${item.description}" 
                                         th:text="${#strings.length(item.description) > 200 ? #strings.substring(item.description, 0, 200) + '...' : item.description}">
                                    </div>
                                        <span><i class="far fa-calendar-alt me-1"></i> [[${#dates.format(item.pubDate, 'dd.MM.yyyy')}]]</span>
                                        <span><i class="far fa-eye me-1"></i> [[${item.looked}]]</span>
                                        <span th:if="${item.timetrack}"><i class="far fa-clock me-1"></i> [[${item.timetrack}]]</span>
                                    </div>
                                </div>
                            </div>
                        </div>
                        <div th:if="${episodes.isEmpty()}" class="p-5 text-center text-muted">
                            <p class="mb-0">Епізодів поки немає.</p>
                        </div>
                    </div>
                </div>

                <!-- Пагінація епізодів -->
                <nav aria-label="Episodes Pagination" class="mt-5" th:if="${totalPages > 1}">
                    <ul class="pagination justify-content-center shadow-sm">
                        <li class="page-item" th:classappend="${currentPage == 0} ? 'disabled'">
                            <a class="page-link" th:href="@{'/podcast/view/' + ${podcast.uuid} + '/' + ${currentPage - 1}}"><i class="fas fa-chevron-left"></i></a>
                        </li>
                        <li class="page-item" th:each="i : ${#numbers.sequence(0, totalPages - 1)}" th:classappend="${i == currentPage} ? 'active'">
                            <a class="page-link" th:href="@{'/podcast/view/' + ${podcast.uuid} + '/' + ${i}}" th:text="${i + 1}">1</a>
                        </li>
                        <li class="page-item" th:classappend="${currentPage == totalPages - 1} ? 'disabled'">
                            <a class="page-link" th:href="@{'/podcast/view/' + ${podcast.uuid} + '/' + ${currentPage + 1}}"><i class="fas fa-chevron-right"></i></a>
                        </li>
                    </ul>
                </nav>
            </div>
        </div>
    </div>

    <div th:insert="~{/fragments/common :: footer}"></div>
    <script type="module" src="/js/audioplayer/audioplayer.js"></script>
    <script src="/js/bootstrap.bundle.min.js"></script>
<!--    <audio-player id="audio-player" style="padding:0"-->
<!--                  th:data-src="'/store/audio/' + ${trackList[0].storeuuid}"-->
<!--                  th:data-name="${trackList[0].name}"-->
<!--                  th:data-autor="${trackList[0].autor}"/>-->
    <script>
        function onClickTrack(track,name,autor) {
            document.getElementById('audio-player').myChangeTrack(track,name,autor);
            // document.getElementById('audio-player').myChangeTrack(event.id,name,autor);
            // Скрол до плеєра (опційно)
            window.scrollTo({ top: 0, behavior: 'smooth' });
        }
    </script>
</body>
</html>
