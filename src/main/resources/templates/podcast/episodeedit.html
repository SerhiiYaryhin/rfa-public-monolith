<!DOCTYPE html>
<html xmlns="http://www.w3.org/1999/xhtml"
      xmlns:th="https://www.thymeleaf.org"
      xmlns:sec="http://www.thymeleaf.org/thymeleaf-extras-springsecurity6"
>
<head>
    <meta charset="utf-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1">
    <title>Толока - Редагування епізоду</title>
    <link rel="icon" type="image/x-icon" href="/assets/favicon.ico" />
    <script src="https://use.fontawesome.com/releases/v6.3.0/js/all.js" crossorigin="anonymous"></script>
    <link href="/css/bootstrap.min.css"  rel="stylesheet" />
    <style>
        .episode-header { background: #f8f9fa; border-radius: 12px; padding: 2rem; margin-bottom: 2rem; margin-top: 100px; }
        .cover-preview { width: 200px; height: 200px; object-fit: cover; border-radius: 12px; box-shadow: 0 0.5rem 1rem rgba(0,0,0,0.1); }
    </style>
</head>
<body class="bg-light">
<header>
    <div th:insert="~{/fragments/navbar :: navbarUniverse}"></div>
</header>

<div class="container py-5">
    <div th:insert="~{/fragments/messagebox :: mymessagebox}"></div>

    <div class="episode-header shadow-sm border-0">
        <div class="row align-items-center">
            <div class="col-md-auto text-center mb-3 mb-md-0">
                <div th:if="${episode.imagestoreitem != null}">
                    <img class="cover-preview mb-2" th:src="'/store/content/' + ${episode.imagestoreitem.uuid}">
                    <br>
                    <a class="btn btn-sm btn-outline-primary" th:href="'/podcast/coverepisodeupload/'+${podcast.uuid}+'/'+${episode.uuid}">
                        <i class="fas fa-sync-alt me-1"></i> Змінити обкладинку
                    </a>
                </div>
                <div th:if="${episode.imagestoreitem == null}">
                    <div class="cover-preview bg-secondary d-flex align-items-center justify-content-center text-white-50 mb-2 mx-auto">
                        <i class="fas fa-image fa-3x"></i>
                    </div>
                    <a class="btn btn-sm btn-primary" th:href="'/podcast/coverepisodeupload/'+${podcast.uuid}+'/'+${episode.uuid}">
                        <i class="fas fa-upload me-1"></i> Додати обкладинку
                    </a>
                </div>
            </div>
            <div class="col-md">
                <h1 class="display-6 fw-bold mb-1">Редагування епізоду</h1>
                <p class="text-muted mb-3">Подкаст: <strong th:text="${podcast.title}"></strong></p>
                <div class="alert alert-info py-2 small" th:if="${episode.enclosurestore != null}">
                    <i class="fas fa-file-audio me-2"></i> Файл: <span th:text="${episode.enclosurestore.filename}"></span>
                </div>
            </div>
            <div class="col-md-auto text-md-end pt-3 pt-md-0">
                <button type="button" class="btn btn-danger" th:onclick="confirmDeleteEpisode([[${podcast.uuid}]], [[${episode.uuid}]])">
                    <i class="fas fa-trash-alt me-2"></i> Видалити епізод
                </button>
            </div>
        </div>
    </div>

    <div class="card shadow-sm border-0 p-4">
        <form th:action="@{'/podcast/episodesave/'+${episode.uuid}}" th:object="${episode}" method="post">
            <input type="hidden" th:field="*{uuid}" />
            <input type="hidden" th:field="*{id}" />
            
            <div class="mb-4">
                <label class="form-label fw-bold">Назва епізоду</label>
                <input type="text" th:field="*{title}" class="form-control form-control-lg" required placeholder="Введіть назву...">
            </div>

            <div class="mb-4">
                <label class="form-label fw-bold">Опис епізоду</label>
                <textarea th:field="*{description}" class="form-control" rows="8" placeholder="Опишіть, про що цей випуск..."></textarea>
            </div>

            <div class="d-flex justify-content-between border-top pt-4">
                <a class="btn btn-outline-secondary px-4" th:href="'/podcast/pedit/'+${podcast.uuid}">
                    <i class="fas fa-arrow-left me-1"></i> Повернутися
                </a>
                <button type="submit" class="btn btn-primary px-5">
                    <i class="fas fa-save me-1"></i> Зберегти зміни
                </button>
            </div>
        </form>
    </div>
</div>

<script th:inline="javascript">
    function confirmDeleteEpisode(puuid, euuid) {
        if (confirm('Ви впевнені, що хочете видалити цей епізод?')) {
            const deleteFile = confirm('Бажаєте також фізично видалити аудіофайл із сервера? \nНатисніть "ОК" для видалення файлу, або "Скасувати" щоб видалити лише запис епізоду.');
            window.location.href = `/podcast/episodedel/${puuid}/${euuid}?deleteFile=${deleteFile}`;
        }
    }
</script>

<div th:insert="~{/fragments/common :: footer}"></div>
<script src="/js/bootstrap.bundle.min.js"></script>
</body>
</html>
