<!DOCTYPE html>
<html xmlns="http://www.w3.org/1999/xhtml"
      xmlns:th="https://www.thymeleaf.org"
      xmlns:sec="http://www.thymeleaf.org/thymeleaf-extras-springsecurity6"
>
<head>
    <meta charset="utf-8" />
    <!--    <meta name="viewport" content="width=device-width, initial-scale=1, shrink-to-fit=no" />-->
    <meta name="viewport" content="width=device-width, initial-scale=1">
    <title>Толока - радіо для всіх!</title>
    <!-- Favicon-->
    <link rel="icon" type="image/x-icon" href="/assets/favicon.ico" />
    <!-- Font Awesome icons (free version)-->
    <script src="https://use.fontawesome.com/releases/v6.3.0/js/all.js" crossorigin="anonymous"></script>
    <!-- Google fonts-->
    <link href="https://fonts.googleapis.com/css?family=Montserrat:400,700" rel="stylesheet" type="text/css" />
    <link href="https://fonts.googleapis.com/css?family=Roboto+Slab:400,100,300,700" rel="stylesheet" type="text/css" />
    <!-- Core theme CSS (includes Bootstrap)-->
    <link href="/css/bootstrap.min.css"  rel="stylesheet" />
    <link th:rel="stylesheet" th:href="@{/css/dropzone.min.css}"/>
    <link th:rel="stylesheet" th:href="@{/css/toastr.min.css}"/>
</head>
<body>
<header>
<!--    <div th:insert="~{/fragments/user :: user_navbar}">  </div>-->
    <div th:insert="~{/fragments/navbar :: navbarUniverse}">  </div>
</header>

<div class="row" style="padding-top: 100px">
    <div class="row">
        <div th:insert="~{/fragments/messagebox :: mymessagebox}">  </div>
    </div>

    <!--                    <div th:insert="~{/fragments/messagebox :: mymessagebox}">  </div>-->
    <div class="col-md-1"></div>
    <form th:action="@{/user/infosave}"  method="post" class="col-md-7">
        <div class="mb-4">
            <div class="card">
                    <div class="card-header py-3">
                        <h5 class="mb-0">Ваша Інформація</h5>
                    </div>
                <div class="card-body">
                    <div class="row mb-3">
                        <div class="col"> <!-- // перший стовбчик-->
                            <div class="form-outline">
                                <input type="hidden" name="id" th:value="${userdetail.id}" />
                                <input
                                        name="userdetail.custname"
                                        th:field="${userdetail.custname}"
                                        th:value="${userdetail.custname}"
                                        type="text" id="userdetail.custname" class="form-control" disabled />
                                <label class="form-label" for="userdetail.custname">Імʼя</label>
                            </div>
                        </div>
                        <div class="col"> <!-- // другий стовбчик-->
                            <div class="form-outline">
                                <input
                                        th:field="${userdetail.custsurname}"
                                        th:value="${userdetail.custsurname}"
                                        name="custsurname" type="text" id="custsurname"   class="form-control" disabled />
                                <label class="form-label" for="custsurname">Призвище</label>
                            </div>
                        </div>
                    </div> <!-- // CustName CustSurName-->
                    <div class="row mb-3"> <!-- // Пошта для логіна -->
                        <div class="form-outline mb-4">
                            <input th:field="${userdetail.user.email}" name="name" type="email" id="name" class="form-control" disabled />
                            <label class="form-label" for="name">Електронна пошта</label>
                        </div>
                    </div> <!-- // Пошта для логіна -->
                    <div class="row mb-3"> <!-- // FirmName -->
                        <div class="form-outline mb-4">
                            <input th:name="userdetail.firmname"
                                   th:field="${userdetail.firmname}"
                                   th:value="*{userdetail.firmname}"
                                   type="text"
                                   id="userdetail.firmname"
                                   class="form-control" />
                            <label class="form-label" for="userdetail.firmname">Найменування організації (якщо юридична особа)</label>
                        </div>
                    </div> <!-- // FirmName -->
                    <div class="row mb-3"> <!-- Адреса -->
                        <div class="form-outline mb-4">
                            <div th:insert="~{/fragments/user :: listaddress}"></div>
                        </div>
                    </div> <!-- Адреса -->
                    <div class="row mb-3">
                        <div class="form-check d-flex justify-content-center mb-2">
<!--                            <input type="checkbox" name="confirm1" th:checked="*{confirm1}" />-->
                            <input th:field="*{userdetail.confirminfo}" class=" form-check-input me-2" type="checkbox" value="" id="userdetail.confirminfo"  />
                            <label class="form-check-label" for="userdetail.confirminfo">
                                З умовами надання сервісу та <a href="https://toloka.media/license/" target="_blank">ліцензією</a>  погоджуюся.
                            </label>
                        </div>
                    </div> <!-- // З правилами ознайомленний -->
                </div>
                <div class="card-footer">
                    <div class="col"> <!-- // перший стовбчик-->
                        <button type="submit" class="btn btn-primary btn-lg btn-block" >
                            Зберегти
                        </button>
                    </div>
                </div>
            </div>
        </div>
    </form>
<!--    =========================================-->
    <div class="col-md-3 mb-3">
        <div class="card mb-4">
            <div class="card-header py-3 text-center">
                <h5 class="mb-0">Ваше Фото</h5>
            </div>
            <div class="card-body text-center">
                <div class="mb-3">
                    <img th:if="${userdetail.profilephoto != null}" th:src="'/store/content/' + ${userdetail.profilephoto.uuid}" 
                         class="img-fluid rounded-circle border shadow-sm" style="width: 150px; height: 150px; object-fit: cover;">
                    <img th:if="${userdetail.profilephoto == null}" src="https://bootdey.com/img/Content/avatar/avatar1.png" 
                         class="img-fluid rounded-circle border shadow-sm" style="width: 150px; height: 150px; object-fit: cover;">
                </div>
                <hr>
                <h6>Змінити фото</h6>
                <div id="dropzone">
                    <form action="/creater/picprofileupload" class="dropzone needsclick border-dashed rounded" id="demo-upload" method="post">
                        <input type="hidden" th:name="${_csrf.parameterName}" th:value="${_csrf.token}"/>
                        <div class="dz-message needsclick py-3">
                            <i class="fas fa-cloud-upload-alt fa-2x text-primary mb-2"></i><br>
                            <span class="small">Перетягніть фото або натисніть</span>
                        </div>
                    </form>
                </div>
                <div class="mt-2 small text-muted">
                    Після завантаження оновіть сторінку.
                </div>
            </div>
        </div>
<!--        <div th:insert="~{/fragments/user :: userrecentactions}">  </div>-->
    </div>
</div>


<script src="/js/bootstrap.bundle.min.js"></script>
<script th:src="@{/js/dropzone.min.js}"></script>
<script th:src="@{/js/toastr.min.js}"></script>

<script>
    Dropzone.options.demoUpload = {
        maxFiles: 1,
        acceptedFiles: 'image/*',
        init: function() {
            this.on("success", function(file, response) {
                toastr.success('Фото завантажено успішно! Оновіть сторінку.');
                setTimeout(function() {
                    location.reload();
                }, 2000);
            });
            this.on("error", function(file, response) {
                toastr.error('Помилка при завантаженні фото.');
            });
        }
    };
</script>

</body>
</html>
