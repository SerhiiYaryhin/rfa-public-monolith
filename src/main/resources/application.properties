# Глобальні налаштування для всіх профілів
# Вимикаємо стандартну сторінку помилок Tomcat (whitelabel)
server.error.whitelabel.enabled=false
server.error.path=/error

# Вимикаємо Spring MVC обробку помилок (використовуємо ErrorPageRegistrar)
spring.mvc.throw-exception-if-no-handler-found=false
spring.web.resources.add-mappings=true

# Дозволяємо Thymeleaf обробляти сторінки помилок
spring.thymeleaf.check-template-location=true
spring.thymeleaf.cache=false

# Логування
logging.level.media.toloka.rfa.config=DEBUG
